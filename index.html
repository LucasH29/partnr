// Maps a competition's finer CM2 category to one of the 5 Interest
// tracks. Law has no direct home among the 5 (it doesn't map cleanly
// onto any of them) so it's left unset there deliberately, rather than
// forced into a track it doesn't fit.
var CAT_TO_TRACK={science:"research",math:"research",business:"business",impact:"impact",arts:"arts",writing:"arts",tech:"tech"};
function addComp(c){
  if(selComps.some(function(s){return s.n===c.n;}))return;
  selComps.push(c);
  setTimeout(function(){if(typeof rememberInterestsPage==="function")rememberInterestsPage();clearSectionErrorsFrom(document.body);},0);
  // A picked, real competition is the strongest interest signal there
  // is - always sets Primary Interest, overriding a prior chip tap or
  // AI read, since nothing is more concrete than a competition someone
  // already knows they're targeting.
  var mappedTrack=CAT_TO_TRACK[c.cat];
  if(mappedTrack){
    S.track=mappedTrack;
    renderInterestChips();
  }
  renderPills();if(exploreOpen)renderCat();
}
function removeComp(name){selComps=selComps.filter(function(c){return c.n!==name;});renderPills();if(exploreOpen)renderCat();if(typeof rememberInterestsPage==="function")rememberInterestsPage();}
function renderPills(){
  var el=document.getElementById("pills");if(!el)return;
  el.innerHTML="";
  if(!selComps.length){
    // Same light-gray ALL CAPS section label used everywhere else on this page.
    var msg=document.createElement("div");msg.className="slabel";msg.style.cssText="width:100%;margin-bottom:2px;";
    msg.textContent="Not sure where to start?";
    var help=document.createElement("div");help.style.cssText="width:100%;font-size:13px;color:#6b6b6b;margin-bottom:8px;";
    help.textContent="Browse by category or let us help.";
    el.appendChild(msg);el.appendChild(help);return;
  }
  selComps.forEach(function(c){
    var cm=CM2[c.cat]||{bg:"#EEEDFE",tc:"#3C3489"};
    var sp=document.createElement("span");sp.className="pill";sp.style.background=cm.bg;sp.style.color=cm.tc;
    var txt=document.createTextNode(c.n+" ");
    var btn=document.createElement("button");btn.textContent="×";
    var name=c.n;
    btn.addEventListener("click",function(){removeComp(name);});
    sp.appendChild(txt);sp.appendChild(btn);el.appendChild(sp);
  });
}

// ── AI competition suggestions from free-text interest ──────
// Asks the AI to pick from Partnr's own real competition list based on
// a student's stated interest — never to invent a new competition or
// state a fact (deadline, prize) not already in the list. Even so,
// every returned name is checked against the real COMPS array before
// rendering, so a model slip can never surface a fabricated result.
// If the student already wrote something in the main idea box, that
// same text IS their stated interest - asking them to type it again in
// a popup was pure redundancy, and worse, whatever they typed here
// never made it back into the main box, so the two could silently
// disagree. Now: already-typed text skips straight to suggestions, and
// whichever text is actually used always gets written back to S.idea,
// so returning to Goals always shows the interest that was really used.

// Reads whatever's in the inline interests panel (chips and/or typed
// text) and gets real competition suggestions - no separate screen, no
// popup, results render right inside the same panel the student is
// already looking at.
async function runInlineSuggestions(){
  var text=document.getElementById("interest-text").value.trim();
  var chipKeys=Array.from(document.querySelectorAll("#interest-chips .chip.on")).map(function(c){return c.dataset.key;});
  var resultsEl=document.getElementById("interest-results");
  if(!text&&!chipKeys.length){
    resultsEl.innerHTML="<div class=\"sec-err\" style=\"margin-top:0;\"><i class=\"ti ti-alert-circle\" style=\"font-size:14px;flex-shrink:0;\"></i>Pick a chip or describe your interest first.</div>";
    return;
  }
  var btn=document.getElementById("interest-go");
  btn.disabled=true;btn.textContent="Thinking…";
  // Reading every competition carefully takes up to a minute, so the
  // wait says what's happening and changes as it goes.
  var waitMsgs=["Reading through "+COMPS.length+" competitions to find your best fits\u2026","Comparing them with what you described\u2026","Picking the ones that fit you best. Almost there\u2026"];
  resultsEl.innerHTML="<div style=\"text-align:center;padding:1rem;\"><div class=\"spin\" style=\"margin:0 auto 10px;\"></div><div id=\"pick-wait\" style=\"font-size:13px;color:#6b6b6b;\">"+(text?waitMsgs[0]:"")+"</div></div>";
  var waitStep=0;
  var waitTimer=text?setInterval(function(){
    var w=document.getElementById("pick-wait");
    if(!w){clearInterval(waitTimer);return;}
    waitStep=Math.min(waitStep+1,waitMsgs.length-1);w.textContent=waitMsgs[waitStep];
  },15000):null;
  try{
    if(text){
      // Typed text goes to the AI, which also reads a category out of
      // it - that read is more informed than a plain chip tap (it's
      // seen the actual description), so it's allowed to override
      // whatever chips happen to be selected right now.
      var result=await fetchCompetitionSuggestions(text,chipKeys.map(function(k){return TR[k].n;}));
      if(result.primaryCategory&&TR[result.primaryCategory]){
        S.track=result.primaryCategory;
        // Second category (e.g. Research for a cancer-prevention club that
        // wants to write a paper) becomes the secondary interest, which
        // also moves it into "Suggested for you" on the Skills page.
        S.secondary=(result.categories||[]).slice(1).map(function(k){return TR[k].n;});
        renderInterestChips();
      }
      renderInlineSuggestionResults(result.suggestions,text);
    } else {
      // Chips only, no text - no need for an AI call at all, just
      // filter the real competition list by the selected categories
      // directly. Cheaper and more literal than asking the AI to
      // interpret something the student never actually described.
      var picks=COMPS.filter(function(c){return chipKeys.indexOf(c.cat)>=0;})
        .sort(compareComps).slice(0,6)
        .map(function(c){return {comp:c,why:c.why};});
      renderInlineSuggestionResults(picks,chipKeys.map(function(k){return TR[k].n;}).join(", "));
    }
  }catch(ex){
    console.error("[Partnr] competition suggestion failed:",ex);
    var notSignedIn=ex&&ex.code==="not_signed_in";
    resultsEl.innerHTML="<div class=\"sec-err\" style=\"margin-top:0;\">"+(notSignedIn?"You've been signed out. Please sign in again.":(ex&&ex.code==="daily_limit")?"You've used today's 10 Help me pick searches. You can still browse by category, or try again tomorrow.":"Something went wrong. Please try again.")+"</div>";
  }
  if(waitTimer)clearInterval(waitTimer);
  btn.disabled=false;btn.textContent="Suggest competitions →";
}

// Calls the edge function in 'suggest_competitions' mode with the full
// real competition list (name, category, team requirement, eligibility,
// cross type, description) so the model can only choose among real,
// accurate entries — never invent a new one or a fact not given here.
// Also asks it to read a single best-fit category out of the same
// text, so a typed description can set Primary Interest directly
// instead of relying on whichever chip happened to be tapped.
async function fetchCompetitionSuggestions(interestText,alsoInterestedIn){
  var session=await getSession();
  if(!session){
    // getSession() reads from local storage and doesn't always force a
    // refresh - a session that looks stale here often isn't actually
    // gone, just not re-validated yet. One explicit refresh attempt
    // before treating this as a real sign-out avoids failing a request
    // for a student who is, in fact, still signed in.
    try{
      var refreshed=await sba.auth.refreshSession();
      session=refreshed&&refreshed.data?refreshed.data.session:null;
    }catch(ex){/* fall through to the not-signed-in error below */}
  }
  if(!session){var e=new Error("You're not signed in anymore");e.code="not_signed_in";throw e;}
  var compList=COMPS.map(function(c){
    var catName=(CM2[c.cat]&&CM2[c.cat].n)||c.cat;
    var typeLabel=c.cross===true?"cross-school ok":c.cross==="prep"?"prep partner":"same school";
    return c.n+" | "+catName+" | "+c.team+" | "+c.eli+" | "+typeLabel+" | "+c.desc;
  }).join("\n");
  var auxLine=(alsoInterestedIn&&alsoInterestedIn.length)?("\nThey also separately marked interest in: "+alsoInterestedIn.join(", ")+" - weigh this alongside their own words, but their own words are the stronger signal if they conflict."):"";
  var prompt="A high school student described their interest as: \""+interestText+"\""+auxLine+"\n\n"+
    "Here is the COMPLETE real list of competitions available on Partnr (name | category | team size | eligibility | type | description):\n"+compList+"\n\n"+
    "Pick the 3 to 5 BEST-FITTING competitions from this exact list for this student's stated interest. "+
    "You MUST only use competition names EXACTLY as they appear above — never invent a new competition, and never state a deadline or prize amount, since none are given here. "+
    "For each pick, write one specific sentence on why it fits what they said. "+
    "Also read their description and pick the 1 or 2 best-fitting categories from this list, best fit first: research, business, impact, tech, law, arts. Pick 2 whenever the description clearly spans two (for example a health nonprofit that also wants to write a research paper is impact AND research). Your competition picks should cover every category you choose.\n\n"+
    "Return ONLY valid JSON: {\"categories\":[\"1 or 2 of research|business|impact|tech|law|arts\"],\"suggestions\":[{\"name\":\"exact name from the list\",\"why\":\"one sentence\"}]}";
  var res=await fetch(SUPABASE_URL+"/functions/v1/match-students",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+session.access_token
    },
    body:JSON.stringify({prompt:prompt,mode:"suggest_competitions",max_tokens:1500})
  });
  if(res.status===429){var lim=new Error("daily limit");lim.code="daily_limit";throw lim;}
  if(!res.ok)throw new Error("status "+res.status);
  var d=await res.json();
  if(d.error)throw new Error("api error");
  var parsed=parseModelJson(d);
  var raw=parsed.suggestions||[];
  // Defensive: only keep suggestions whose name exactly matches a real
  // competition. Anything else is dropped silently — a model slip
  // should never surface a fabricated competition to a student. Same
  // defensiveness for primaryCategory - only ever accept one of the
  // real track keys, never whatever raw string the model returned.
  var kept=[];
  raw.forEach(function(s){
    var real=COMPS.find(function(c){return c.n===s.name;});
    if(real)kept.push({comp:real,why:s.why||real.why});
  });
  var validCats=["research","business","impact","tech","law","arts"];
  var cats=(Array.isArray(parsed.categories)?parsed.categories:[parsed.primaryCategory])
    .filter(function(k,i,arr){return validCats.indexOf(k)>=0&&arr.indexOf(k)===i;}).slice(0,2);
  return {suggestions:kept,primaryCategory:cats[0]||null,categories:cats};
}

// Renders suggestion results right inside the same inline panel -

      "<div style=\"font-size:11px;color:"+cm.c+";margin-bottom:6px;\"><i class=\"ti ti-sparkles\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>"+esc(s.why)+"</div>"+

// ── Saved matches ────────────────────────────
// Every real AI match round is kept in the saved_matches table so a
// returning student sees their matches instead of an empty page. New
// rounds are added on top; anyone already in the list isn't added twice.
function matchKey(m){if(m&&m.realId)return "real:"+m.realId;return ((m&&m.name)||"").trim().toLowerCase()+"|"+((m&&m.school)||"").trim().toLowerCase();}
async function loadSavedMatches(){
  try{
    var res=await sba.from("saved_matches").select("id,match,status,pass_reason,created_at").order("created_at",{ascending:false}).order("id",{ascending:false}).limit(150);
    if(res.error)throw res.error;
    var seen={};var list=[];
    (res.data||[]).forEach(function(r){
      var k=matchKey(r.match);
      if(r.match&&r.match.realId&&!seen[k]){ // older AI example profiles (no realId) are no longer shown
        seen[k]=true;
        // _rowId/_status/_reason live only in memory, never written back into the match itself
        r.match._rowId=r.id;r.match._status=r.status||"active";r.match._reason=r.pass_reason||null;
        list.push(r.match);
      }
    });
    MATCHES=list;
  }catch(ex){console.error("[Partnr] loading saved matches failed:",ex);}
}
async function saveNewMatches(fresh){
  var have={};MATCHES.forEach(function(m){have[matchKey(m)]=true;});
  var added=(fresh||[]).filter(function(m){var k=matchKey(m);if(have[k])return false;have[k]=true;return true;});
  if(added.length){
    try{
      // Inserted oldest-first so the list keeps the AI's order when read back newest-first.
      var ordered=added.slice().reverse();
      var rows=ordered.map(function(m){return {match:m};});
      var ins=await sba.from("saved_matches").insert(rows).select("id");
      if(ins.error)throw ins.error;
      (ins.data||[]).forEach(function(r,i){if(ordered[i])ordered[i]._rowId=r.id;});
    }catch(ex){console.error("[Partnr] saving matches failed (still shown this visit):",ex);}
  }
  added.forEach(function(m){m._status="active";});
  MATCHES=added.concat(MATCHES);
  return added.length;
}

// Pulls the JSON object out of a model reply. The model sometimes adds a
// sentence before or after the JSON, which made a plain JSON.parse throw
// and showed students "Something went wrong".
function parseModelJson(d){
  var txt=(d&&Array.isArray(d.content)?d.content:[]).map(function(b){return b.text||"";}).join("").replace(/```json|```/g,"").trim();
  var a=txt.indexOf("{"),b=txt.lastIndexOf("}");
  if(a<0||b<=a)throw new Error("no JSON in model reply");
  return JSON.parse(txt.slice(a,b+1));
}

// ── Real matching ────────────────────────────
// Matches come only from real, registered students. Nothing is made up:
//  1. Load the real students this student is allowed to see (the
//     students_public view already applies everyone's privacy choice).
//  2. Narrow to the student's own "Who do you want to connect with?"
//     choice. If nobody is there yet, widen one step at a time
//     (school → city → state → country → anyone) and say so.
//  3. The AI ranks the candidates and writes "why you match". If the AI
//     is unavailable, a simple skill/interest score ranks them instead.
var NFIT_OPEN=false; // "Not the right fit?" panel open on Matches
var MATCH_NOTE=""; // e.g. "No one at Viewpoint yet, so here are students in Encino."
var NO_REAL_MATCHES=false;

function normLoc(x){return (x||"").toString().trim().toLowerCase();}
// Same rule as the database: "Oak Park High School." = "Oak Park High".
function normSchool(x){return normLoc(x).replace(/[^a-z0-9 ]+/g," ").replace(/\b(the|school|senior|sr|hs)\b/g," ").replace(/\s+/g," ").trim();}
async function loadMatchCandidates(myId){
  var res=await sba.from("students_public").select("id,name,school,city,state,country,grade,track,role,availability,status,idea,proof_of_work,links,skills_needed,fun_fact,near_me").eq("onboarded",true).neq("id",myId).limit(300);
  if(res.error)throw res.error;
  var shownReal={};MATCHES.forEach(function(m){if(m.realId)shownReal[m.realId]=true;});
  var people=(res.data||[]).filter(function(s){return !BLOCKED_IDS[s.id]&&!shownReal[s.id];});
  if(!people.length)return [];
  var ids=people.map(function(s){return s.id;});
  var sk=await sba.from("skills").select("student_id,category,skill_name,level").in("student_id",ids);
  var cp=await sba.from("competitions").select("student_id,competition_name").in("student_id",ids);
  var skillsBy={},compsBy={};
  (sk.data||[]).forEach(function(r){(skillsBy[r.student_id]=skillsBy[r.student_id]||[]).push(r);});
  (cp.data||[]).forEach(function(r){(compsBy[r.student_id]=compsBy[r.student_id]||[]).push(r.competition_name);});
  people.forEach(function(s){s._skills=skillsBy[s.id]||[];s._comps=compsBy[s.id]||[];});
  return people;
}
// Same school, then city, then same state, then same country, then anyone.
function locationRank(s){
  if(S.school&&s.school&&normSchool(s.school)===normSchool(S.school))return 0;
  // Same city, or within about 25 miles (the database works this out).
  if(s.near_me||(normLoc(s.city)===normLoc(S.city)&&normLoc(s.country)===normLoc(S.country)))return 1;
  if(S.state&&normLoc(s.state)===normLoc(S.state)&&normLoc(s.country)===normLoc(S.country))return 2;
  if(normLoc(s.country)===normLoc(S.country))return 3;
  return 4;
}
function pickByPreference(people){
  var pref=(S.locationPref||"").toLowerCase();
  var startLevel=pref.indexOf("school")>=0?0:pref.indexOf("city")>=0?1:4;
  var levels=[0,1,2,3,4].filter(function(l){return l>=startLevel;});
  var names={0:"at "+(S.school||"your school"),1:"in or near "+(S.city||"your city"),2:"in "+(S.state||"your state"),3:"in "+(S.country||"your country"),4:"around the world"};
  for(var i=0;i<levels.length;i++){
    var lvl=levels[i];
    var found=people.filter(function(s){return locationRank(s)<=lvl;});
    if(found.length){
      MATCH_NOTE=(i>0)?("No one "+names[startLevel]+" yet, so here are students "+names[lvl]+"."):"";
      return found.sort(function(a,b){return locationRank(a)-locationRank(b);});
    }
  }
  MATCH_NOTE="";
  return [];
}
// Simple backup ranking when the AI can't be reached.
function localMatchScore(s){
  var score=0;
  if(s.track&&s.track===S.track)score+=3;
  (S.secondary||[]).forEach(function(n){if(TR[s.track]&&TR[s.track].n===n)score+=2;});
  var myComps=S.comps||[];s._comps.forEach(function(c){if(myComps.indexOf(c)>=0)score+=3;});
  var mySkills=Object.keys(S.skillLevels||{}).map(function(k){return (k.split(":")[1]||k).toLowerCase();});
  var theirs=s._skills.map(function(r){return (r.skill_name||"").toLowerCase();});
  var different=theirs.filter(function(n){return mySkills.indexOf(n)<0;}).length;
  score+=Math.min(different,4); // complementary skills count most
  score+=Math.max(0,3-locationRank(s));
  return score;
}
function realToMatch(s,score,why){
  var swl={};s._skills.slice(0,8).forEach(function(r){swl[r.skill_name]=r.level||"Intermediate";});
  var place=[s.city,s.state&&normLoc(s.country)==="united states"?s.state:""].filter(Boolean).join(", ");
  return {
    realId:s.id,name:s.name,school:s.school||"",city:place||s.city||"",country:s.country||"",grade:s.grade||"",
    avatar:initialsFor(s.name),avatarColor:colorForId(s.id),track:s.track||"",role:s.role||"",
    skillsWithLevels:swl,competitions:s._comps.slice(0,5),matchScore:score,why:why||"",
    availability:s.availability||"Not specified",commitment:"",timezone:"",stage:"",
    bio:s.idea||"",status:s.status||"",lookingFor:s.skills_needed||"",funFact:s.fun_fact||"",languages:[],awards:[],
    experience:(s.proof_of_work||[]).filter(function(p){return p&&p.type!=="Award";}).slice(0,3).map(function(p){return {title:p.title||"",desc:p.desc||p.role||""};}),
    portfolio:null
  };
}
function localWhy(s){
  var bits=[];
  var shared=s._comps.filter(function(c){return (S.comps||[]).indexOf(c)>=0;});
  if(shared.length)bits.push("You're both aiming for "+shared[0]+".");
  if(s.track&&s.track===S.track)bits.push("You share an interest in "+((TR[s.track]||{}).n||s.track)+".");
  var top=s._skills.slice(0,2).map(function(r){return r.skill_name;});
  if(top.length)bits.push("They bring "+top.join(" and ")+".");
  return bits.join(" ")||"Their interests and skills line up with what you're working on.";
}

async function doFetch(){
  try{
    var session=await getSession();
    if(!session)throw new Error("no session");
    NO_REAL_MATCHES=false;
    var people=pickByPreference(await loadMatchCandidates(session.user.id));
    if(!people.length){
      NO_REAL_MATCHES=true;REMATCH_FEEDBACK="";
      goTo("matches");
      return;
    }
    var pool=people.slice(0,40);
    var feedback=REMATCH_FEEDBACK;REMATCH_FEEDBACK=""; // one-time use
    var passed=MATCHES.filter(function(m){return m._status==="passed";}).slice(0,15)
      .map(function(m){return m.name+(m._reason?" ("+m._reason+")":"");});
    var list=pool.map(function(s){
      return s.id+" | "+(s.name||"").split(" ")[0]+" | "+[s.city,s.state,s.country].filter(Boolean).join(", ")+
        " | track: "+(s.track||"?")+" | role: "+(s.role||"?")+
        " | skills: "+(s._skills.slice(0,8).map(function(r){return r.skill_name+(r.level?" ("+r.level+")":"");}).join(", ")||"none listed")+
        " | competitions: "+(s._comps.slice(0,5).join(", ")||"none")+
        " | wants: "+((s.idea||"").slice(0,160).replace(/\n/g," ")||"not shared")+
        " | looking for: "+((s.skills_needed||"").slice(0,100)||"open");
    }).join("\n");
    var prompt="You are Partnr's matching engine for high school students. Pick the best REAL partners for this student from the candidate list.\n\n"+
      "STUDENT: track "+((TR[S.track]||{}).n||S.track||"open")+"; secondary: "+((S.secondary||[]).join(", ")||"none")+"; status: "+(S.status||"open")+
      "\nSkills: "+skStr()+"\nLooking for in a partner: "+(S.skillsNeeded||"open")+
      "\nWants to work on: "+(S.idea||"open")+"\nTarget competitions: "+((S.comps||[]).join(", ")||"none")+
      "\nAvailability: "+(S.availability||"?")+", commitment: "+(S.commit||"?")+
      (feedback?"\nFeedback on the last round: "+feedback:"")+
      (passed.length?"\nThey passed on: "+passed.join("; ")+". Avoid similar mismatches.":"")+
      "\n\nCANDIDATES (id | first name | location | track | role | skills | competitions | wants | looking for):\n"+list+
      "\n\nRULES: Prefer complementary skills and roles (a researcher with a builder, an idea person with someone technical), shared target competitions, and shared interests. "+
      "Candidates are already ordered nearest first; when two are similar, prefer the nearer one. Only use ids from the list. Never invent people or facts.\n"+
      "Pick up to 5. For each give matchScore (50-98, honest) and why: one or two specific sentences about how they complement this student, using only facts from the list.\n"+
      "Return ONLY valid JSON: {\"matches\":[{\"id\":\"candidate id\",\"matchScore\":80,\"why\":\"...\"}]}";
    var picks=null;
    var res=await fetch(SUPABASE_URL+"/functions/v1/match-students",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token},
      body:JSON.stringify({prompt:prompt,max_tokens:1500})
    });
    if(res.status===429){
      var limitInfo={};try{limitInfo=await res.json();}catch(ex){}
      showToast("You've used today's "+(limitInfo.limit||3)+" match rounds. New ones are available tomorrow.");
      goTo("matches");
      return;
    }
    try{
      if(!res.ok)throw new Error("status "+res.status);
      var d=await res.json();
      if(d.error)throw new Error("api error");
      var byId={};pool.forEach(function(s){byId[s.id]=s;});
      picks=(parseModelJson(d).matches||[]).filter(function(p){return p&&byId[p.id];}).slice(0,5).map(function(p){
        var sc=Math.max(50,Math.min(98,parseInt(p.matchScore)||75));
        return realToMatch(byId[p.id],sc,p.why||localWhy(byId[p.id]));
      });
    }catch(aiErr){
      console.error("[Partnr] AI ranking failed, using simple ranking:",aiErr);
      picks=null;
    }
    if(!picks||!picks.length){
      picks=pool.slice().sort(function(a,b){return localMatchScore(b)-localMatchScore(a);}).slice(0,5)
        .map(function(s){return realToMatch(s,Math.min(95,60+localMatchScore(s)*3),localWhy(s));});
    }
    var hadMatches=MATCHES.some(function(m){return m._status==="active";});
    var addedCount=await saveNewMatches(picks);
    goTo("matches");
    if(hadMatches)showToast(addedCount?(addedCount+" new match"+(addedCount>1?"es":"")+" added."):"No new matches this round. Your saved matches are still here.");
  }catch(e){
    console.error("[Partnr] matching failed:",e);
    fallback();
  }
}

// The menu behind the student's initials in the top-right corner.
function bindProfileMenu(){

  if(!av||!menu)return;
  function close(){menu.style.display="none";av.setAttribute("aria-expanded","false");}
  av.addEventListener("click",function(e){

  });

      if(m&&m.style.display!=="none"&&!m.contains(e.target))m.style.display="none";
    });

    b.addEventListener("click",function(){

// Counts real pending requests addressed to this student, so the
// Connections tab shows a badge without opening the tab.
async function updateConnBadge(){
  try{
    var session=await getSession();
    if(!session)return;
    var myId=session.user.id;
    var pendingRes=await sba.from("connections").select("id",{count:"exact",head:true})
      .eq("student_b_id",myId).eq("status","pending");
    var pendingCount=pendingRes.count||0;

    // Unified badge: pending requests + unread messages across every
    // accepted connection, added together into one number — matches
    // how a real inbox works, rather than tracking these separately.
    var connsRes=await sba.from("connections").select("id")
      .eq("status","accepted").or("student_a_id.eq."+myId+",student_b_id.eq."+myId);
    var connIds=(connsRes.data||[]).map(function(c){return c.id;});
    var unreadCount=0;
    if(connIds.length){
      var unreadRes=await sba.from("messages").select("id",{count:"exact",head:true})
        .in("connection_id",connIds).is("read_at",null).neq("sender_id",myId);
      unreadCount=unreadRes.count||0;
    }

    var n=pendingCount+unreadCount;
    var el=document.getElementById("conn-badge");
    if(!el)return;
    el.innerHTML=n?" <span style=\"background:#C53030;color:white;border-radius:20px;padding:1px 7px;font-size:10px;margin-left:2px;font-weight:700;\">"+n+"</span>":"";
  }catch(ex){/* badge is cosmetic — never block the UI on it */}
}

function submitWaitlist(){

  var formErr=document.getElementById("wl-err");

  emailErr.style.display="none";
  formErr.style.display="none";
  if(!email||!email.includes("@")){emailErr.style.display="block";return;}
  btn.textContent="Joining...";btn.disabled=true;
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://formspree.io/f/mkolwgkd",true);
  xhr.setRequestHeader("Accept","application/json");
  xhr.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
  xhr.onload=function(){
    if(xhr.status===200||xhr.status===302){
      document.getElementById("wl-form-wrap").style.display="none";
      document.getElementById("wl-success").style.display="block";
    } else {
      btn.textContent="Join the waitlist →";btn.disabled=false;
      formErr.style.display="block";
    }
  };
  xhr.onerror=function(){
    btn.textContent="Join the waitlist →";btn.disabled=false;
    formErr.style.display="block";
  };
  xhr.send("email="+encodeURIComponent(email)+"&city="+encodeURIComponent(city)+"&_subject="+encodeURIComponent("New Partnr Waitlist Signup!"));

// ── Recruiting Me: real project postings ─────────────
// Replaces the old 100% AI-fictional PROJECTS array. Anyone can browse
// open postings (mirrors how Skill Search already works — discoverable,
// not scoped to a pair); applying sends a real application a project
// owner can accept or decline, same shape as the connections flow.
async function loadRealProjects(){
  var session=await getSession();
  var myId=session&&session.user?session.user.id:null;
  var res=await sba.from("projects").select("*").eq("status","open").order("created_at",{ascending:false}).limit(30);
  if(res.error)throw res.error;
  var projects=(res.data||[]).filter(function(p){return p.student_id!==myId;});
  if(!projects.length)return [];
  var authorIds=projects.map(function(p){return p.student_id;});
  var authorsRes=await sba.from("students_public").select("id,name,school,city,country,role,track").in("id",authorIds);
  var authorsById={};
  (authorsRes.data||[]).forEach(function(a){authorsById[a.id]=a;});
  return projects.map(function(p){return {project:p,author:authorsById[p.student_id]};});
}

    "<div class=\"fi\"><label for=\"pp-spots\">How many partners?</label><input id=\"pp-spots\" type=\"number\" min=\"1\" max=\"10\" value=\""+(parseInt(ex.spots,10)||1)+"\"/></div>"+
    "<div class=\"slabel\">Who should see this?"+req()+"</div>"+

    "<div class=\"slabel\">Stage</div>"+
    "<div id=\"pp-stage\" class=\"stbar\">"+
      ["Idea|spark","Planning|planning","Building|building"].map(function(x){

    "<button class=\"bkbtn\" id=\"pp-cancel\">Cancel</button>";

  function allSkills(){var out=[];SKILL_CATS.forEach(function(c){c.items.forEach(function(i){if(out.indexOf(i)<0)out.push(i);});});return out;}
  function renderPicked(){
    var box=document.getElementById("pp-sk-picked");
    box.innerHTML=picked.map(function(sk,i){return "<span class=\"chip on\" data-i=\""+i+"\" title=\"Remove\">"+esc(sk)+" ×</span>";}).join("");
    box.querySelectorAll(".chip").forEach(function(c){c.addEventListener("click",function(){picked.splice(parseInt(c.dataset.i,10),1);renderPicked();renderPanel(PANEL_CAT);});});
  }
  function addSkill(v){
    v=(v||"").trim().slice(0,60);if(!v)return;
    if(picked.some(function(x){return x.toLowerCase()===v.toLowerCase();}))return;
    if(picked.length>=12){showToast("You can pick up to 12 skills");return;}
    picked.push(v);renderPicked();
  }
  var PANEL_CAT=null;
  function renderPanel(catId){
    var p=document.getElementById("pp-sk-panel");if(p.style.display==="none")return;
    PANEL_CAT=catId;
    if(!catId){
      p.innerHTML="<div class=\"fs-tiles\">"+SKILL_CATS.map(function(c){return "<button type=\"button\" class=\"fs-tile\" data-c=\""+c.id+"\">"+esc(c.label)+"<span>"+c.items.length+" skills</span></button>";}).join("")+"</div>";
      p.querySelectorAll(".fs-tile").forEach(function(b){b.addEventListener("click",function(){renderPanel(b.dataset.c);});});
    } else {
      var cat=SKILL_CATS.find(function(c){return c.id===catId;});
      p.innerHTML="<button type=\"button\" id=\"pp-sp-back\" style=\"background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:10px;\">← All categories</button>"+
        "<div class=\"cgrow\">"+cat.items.map(function(i){return "<span class=\"chip"+(picked.indexOf(i)>=0?" on":"")+"\" data-v=\""+esc(i)+"\">"+esc(i)+"</span>";}).join("")+"</div>";
      document.getElementById("pp-sp-back").addEventListener("click",function(){renderPanel(null);});
      p.querySelectorAll(".chip").forEach(function(ch){ch.addEventListener("click",function(){
        var v=ch.dataset.v,ix=picked.indexOf(v);
        if(ix>=0)picked.splice(ix,1);else addSkill(v);
        renderPicked();renderPanel(catId);
      });});
    }
  }
  renderPicked();
  document.getElementById("pp-sk-browse").addEventListener("click",function(){
    var p=document.getElementById("pp-sk-panel");
    p.style.display=p.style.display==="none"?"block":"none";
    this.textContent=p.style.display==="none"?"Browse skills by category":"Hide categories";
    renderPanel(null);
  });
  var inp=document.getElementById("pp-sk-in"),sug=document.getElementById("pp-sk-sug");
  function showSug(){
    var q=inp.value.trim().toLowerCase();
    if(!q){sug.style.display="none";return;}
    var hits=allSkills().filter(function(x){return x.toLowerCase().indexOf(q)>=0&&picked.indexOf(x)<0;}).slice(0,8);
    var exact=allSkills().some(function(x){return x.toLowerCase()===q;});
    var h=hits.map(function(x){return "<div class=\"pp-sug\" data-v=\""+esc(x)+"\" style=\"padding:9px 12px;font-size:13px;cursor:pointer;\">"+esc(x)+"</div>";}).join("");
    if(!exact)h+="<div class=\"pp-sug\" data-v=\""+esc(inp.value.trim())+"\" style=\"padding:9px 12px;font-size:13px;cursor:pointer;color:#534AB7;font-weight:600;\">+ Add \""+esc(inp.value.trim())+"\"</div>";
    sug.innerHTML=h;sug.style.display="block";
    sug.querySelectorAll(".pp-sug").forEach(function(d){d.addEventListener("mousedown",function(e){e.preventDefault();addSkill(d.dataset.v);inp.value="";sug.style.display="none";});});
  }
  inp.addEventListener("input",showSug);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addSkill(inp.value);inp.value="";sug.style.display="none";}});
  inp.addEventListener("blur",function(){setTimeout(function(){sug.style.display="none";},150);});

  var chosenStage=(ex.stage&&ex.stage!=="submitting")?ex.stage:(ex.stage==="submitting"?"building":"planning");
  document.querySelectorAll("#pp-stage .stb").forEach(function(b){
    if(b.dataset.val===chosenStage)b.classList.add("on");
    b.addEventListener("click",function(){
      document.querySelectorAll("#pp-stage .stb").forEach(function(x){x.classList.remove("on");});
      this.classList.add("on");chosenStage=this.dataset.val;
    });
  });
  mkChips("pp-scope",["My school","My city / region","Anyone"],scopeVal?[scopeVal]:[],true);
  var backTo=function(){if(PROJECT_EDIT_FROM==="me"){PROJECT_EDIT_FROM="";selectTab("me");}else showTab("recruit");};
  document.getElementById("pp-cancel").addEventListener("click",backTo);
  var closeBtn=document.getElementById("pp-close");
  if(closeBtn)closeBtn.addEventListener("click",async function(){
    this.disabled=true;
    var newStatus=ex.status==="open"?"closed":"open";
    var r=await sba.from("projects").update({status:newStatus}).eq("id",ex.id);
    if(r.error){this.disabled=false;showInlineError(this,"Couldn't update. Please try again.");return;}
    showToast(newStatus==="closed"?"Project closed. It no longer shows in Open projects.":"Project reopened.");
    backTo();
  });
  document.getElementById("pp-submit").addEventListener("click",async function(){
    var errBox=document.getElementById("pp-err");errBox.innerHTML="";
    var title=document.getElementById("pp-title").value.trim();
    var desc=document.getElementById("pp-desc").value.trim();
    var valid=true;
    if(!title){showErr("pp-title","Add a project title");valid=false;}
    if(!desc){showErr("pp-desc","Add a short description");valid=false;}
    var scope=getChips("pp-scope")[0];
    if(!scope){showSecErr("pp-scope","Choose who should see this");valid=false;}
    if(!valid){scrollToFirstErr();return;}
    if(inp.value.trim()){addSkill(inp.value);inp.value="";}
    var comp=document.getElementById("pp-comp").value||null;
    var spots=Math.max(1,Math.min(10,parseInt(document.getElementById("pp-spots").value,10)||1));
    var session=await getSession();
    if(!session)return;
    var btn=this;btn.disabled=true;btn.textContent=editing?"Saving…":"Posting…";
    var row={title:title,description:desc,skills:picked,competition_name:comp,spots:spots,stage:chosenStage,location_scope:scope};
    var res=editing?
      await sba.from("projects").update(row).eq("id",ex.id):
      await sba.from("projects").insert(Object.assign({student_id:session.user.id,status:"open"},row));
    if(res.error){
      console.error("[Partnr] saving project failed:",res.error);
      errBox.innerHTML="<div class=\"sec-err\">Couldn't save. Please try again.</div>";
      btn.disabled=false;btn.textContent=editing?"Save changes":"Post project →";
      return;
    }
    showToast(editing?"Project updated.":"Project posted!");
    backTo();
  });
}

// Ensures a real, accepted connection exists between the project owner
// (the one accepting, currently authenticated) and the applicant, so
// chat and workspace unlock exactly the way they do from the normal
// matching flow. Reuses any existing connection between the two rather
// than creating a duplicate. The insert must put the current user as
// student_a_id — confirmed against the real RLS policy rather than
// assumed, since connections_insert_own requires auth.uid() = student_a_id.
async function ensureAcceptedConnection(otherId,projectTitle){
  var session=await getSession();
  if(!session)return;
  var myId=session.user.id;
  try{
    var existing=await sba.from("connections").select("id,status")
      .or("and(student_a_id.eq."+myId+",student_b_id.eq."+otherId+"),and(student_a_id.eq."+otherId+",student_b_id.eq."+myId+")")
      .maybeSingle();
    if(existing.data){
      if(existing.data.status!=="accepted"){
        await sba.from("connections").update({status:"accepted"}).eq("id",existing.data.id);
      }
    } else {
      var insertRes=await sba.from("connections").insert({
        student_a_id:myId,student_b_id:otherId,
        message:"Accepted for \""+projectTitle+"\"",
        status:"accepted"
      });
      if(insertRes.error)console.error("[Partnr] connection insert failed:",insertRes.error);
    }
  }catch(ex){
    console.error("[Partnr] ensureAcceptedConnection failed:",ex);
  }
}

async function rManagePosting(projectId){
  var el=document.getElementById("tc");if(!el)return;
  el.innerHTML="<div style=\"text-align:center;padding:1.5rem;\"><div class=\"spin\" style=\"margin:0 auto;\"></div></div>";
  try{
    var projRes=await sba.from("projects").select("title").eq("id",projectId).single();
    var projectTitle=(projRes.data&&projRes.data.title)||"your project";
    var appsRes=await sba.from("project_applications").select("*").eq("project_id",projectId).order("created_at",{ascending:false});
    var apps=appsRes.data||[];
    var applicantIds=apps.map(function(a){return a.applicant_id;});
    var applicantsById={};
    if(applicantIds.length){
      var studentsRes=await sba.from("students_public").select("id,name,school,city,country").in("id",applicantIds);
      (studentsRes.data||[]).forEach(function(s){applicantsById[s.id]=s;});
    }
    // For accepted applicants, find the chat so the owner can message
    // them right from here.
    var connByApplicant={};
    var acceptedIds=apps.filter(function(a){return a.status==="accepted";}).map(function(a){return a.applicant_id;});
    if(acceptedIds.length){
      var meS=await getSession();var myId=meS&&meS.user?meS.user.id:null;
      if(myId){
        var cRes=await sba.from("connections").select("id,student_a_id,student_b_id").eq("status","accepted").or("student_a_id.eq."+myId+",student_b_id.eq."+myId);
        (cRes.data||[]).forEach(function(c){var other=c.student_a_id===myId?c.student_b_id:c.student_a_id;if(acceptedIds.indexOf(other)>=0)connByApplicant[other]=c.id;});
      }
    }
    var h="<button id=\"mp-back\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#6b6b6b;cursor:pointer;background:none;border:none;margin-bottom:1rem;padding:0;font-family:inherit;\"><i class=\"ti ti-arrow-left\" style=\"font-size:15px;\"></i> Back</button>"+
      "<div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0.5rem;flex-wrap:wrap;\">"+
        "<div style=\"font-size:18px;font-weight:700;\">"+esc(projectTitle)+"</div>"+
        "<button id=\"mp-edit\" class=\"bo\">Edit post</button>"+
      "</div>"+
      "<div class=\"slabel\" style=\"margin-top:0.5rem;\">Applications</div>";
    if(!apps.length){
      h+="<p style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">No applications yet.</p>";
    } else {
      apps.forEach(function(a){
        var applicant=applicantsById[a.applicant_id];
        h+="<div class=\"card\">"+
          "<div style=\"font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:2px;\">"+esc(displayName(applicant?applicant.name:"A student"))+"</div>"+
          "<div style=\"font-size:12px;color:#6b6b6b;margin-bottom:8px;\">"+(applicant?locationLine(null,applicant.city,applicant.country,false):"")+"</div>"+
          (a.message?"<div class=\"why\" style=\"margin-bottom:10px;\">"+esc(a.message)+"</div>":"")+
          (a.status==="pending"?
            "<div style=\"display:flex;gap:8px;\"><button class=\"bc app-accept\" data-id=\""+esc(a.id)+"\" data-applicant=\""+esc(a.applicant_id)+"\" style=\"flex:1;background:#3B6D11;\">Accept</button><button class=\"bo app-decline\" data-id=\""+esc(a.id)+"\">Decline</button></div>":
            (a.status==="accepted"?
              "<div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;\"><span style=\"font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#EAF3DE;color:#3B6D11;\">Accepted</span>"+
              (connByApplicant[a.applicant_id]?"<button class=\"bc app-chat\" data-conn=\""+esc(connByApplicant[a.applicant_id])+"\" data-name=\""+esc(applicant?applicant.name:"")+"\" style=\"background:#7F77DD;flex:1;min-width:160px;\"><i class=\"ti ti-message\" style=\"font-size:13px;vertical-align:-1px;margin-right:4px;\"></i>Message "+esc(displayName(applicant?applicant.name:"them"))+"</button>":"")+
              "</div>":
              "<span style=\"font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#F1EFE8;color:#5F5E5A;\">Declined</span>"))+
        "</div>";
      });
    }
    el.innerHTML=h;
    document.getElementById("mp-back").addEventListener("click",function(){showTab("recruit");});
    document.getElementById("mp-edit").addEventListener("click",function(){openProjectEditor(projectId,"recruit");});
    document.querySelectorAll(".app-accept").forEach(function(b){
      b.addEventListener("click",async function(){
        var btn=this;btn.disabled=true;btn.textContent="Accepting…";
        await sba.from("project_applications").update({status:"accepted"}).eq("id",this.dataset.id);
        await ensureAcceptedConnection(this.dataset.applicant,projectTitle);
        showToast("Accepted! Chat and workspace are now open in your Inbox");
        rManagePosting(projectId);
      });
    });
    document.querySelectorAll(".app-chat").forEach(function(b){
      b.addEventListener("click",function(){rChat(this.dataset.conn,this.dataset.name);});

    document.querySelectorAll(".app-decline").forEach(function(b){
      b.addEventListener("click",async function(){
        await sba.from("project_applications").update({status:"declined"}).eq("id",this.dataset.id);
        rManagePosting(projectId);
      });
    });
  }catch(ex){
    console.error("[Partnr] loading applications failed:",ex);
    el.innerHTML="<p style=\"text-align:center;color:#6b6b6b;padding:2rem;\">Couldn't load applications. Please try again.</p>";
  }
}


function dCards(){
  if(!DEADLINE_DATA_LOADED){
    return "<div class=\"slabel\" style=\"margin-top:0;\">Competition calendar</div><div style=\"text-align:center;padding:2rem;color:#6b6b6b;\">Loading verified deadlines…</div>";
  }

  var trackToCats={research:["science","math"],business:["business"],impact:["impact"],arts:["arts","writing"],tech:["tech"],law:["law"]};
  var myCats=trackToCats[S.track]||[];

  // Main list: only genuinely confirmed, actionable deadlines - real
  // dates the backend has independently verified are current.
  var upcoming=COMPS.filter(function(c){
    var d=DEADLINE_DATA[c.n];
    // Guard against stale data: a "confirmed" deadline that has already
    // passed (not yet re-checked by the weekly verification job) should
    // never show as "-2d left, Act now" - exclude it rather than
    // display a date that's already gone.
    return d&&d.status==="confirmed"&&d.deadline_date&&daysUntilISODate(d.deadline_date)>=0;
  }).map(function(c){
    return {comp:c,deadline_date:DEADLINE_DATA[c.n].deadline_date,sortDays:daysUntilISODate(DEADLINE_DATA[c.n].deadline_date)};
  });
  upcoming.sort(function(a,b){return a.sortDays-b.sortDays;});

  // Secondary, honest section: competitions currently running (entry
  // closed) with a real cycle-end date - useful status, not a deadline.
  var running=COMPS.filter(function(c){
    var d=DEADLINE_DATA[c.n];
    return d&&d.status==="cycle_active"&&d.cycle_end_date;
  }).map(function(c){
    return {comp:c,cycle_end_date:DEADLINE_DATA[c.n].cycle_end_date};
  });
  running.sort(function(a,b){return parseISODate(a.cycle_end_date)-parseISODate(b.cycle_end_date);});

  if(!upcoming.length&&!running.length){
    return "<div class=\"slabel\" style=\"margin-top:0;\">Competition calendar</div><div style=\"text-align:center;padding:2rem;color:#6b6b6b;\">No confirmed upcoming deadlines right now. Check back as we verify new cycles.</div>";
  }

  var h="<div class=\"slabel\" style=\"margin-top:0;\">Competition calendar</div>";

  upcoming.forEach(function(item){
    var c=item.comp;
    var cm=CM2[c.cat]||{c:"#7F77DD",bg:"#EEEDFE",tc:"#3C3489"};
    var isRecommended=myCats.indexOf(c.cat)>=0;
    var days=item.sortDays;
    var urg=days<=45,soon=days>45&&days<=90;
    var ubg=urg?"#FCEBEB":soon?"#FAEEDA":"#EAF3DE";
    var uc=urg?"#A32D2D":soon?"#854F0B":"#3B6D11";
    var ut=urg?"Act now":soon?"Coming up":"Upcoming";
    var p=item.deadline_date.split("-");
    var monthLabel=MONTH_NAMES[parseInt(p[1],10)-1];
    var dayLabel=parseInt(p[2],10);
    h+="<div class=\"dl\" style=\""+(isRecommended?"border-color:"+cm.c+";border-width:2px;":"")+"\">"+
      "<div style=\"text-align:center;min-width:46px;flex-shrink:0;\">"+
        "<div style=\"font-size:10px;font-weight:600;color:#6b6b6b;text-transform:uppercase;\">"+monthLabel+"</div>"+
        "<div style=\"font-size:22px;font-weight:700;color:#1a1a1a;line-height:1.1;\">"+dayLabel+"</div>"+
        "<div style=\"font-size:10px;padding:2px 5px;border-radius:20px;font-weight:600;background:"+ubg+";color:"+uc+";display:inline-block;margin-top:3px;\">"+ut+"</div>"+
      "</div>"+
      "<div style=\"flex:1;\">"+
        "<div style=\"display:flex;align-items:center;gap:5px;margin-bottom:3px;\">"+
          "<div style=\"font-size:14px;font-weight:600;color:#1a1a1a;\">"+c.n+"</div>"+

// ── Connections: real inbox ──────────────────
// Reads real rows from the connections table in both directions.
// Incoming pending requests are what matter most — this is the only
// place today where one real student sends another real student
// free text, so accept / decline / report all live here.
async function loadRealConnections(){
  var session=await getSession();
  if(!session)return {incoming:[],outgoing:[],accepted:[],me:null};
  var me=session.user.id;
  var res=await sba.from("connections").select("*").or("student_a_id.eq."+me+",student_b_id.eq."+me).order("created_at",{ascending:false});
  var rows=res.data||[];
  if(!rows.length)return {incoming:[],outgoing:[],accepted:[],me:me};

  var otherIds=rows.map(function(r){return r.student_a_id===me?r.student_b_id:r.student_a_id;});
  var pplRes=await sba.from("students_public").select("id,name,school,city,country,track,role").in("id",otherIds);
  var ppl={};
  (pplRes.data||[]).forEach(function(p){ppl[p.id]=p;});

  var incoming=[],outgoing=[],accepted=[];
  rows.forEach(function(r){
    var otherId=r.student_a_id===me?r.student_b_id:r.student_a_id;
    // A blocked student's profile is hidden by RLS, so ppl[otherId]
    // comes back undefined — skip those rows entirely rather than
    // rendering a ghost entry.
    if(!ppl[otherId])return;
    var item={row:r,other:ppl[otherId],otherId:otherId};
    if(r.status==="accepted")accepted.push(item);
    else if(r.student_b_id===me&&r.status==="pending")incoming.push(item);
    else if(r.student_a_id===me&&r.status==="pending")outgoing.push(item);
  });
  return {incoming:incoming,outgoing:outgoing,accepted:accepted,me:me};
}

async function respondToConnection(connId,newStatus){
  return await sba.from("connections").update({status:newStatus}).eq("id",connId);
}

// Honest alternative to promising a response time nobody can control:
// shows how long a request has actually been sitting, computed from the
// real timestamp. This creates real pressure to respond without Partnr
// claiming a commitment it has no way to enforce.
function daysWaitingInfo(createdAt){
  var days=Math.floor((Date.now()-new Date(createdAt).getTime())/(1000*60*60*24));
  var label=days<=0?"Sent today":days===1?"Waiting 1 day":"Waiting "+days+" days";
  return {label:label,urgent:days>=3};
}

async function loadWorkspaceItems(connectionId){
  var el=document.getElementById("ws-list");if(!el)return;
  try{
    var res=await sba.from("workspace_items").select("*").eq("connection_id",connectionId).order("created_at",{ascending:false});
    if(res.error)throw res.error;
    var items=res.data||[];
    if(!items.length){
      el.innerHTML="<p style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">Nothing shared yet. Add a link or upload a document below.</p>";
      return;
    }
    var session=await getSession();
    var myId=session&&session.user?session.user.id:null;
    var rows=[];
    for(var i=0;i<items.length;i++){
      var it=items[i];
      var mine=it.student_id===myId;
      var icon=it.type==="link"?"ti-link":"ti-file";
      var actionHtml;
      if(it.type==="link"){
        actionHtml="<a href=\""+safeUrl(it.url)+"\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;color:#7F77DD;text-decoration:none;\">Open →</a>";
      } else {
        var signed=await sba.storage.from("workspace-files").createSignedUrl(it.storage_path,3600);
        var dlUrl=(signed&&signed.data&&signed.data.signedUrl)||"#";
        actionHtml="<a href=\""+safeUrl(dlUrl)+"\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;color:#7F77DD;text-decoration:none;\">Download →</a>";
      }
      rows.push("<div class=\"pit\">"+
        "<i class=\"ti "+icon+"\" style=\"font-size:18px;color:#6b6b6b;\"></i>"+
        "<div style=\"flex:1;min-width:0;\"><div style=\"font-size:13px;font-weight:600;color:#1a1a1a;\">"+esc(it.title)+"</div>"+actionHtml+"</div>"+
        (mine?"<button class=\"ws-delete\" data-id=\""+esc(it.id)+"\" style=\"background:none;border:none;cursor:pointer;color:#6b6b6b;font-size:15px;\">×</button>":"")+
      "</div>");
    }
    el.innerHTML=rows.join("");
    document.querySelectorAll(".ws-delete").forEach(function(btn){
      btn.addEventListener("click",async function(){
        await sba.from("workspace_items").delete().eq("id",this.dataset.id);
        loadWorkspaceItems(connectionId);
      });
    });
  }catch(ex){
    console.error("[Partnr] workspace load failed:",ex);
    el.innerHTML="<p style=\"font-size:13px;color:#C53030;\">Couldn't load workspace items. Please try again.</p>";
  }
}

async function addWorkspaceLink(connectionId){
  var title=document.getElementById("ws-link-title").value.trim();
  var url=document.getElementById("ws-link-url").value.trim();
  if(!title||!url){showToast("Add both a title and a link");return;}
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  var session=await getSession();
  if(!session)return;
  var res=await sba.from("workspace_items").insert({
    connection_id:connectionId,student_id:session.user.id,type:"link",title:title,url:url
  });
  if(res.error){showInlineError(document.getElementById("ws-link-url"),"Couldn't add the link. Please try again.");return;}

async function uploadWorkspaceFile(connectionId,inputEl){
  var file=inputEl.files[0];
  if(!file)return;
  var ext=file.name.split(".").pop().toLowerCase();
  var statusEl=document.getElementById("ws-upload-status");
  if(WORKSPACE_ALLOWED_EXT.indexOf(ext)<0){
    statusEl.textContent="That file type isn't supported. Documents only (PDF, Word, PowerPoint, Excel, text, CSV).";
    statusEl.style.color="#C53030";
    inputEl.value="";
    return;
  }
  if(file.size>WORKSPACE_MAX_BYTES){
    statusEl.textContent="That file is too large (10MB max).";
    statusEl.style.color="#C53030";
    inputEl.value="";
    return;
  }
  statusEl.textContent="Uploading…";
  statusEl.style.color="#6b6b6b";
  var session=await getSession();
  if(!session)return;
  var path=connectionId+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  try{
    var uploadRes=await sba.storage.from("workspace-files").upload(path,file);
    if(uploadRes.error)throw uploadRes.error;
    var insertRes=await sba.from("workspace_items").insert({
      connection_id:connectionId,student_id:session.user.id,type:"file",title:file.name,storage_path:path
    });
    if(insertRes.error)throw insertRes.error;
    statusEl.textContent="Uploaded.";
    statusEl.style.color="#3B6D11";
    inputEl.value="";
    loadWorkspaceItems(connectionId);
  }catch(ex){
    console.error("[Partnr] file upload failed:",ex);
    statusEl.textContent="Upload failed. Please try again.";
    statusEl.style.color="#C53030";
  }
}

// ── Chat (per accepted connection) ────────────
// Text-only by design — files and images live in Workspace, not here.
// Messages are immutable once sent (no edit/delete policy exists at
// all), so a real, untampered conversation history is always available
// if a report is ever filed. Real-time via Supabase's built-in
// postgres_changes subscription — no separate infrastructure needed.
var CHAT_CHANNEL=null;

// Soft, non-blocking nudge — never prevents sending, just asks once.
// Off-platform contact means the conversation can no longer be
// reviewed if something goes wrong, which is the whole safety value
// of keeping it on Partnr in the first place.
function looksLikeContactInfo(text){
  var phonePattern=/\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b/;
  var emailPattern=/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/i;
  var socialPattern=/\b(snap(chat)?|insta(gram)?|discord|whatsapp|telegram|kik)\b/i;
  return phonePattern.test(text)||emailPattern.test(text)||socialPattern.test(text);
}

// Shows a crisis resource to the person who just typed the message —
// modeled on how a search engine surfaces a resource banner to a
// searcher, not a report routed to anyone for review. The message
// still sends normally either way: never blocked, never delayed, and
// this card is never seen by the recipient or stored anywhere. No
// queue, no notification to anyone else, nothing for a human on the
// other end to catch or act on in real time.
var SELF_HARM_PATTERNS=[
  /kill myself/i,/killing myself/i,/want to die/i,/wanted to die/i,
  /end my life/i,/ending my life/i,/i'?m suicidal/i,
  /hurt myself/i,/hurting myself/i,
  /don'?t want to (live|be alive)/i,/no reason to live/i
];
function matchesSelfHarmConcern(text){
  return SELF_HARM_PATTERNS.some(function(p){return p.test(text);});
}

      "<button id=\"chat-send\" style=\"padding:10px 16px;background:#7F77DD;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;\">Send</button>"+

async function sendChatMessage(connectionId,text){
  var session=await getSession();
  if(!session)return;
  var res=await sba.from("messages").insert({connection_id:connectionId,sender_id:session.user.id,body:text});
  if(res.error){showErrorToast("Couldn't send your message. Please try again.");console.error("[Partnr] send message failed:",res.error);}
}

async function loadChatMessages(connectionId){
  var el=document.getElementById("chat-messages");if(!el)return;
  try{
    var res=await sba.from("messages").select("*").eq("connection_id",connectionId).order("created_at",{ascending:true});
    if(res.error)throw res.error;
    var session=await getSession();
    var myId=session&&session.user?session.user.id:null;
    renderChatMessages(res.data||[],myId);
    markMessagesRead(connectionId,myId);
  }catch(ex){
    console.error("[Partnr] loading messages failed:",ex);
    el.innerHTML="<p style=\"font-size:13px;color:#C53030;text-align:center;\">Couldn't load messages. Please try again.</p>";
  }
}

function renderChatMessages(msgs,myId){
  var el=document.getElementById("chat-messages");if(!el)return;
  if(!msgs.length){
    el.innerHTML="<p style=\"font-size:13px;color:#6b6b6b;text-align:center;margin:auto;\">Say hi! This is the start of your conversation.</p>";
    return;
  }
  el.innerHTML=msgs.map(function(m,i){
    var mine=m.sender_id===myId;
    // Only the LAST of my own messages shows a read receipt — matches
    // how most chat apps do it, rather than a checkmark on every line.
    var isLastMine=mine&&(i===msgs.length-1||msgs.slice(i+1).every(function(x){return x.sender_id===myId;}));
    var readLabel=(mine&&isLastMine&&m.read_at)?"<div style=\"font-size:10px;color:#9a97c9;text-align:right;margin-top:2px;\">Read</div>":"";
    return "<div style=\"align-self:"+(mine?"flex-end":"flex-start")+";max-width:75%;\">"+
      "<div style=\"background:"+(mine?"#7F77DD":"white")+";color:"+(mine?"white":"#1a1a1a")+";padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;word-break:break-word;\">"+esc(m.body)+"</div>"+
      readLabel+
    "</div>";
  }).join("");
  el.scrollTop=el.scrollHeight;
}

async function markMessagesRead(connectionId,myId){
  try{
    await sba.from("messages").update({read_at:new Date().toISOString()})
      .eq("connection_id",connectionId).is("read_at",null).neq("sender_id",myId);
    updateConnBadge();
  }catch(ex){/* cosmetic — never block chat on this */}
}

// Real-time: on any new message in this connection, re-fetch and
// re-render. Simpler and more robust than trying to append just the
// one new row (also self-corrects if a message was somehow missed).
function subscribeChatChannel(connectionId){
  unsubscribeChatChannel();
  CHAT_CHANNEL=sba.channel("messages-"+connectionId)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"connection_id=eq."+connectionId},async function(){
      var session=await getSession();
      var myId=session&&session.user?session.user.id:null;
      var res=await sba.from("messages").select("*").eq("connection_id",connectionId).order("created_at",{ascending:true});
      renderChatMessages(res.data||[],myId);
      markMessagesRead(connectionId,myId);
    })
    .subscribe();
}
function unsubscribeChatChannel(){
  if(CHAT_CHANNEL){sba.removeChannel(CHAT_CHANNEL);CHAT_CHANNEL=null;}
}

function bindMeTab(){

  if(blkBtn)blkBtn.addEventListener("click",renderBlockedList);

  // same as the account's login email - a student who followed our own
  // onboarding advice ("use a personal email so you never lose access")
  // needs a way to prove a DIFFERENT address actually belongs to their
  // school. Without this, that button could never work for anyone who
  // took that advice, which is most students.
  var vEmailBtn=document.getElementById("verifyEmailBtn");
  if(vEmailBtn)vEmailBtn.addEventListener("click",function(){
    var wrap=vEmailBtn.parentNode;
    vEmailBtn.style.display="none";
    var inputBox=document.createElement("div");
    inputBox.id="verifyEmailInputBox";

      "<button id=\"sendVerifyCodeBtn\" style=\"font-size:12px;font-weight:600;color:#fff;background:#534AB7;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;\">Send code</button>";
    wrap.appendChild(inputBox);
    var schoolEmailInputEl=document.getElementById("schoolEmailInput");
    // Pre-fill only if the login email is itself already a non-personal
    // domain - a small convenience, never assumed otherwise.
    schoolEmailInputEl.value=(S.email&&PERSONAL_EMAIL_DOMAINS.indexOf(getEmailDomain(S.email))<0)?S.email:"";
    schoolEmailInputEl.focus();
    function showVerifyEmailErr(msg){
      var errBox=document.getElementById("verifyEmailErr");
      if(!errBox){
        errBox=document.createElement("div");
        errBox.id="verifyEmailErr";
        errBox.style.cssText="margin-top:6px;font-size:12px;color:#A32D2D;width:100%;";
        wrap.appendChild(errBox);
      }
      errBox.textContent=msg;
    }
    document.getElementById("sendVerifyCodeBtn").addEventListener("click",async function(){
      var typedEmail=document.getElementById("schoolEmailInput").value.trim();

        showVerifyEmailErr("Enter a valid email address.");

      function makeCode(){
        var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";var c="";
        for(var i=0;i<6;i++)c+=chars[Math.floor(Math.random()*chars.length)];
        return c;
      }
      try{
        var session=await getSession();
        var code=null,attemptsN=0;
        while(attemptsN<3&&!code){
          var candidate=makeCode();
          var ins=await sba.from("school_email_verification_codes").insert({
            student_id:session.user.id,code:candidate,expected_domain:domain,claimed_email:typedEmail
          });
          if(!ins.error)code=candidate;
          attemptsN++;
        }
        if(!code){throw new Error("Could not generate a unique code");}
        inputBox.innerHTML="Send an email from <strong>"+esc(typedEmail)+"</strong> to <strong>verify@projectpartnr.com</strong> with this code anywhere in the subject line:"+
          "<div style=\"font-size:18px;font-weight:700;letter-spacing:2px;margin:8px 0;color:#534AB7;\">"+code+"</div>"+

          var btn=this;btn.disabled=true;btn.textContent="Checking…";

            var msgEl=document.getElementById("verifyStatusMsg");

              S.schoolVerification="verified";

// ── Skill search ────────────────────────────
async function srchSkill(opts){
  if(typeof opts==="string")opts={query:opts};
  opts=opts||{};
  var query=(opts.query||"").trim();
  var competition=(opts.competition||"").trim();
  var category=(opts.category||"").trim();
  var subcat=(opts.subcat||"").trim();
  var city=(opts.city||"").trim();
  var school=(opts.school||"").trim();
  var country=(opts.country||"").trim();
  var SUBCAT_LABELS={coding:"Coding",robotics:"Robotics"};
  var browseAll=!!opts.all;
  // Example profiles are only ever shown for a plain text search with
  // "Anyone" selected. With a school, city, or competition filter on they
  // would claim to be "at Viewpoint School" when they're really in Senegal.
  var isFilterOnly=true; // never show made-up profiles

  var descParts=[];
  if(query)descParts.push("\""+query+"\"");
  if(competition)descParts.push(competition);
  if(category)descParts.push("all "+((CM2[category]&&CM2[category].n)||category)+" competitions");
  if(subcat)descParts.push("all "+(SUBCAT_LABELS[subcat]||subcat)+" competitions");
  if(city)descParts.push("in "+city);
  if(school)descParts.push("at "+school);
  if(country)descParts.push("in "+country);
  var desc=descParts.join(" · ")||(browseAll?"everyone":"partners");

  var el=document.getElementById("sr");if(!el)return;
  el.innerHTML="<div style=\"text-align:center;padding:1.5rem;\"><div class=\"spin\" style=\"margin:0 auto 0.5rem;\"></div><div style=\"font-size:13px;color:#6b6b6b;\">Searching for "+esc(desc)+"...</div></div>";
  try{
    var session=await getSession();
    var myId=session&&session.user?session.user.id:null;
    var base={all:browseAll,query:query,competition:competition,category:category,subcat:subcat};
    var real=await searchRealStudents(Object.assign({city:city,school:school,country:country},base),myId);
    if(real.length){renderSR(real,desc,false);return;}
    // Nobody at that level yet: widen one step at a time and say so.
    var steps=[];
    if(school)steps.push({o:{city:S.city},label:"in "+(S.city||"your city"),from:"at "+school});
    if(school||city)steps.push({o:{country:S.country},label:"in "+(S.country||"your country"),from:school?"at "+school:"in "+city});
    if(school||city||country)steps.push({o:{all:!(query||competition||category||subcat)},label:"around the world",from:school?"at "+school:city?"in "+city:"in "+country});
    for(var si=0;si<steps.length;si++){
      var wider=await searchRealStudents(Object.assign({},base,steps[si].o),myId);
      if(wider.length){
        renderSR(wider,desc.replace(/ · (at|in) .*$/,"")+" · "+steps[si].label,false);
        el.insertAdjacentHTML("afterbegin","<div style=\"font-size:13px;color:#534AB7;background:#EEEDFE;border-radius:8px;padding:8px 12px;margin-bottom:10px;\">No one "+esc(steps[si].from)+" yet, so here are students "+esc(steps[si].label)+".</div>");
        return;
      }
    }
  }catch(ex){
    console.error("[Partnr search] failed:",ex);
    el.innerHTML="<div style=\"text-align:center;padding:2rem 1rem;\">"+
      "<i class=\"ti ti-alert-circle\" style=\"font-size:32px;color:#C53030;\"></i>"+
      "<div style=\"font-size:14px;font-weight:600;color:#1a1a1a;margin:10px 0 6px;\">Search didn't work</div>"+
      "<div style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">Something went wrong reaching the student database. Check your connection and try again.</div>"+
    "</div>";
    return;
  }
  if(isFilterOnly){
    // Structured filters (competition/city/school) found no real matches.
    // Demo profiles here would actively mislead — they wouldn't actually
    // be at that school or targeting that competition — so this gets an
    // honest empty state instead of a fabricated result.
    el.innerHTML="<div style=\"text-align:center;padding:2rem 1rem;\">"+
      "<i class=\"ti ti-users-group\" style=\"font-size:32px;color:#AFA9EC;\"></i>"+
      "<div style=\"font-size:14px;font-weight:600;color:#1a1a1a;margin:10px 0 6px;\">No real students match yet</div>"+
      "<div style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">"+(browseAll?"No other students have joined yet. Check back soon.":"Nobody who has joined so far matches "+esc(desc)+". Check back as more students join, or try widening your filters.")+"</div>"+
    "</div>";
    return;
  }
  // Free-text search with no real matches — show demo profiles instead,
  // clearly labeled so nobody mistakes them for real matches.
  // (No made-up example profiles: the honest empty state above always shows.)
}

// Red error shown right under the button the student just pressed.
// Falls back to a red message at the bottom of the screen when there's
// no button to attach it to.
function showInlineError(anchor,msg){
  if(!anchor||!anchor.parentNode){showErrorToast(msg);return;}
  var next=anchor.nextSibling;
  if(next&&next.classList&&next.classList.contains("inline-err"))next.remove();
  var d=document.createElement("div");
  d.className="sec-err inline-err";
  d.setAttribute("role","alert");
  d.style.marginTop="8px";
  d.innerHTML="<i class=\"ti ti-alert-circle\" style=\"font-size:14px;flex-shrink:0;\"></i>";
  d.appendChild(document.createTextNode(msg));
  anchor.parentNode.insertBefore(d,anchor.nextSibling);
  setTimeout(function(){if(d.parentNode)d.remove();},10000);
}
function showErrorToast(msg){
  var t=document.createElement("div");
  t.setAttribute("role","alert");
  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#FFF5F5;color:#A32D2D;border:1px solid #FEB2B2;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.12);max-width:90vw;text-align:center;";
  document.body.appendChild(t);

}

  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2);";

var PASS_REASONS=["Wrong skills","Too far","Different goals","Just not a fit"];
var SHOW_PASSED=false;

async function setMatchStatus(m,status,reason){
  m._status=status;m._reason=reason||null;
  if(!m._rowId||MATCHES_ARE_DEMO)return; // example profiles only live in this visit
  try{
    var res=await sba.from("saved_matches").update({status:status,pass_reason:reason||null}).eq("id",m._rowId);
    if(res.error)throw res.error;
  }catch(ex){console.error("[Partnr] saving match status failed:",ex);}
}
function refreshMatchesTab(){
  if(CURRENT_TAB==="matches"){var el=document.getElementById("tc");if(el){el.innerHTML=mCards();bindME();}}
  else if(CURRENT_TAB==="board"){renderBoard();}
}
function animateCardAway(card,dir,done){
  if(!card){done();return;}
  card.style.transition="transform .3s ease,opacity .3s ease";
  card.style.transform="translateX("+(dir==="left"?"-":"")+"120%) rotate("+(dir==="left"?"-":"")+"8deg)";
  card.style.opacity="0";
  setTimeout(done,300);
}
function passMatch(i,reason){
  var m=MATCHES[i];if(!m)return;
  var prev=m._status||"active";
  var card=document.querySelector(".mcard[data-idx=\""+i+"\"]");
  animateCardAway(card,"left",function(){
    setMatchStatus(m,"passed",reason);refreshMatchesTab();
    showUndoToast("Passed on "+nameInSentence(m.name)+". Your next round will learn from this.",function(){setMatchStatus(m,prev,null);refreshMatchesTab();});
  });
}
// Saving keeps the card in Matches (marked Saved) and also puts it on
// My board. Tapping the heart again unsaves it; swiping right only saves.
function saveMatch(i,saveOnly){
  var m=MATCHES[i];if(!m)return;
  if(m._status==="saved"){
    if(saveOnly){refreshMatchesTab();return;}
    setMatchStatus(m,"active",null);refreshMatchesTab();return;
  }
  setMatchStatus(m,"saved",null);refreshMatchesTab();
  showToast("Saved "+nameInSentence(m.name)+". You'll also find them on My board.");
}
// Swipe left to pass, right to save. Vertical scrolling still works
// (touch-action:pan-y on the card); buttons inside the card are ignored.
function enableSwipe(card){
  var startX=0,dx=0,active=false,pid=null;
  card.addEventListener("pointerdown",function(e){
    if(e.target.closest("button,a,input,textarea"))return;
    active=true;startX=e.clientX;dx=0;pid=e.pointerId;card.style.transition="none";
  });
  card.addEventListener("pointermove",function(e){
    if(!active||e.pointerId!==pid)return;
    dx=e.clientX-startX;
    if(Math.abs(dx)>8){try{card.setPointerCapture(pid);}catch(ex){}}
    card.style.transform="translateX("+dx+"px) rotate("+(dx/30)+"deg)";
    card.style.boxShadow=dx<-60?"0 0 0 2px #ccc":dx>60?"0 0 0 2px #f1c7d6":"";
  });
  function end(){
    if(!active)return;active=false;card.style.boxShadow="";
    var i=parseInt(card.dataset.idx);
    if(dx<-110)passMatch(i,null);
    else if(dx>110)saveMatch(i,true);
    else{card.style.transition="transform .2s ease";card.style.transform="";}
  }
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
}

var BOARD_PINS=null; // null = not loaded yet this visit

async function loadBoardPins(force){
  if(BOARD_PINS&&!force)return BOARD_PINS;
  try{
    var res=await sba.from("board_pins").select("id,kind,title,data,position,created_at").order("position",{ascending:true}).order("id",{ascending:true});
    if(res.error)throw res.error;
    BOARD_PINS=res.data||[];
  }catch(ex){console.error("[Partnr] loading board failed:",ex);BOARD_PINS=BOARD_PINS||[];}
  return BOARD_PINS;
}
async function addBoardPin(kind,title,data){
  await loadBoardPins();
  var maxPos=BOARD_PINS.filter(function(p){return p.kind===kind||(kind!=="goal"&&kind!=="competition"&&(p.kind==="idea"||p.kind==="link"));})
    .reduce(function(a,p){return Math.max(a,p.position||0);},0);
  var row={kind:kind,title:String(title).slice(0,200),data:data||{},position:maxPos+1};
  try{
    var res=await sba.from("board_pins").insert(row).select("id,kind,title,data,position,created_at");
    if(res.error)throw res.error;
    BOARD_PINS.push(res.data[0]);
    return res.data[0];
  }catch(ex){console.error("[Partnr] pinning failed:",ex);showErrorToast("Couldn't pin that. Please try again.");return null;}
}
async function removeBoardPin(id){
  var pin=BOARD_PINS.find(function(p){return p.id===id;});
  BOARD_PINS=BOARD_PINS.filter(function(p){return p.id!==id;});
  renderBoard();
  try{var res=await sba.from("board_pins").delete().eq("id",id);if(res.error)throw res.error;}
  catch(ex){console.error("[Partnr] removing pin failed:",ex);if(pin)BOARD_PINS.push(pin);renderBoard();showErrorToast("Couldn't remove that. Please try again.");return;}
  if(pin)showUndoToast("Removed from your board.",async function(){var again=await addBoardPin(pin.kind,pin.title,pin.data);if(again)renderBoard();});
}
async function updatePinData(pin){
  try{var res=await sba.from("board_pins").update({data:pin.data}).eq("id",pin.id);if(res.error)throw res.error;}
  catch(ex){console.error("[Partnr] updating pin failed:",ex);}
}
async function pinCompetition(name){
  await loadBoardPins();
  if(BOARD_PINS.some(function(p){return p.kind==="competition"&&p.data&&p.data.name===name;})){showToast("Already on your board");return;}
  var pin=await addBoardPin("competition",name,{name:name});

async function pinProject(id,title,description){

// Five steps in the order a project actually happens. Most check
// themselves from what the student has done; "Work on it together" is
// checked by hand. Students can add, edit and delete their own to-dos.
var OUTCOME_RESULTS=["Submitted","Placed","Won","Launched","Still going"];
async function loadTodoState(){
  var session=await getSession();if(!session)return null;
  var me=session.user.id;
  var st={me:me,todos:[],posted:0,joined:0,partners:0,outcomes:0};
  try{
    var r=await Promise.all([
      sba.from("student_todos").select("id,title,done,builtin,position,created_at").order("position",{ascending:true}).order("id",{ascending:true}),
      sba.from("projects").select("id",{count:"exact",head:true}).eq("student_id",me),
      sba.from("project_applications").select("id",{count:"exact",head:true}).eq("applicant_id",me).eq("status","accepted"),
      sba.from("connections").select("id",{count:"exact",head:true}).eq("status","accepted").or("student_a_id.eq."+me+",student_b_id.eq."+me),
      sba.from("project_outcomes").select("id",{count:"exact",head:true})
    ]);
    st.todos=(r[0].data||[]);st.posted=r[1].count||0;st.joined=r[2].count||0;st.partners=r[3].count||0;st.outcomes=r[4].count||0;
  }catch(ex){console.error("[Partnr] loading to-dos failed:",ex);}
  return st;
}
// Older goals had their own checklists. Move those steps into the To-do
// list once, so the board only ever has one list.
async function moveGoalStepsToTodos(){
  var withSteps=(BOARD_PINS||[]).filter(function(p){return p.kind==="goal"&&p.data&&(p.data.steps||[]).length;});
  for(var i=0;i<withSteps.length;i++){
    var p=withSteps[i];
    var rows=p.data.steps.slice(0,12).map(function(x,k){return {title:String(x.t||"").slice(0,140)||"Step",done:!!x.done,position:k};});
    var ins=await sba.from("student_todos").insert(rows);
    if(ins.error){console.error("[Partnr] moving goal steps failed:",ins.error);continue;}
    var nd=Object.assign({},p.data);delete nd.steps;
    await sba.from("board_pins").update({data:nd}).eq("id",p.id);
    p.data=nd;
  }
}
async function renderTodos(){
  var wrap=document.getElementById("todo-wrap");if(!wrap)return;
  try{await moveGoalStepsToTodos();}catch(ex){console.error(ex);}
  var st=await loadTodoState();
  wrap=document.getElementById("todo-wrap");if(!wrap||!st)return;
  var workRow=st.todos.find(function(t){return t.builtin==="work";});
  var mine=st.todos.filter(function(t){return !t.builtin;});
  var steps=[
    {key:"profile",t:"Finish your profile",done:true},
    {key:"start",t:"Pick a competition, post a project, or join one",done:(S.comps||[]).length>0||(BOARD_PINS||[]).some(function(p){return p.kind==="competition";})||st.posted>0||st.joined>0,
      acts:[["todo-go-comp","Pick a competition"],["todo-go-projects","Browse projects"]]},
    {key:"partner",t:"Find a partner",done:st.partners>0,acts:[["todo-go-matches","See your matches"]]},
    {key:"work",t:"Work on it together",done:!!(workRow&&workRow.done),manual:true,acts:[["todo-go-inbox","Open your inbox"]]},
    {key:"share",t:"Share how it went",done:st.outcomes>0,acts:[["todo-share",st.outcomes>0?"Share another result":"Tell us how it turned out"]]}
  ];
  // Preset steps a student hid with × (stored as builtin "hide:<step>").
  var hiddenKeys=st.todos.filter(function(t){return t.builtin&&t.builtin.indexOf("hide:")===0;}).map(function(t){return t.builtin.slice(5);});
  steps=steps.filter(function(x){return hiddenKeys.indexOf(x.key)<0;});
  var doneCount=steps.filter(function(x){return x.done;}).length+mine.filter(function(t){return t.done;}).length;
  var totalCount=steps.length+mine.length;
  var nextKey=(steps.find(function(x){return !x.done;})||{}).key;
  var h="<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;\">"+
      "<div class=\"slabel\" style=\"margin:0;\">To-do <span style=\"font-weight:400;color:#999;text-transform:none;letter-spacing:0;\">"+doneCount+" of "+totalCount+" done</span></div>"+
    "</div>"+
    "<div class=\"todo-card\">";
  steps.forEach(function(x){
    // Shortcuts show on the next step to do, on "Work on it together"
    // until it's checked, and always on "Share how it went".
    var showActs=!!x.acts&&(x.key==="share"||(!x.done&&(x.key===nextKey||x.key==="work")));
    h+="<div class=\"todo-row"+(x.done?" done":"")+(x.key===nextKey?" next":"")+"\">"+
      (x.manual?"<input type=\"checkbox\" id=\"todo-work\" class=\"todo-box\""+(x.done?" checked":"")+" aria-label=\"Mark done\"/>":
        "<span class=\"todo-auto\" aria-hidden=\"true\">"+(x.done?"✓":"")+"</span>")+
      "<div style=\"flex:1;min-width:0;\"><div class=\"todo-t\">"+esc(x.t)+(x.manual||x.done||x.key==="share"?"":" <span class=\"todo-hint\">checks itself</span>")+"</div>"+
      (showActs?"<div class=\"todo-acts\">"+x.acts.map(function(a){return "<button type=\"button\" class=\"todo-act\" id=\""+a[0]+"\">"+esc(a[1])+" →</button>";}).join("")+"</div>":"")+
      (x.key==="share"?"<div id=\"outcome-form\"></div>":"")+
      "</div>"+
      "<button type=\"button\" class=\"bremove step-hide\" data-k=\""+x.key+"\" aria-label=\"Hide this step\" title=\"Hide this step\" style=\"position:static;\">×</button>"+
      "</div>";
  });
  // The student's own to-dos sit in the same list, under the steps.
  h+=mine.map(function(t){
      return "<div class=\"todo-row"+(t.done?" done":"")+"\" data-id=\""+t.id+"\">"+
        "<input type=\"checkbox\" class=\"todo-box my-todo-box\" data-id=\""+t.id+"\""+(t.done?" checked":"")+" aria-label=\"Mark done\"/>"+
        "<div class=\"todo-t my-todo-t\" data-id=\""+t.id+"\" role=\"button\" tabindex=\"0\" title=\"Tap to edit\" style=\"flex:1;cursor:text;\">"+esc(t.title)+"</div>"+
        "<button type=\"button\" class=\"bremove my-todo-del\" data-id=\""+t.id+"\" aria-label=\"Delete to-do\" style=\"position:static;\">×</button>"+
      "</div>";
    }).join("")+
    "<div style=\"display:flex;gap:8px;padding:10px 0 8px;border-top:1px solid #f0efeb;\"><input id=\"todo-new\" maxlength=\"140\" placeholder=\"Add a to-do, e.g. Find a mentor\" style=\"flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;\"/>"+
    "<button type=\"button\" id=\"todo-add\" style=\"padding:8px 14px;background:#EEEDFE;color:#534AB7;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;\">Add</button></div>"+
    "<div id=\"todo-err\"></div>"+
  "</div>"+
  (hiddenKeys.length?"<button type=\"button\" id=\"todo-unhide\" class=\"todo-act\" style=\"margin-top:6px;\">Show hidden steps ("+hiddenKeys.length+")</button>":"");
  wrap.innerHTML=h;
