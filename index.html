function bindTodos(st,workRow){
  function on(id,fn){var b=document.getElementById(id);if(b)b.addEventListener("click",fn);}
  on("todo-go-comp",function(){openCompPicker(function(name){pinCompetition(name).then(renderBoard);});});
  on("todo-go-projects",function(){selectTab("recruit");});
  on("todo-go-matches",function(){selectTab("matches");});
  on("todo-go-inbox",function(){selectTab("conns");});
  on("todo-share",function(){openOutcomeForm();});
  document.querySelectorAll(".step-hide").forEach(function(b){
    b.addEventListener("click",async function(){
      var res=await sba.from("student_todos").insert({title:"Hidden step",builtin:"hide:"+this.dataset.k,done:true});
      if(res.error){showInlineError(document.getElementById("todo-err"),"Couldn't hide. Please try again.");return;}
      renderTodos();
    });
  });
  on("todo-unhide",async function(){
    var ids=st.todos.filter(function(t){return t.builtin&&t.builtin.indexOf("hide:")===0;}).map(function(t){return t.id;});
    if(ids.length){var res=await sba.from("student_todos").delete().in("id",ids);if(res.error){showInlineError(document.getElementById("todo-err"),"Couldn't show them. Please try again.");return;}}
    renderTodos();
  });
  var wb=document.getElementById("todo-work");
  if(wb)wb.addEventListener("change",async function(){
    var done=this.checked;
    var res=workRow?await sba.from("student_todos").update({done:done}).eq("id",workRow.id)
                   :await sba.from("student_todos").insert({title:"Work on it together",builtin:"work",done:done});
    if(res.error){this.checked=!done;showInlineError(document.getElementById("todo-err"),"Couldn't save. Please try again.");return;}
    renderTodos();
  });
  document.querySelectorAll(".my-todo-box").forEach(function(b){
    b.addEventListener("change",async function(){
      var res=await sba.from("student_todos").update({done:this.checked}).eq("id",this.dataset.id);
      if(res.error){showInlineError(document.getElementById("todo-err"),"Couldn't save. Please try again.");}
      renderTodos();
    });
  });
  document.querySelectorAll(".my-todo-del").forEach(function(b){
    b.addEventListener("click",async function(){
      var res=await sba.from("student_todos").delete().eq("id",this.dataset.id);
      if(res.error){showInlineError(document.getElementById("todo-err"),"Couldn't delete. Please try again.");return;}
      renderTodos();
    });
  });
  // Tap a to-do to edit it. Enter or tapping away saves; Escape cancels.
  document.querySelectorAll(".my-todo-t").forEach(function(el){
    function startEdit(){
      if(el.querySelector("input"))return;
      var old=el.textContent;
      el.innerHTML="<input maxlength=\"140\" style=\"width:100%;padding:6px 10px;border:1px solid #AFA9EC;border-radius:6px;font-size:13px;font-family:inherit;\"/>";
      var inp=el.querySelector("input");inp.value=old;inp.focus();
      var finished=false;
      async function save(){
        if(finished)return;finished=true;
        var v=inp.value.trim();
        if(!v||v===old){renderTodos();return;}
        var res=await sba.from("student_todos").update({title:v}).eq("id",el.dataset.id);
        if(res.error)showInlineError(document.getElementById("todo-err"),"Couldn't save. Please try again.");
        renderTodos();
      }
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();save();}else if(e.key==="Escape"){finished=true;renderTodos();}});
      inp.addEventListener("blur",save);
    }
    el.addEventListener("click",startEdit);
    el.addEventListener("keydown",function(e){if(e.key==="Enter"&&!el.querySelector("input")){e.preventDefault();startEdit();}});
  });
  var addBtn=document.getElementById("todo-add"),addInp=document.getElementById("todo-new");
  async function addTodo(){
    var v=addInp.value.trim();
    if(!v){showErr("todo-new","Write your to-do first");return;}
    addBtn.disabled=true;
    var pos=st.todos.reduce(function(a,t){return Math.max(a,t.position||0);},0)+1;
    var res=await sba.from("student_todos").insert({title:v.slice(0,140),position:pos});
    addBtn.disabled=false;
    if(res.error){showInlineError(document.getElementById("todo-err"),"Couldn't add. Please try again.");return;}
    renderTodos();
  }
  if(addBtn){
    addBtn.addEventListener("click",addTodo);
    addInp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addTodo();}});
  }
}
// "Share how it went": saved for Partnr, emailed to hello@projectpartnr.com,
// and added to the student's profile under Experience.
function openOutcomeForm(){
  var f=document.getElementById("outcome-form");if(!f)return;
  if(f.innerHTML){f.innerHTML="";return;}
  var picked="";
  f.innerHTML="<div class=\"bform\" style=\"margin-top:10px;\">"+
    "<label for=\"oc-title\" style=\"font-size:12px;font-weight:600;color:#555;\">What did you make?</label>"+
    "<div><input id=\"oc-title\" maxlength=\"120\" placeholder=\"e.g. Water filter for rural schools\"/></div>"+
    "<div style=\"font-size:12px;font-weight:600;color:#555;margin-top:4px;\">How did it turn out?</div>"+
    "<div class=\"cgrow\" id=\"oc-result\" style=\"margin-bottom:0;\">"+OUTCOME_RESULTS.map(function(r){return "<button type=\"button\" class=\"chip oc-chip\" data-r=\""+r+"\">"+r+"</button>";}).join("")+"</div>"+
    "<input id=\"oc-detail\" maxlength=\"120\" placeholder=\"Details (optional), e.g. 2nd place at Conrad Challenge regionals\"/>"+
    "<div><input id=\"oc-link\" maxlength=\"300\" placeholder=\"Link (optional): website, video, paper, GitHub\"/></div>"+
    "<textarea id=\"oc-notes\" maxlength=\"600\" placeholder=\"Anything else you want to tell us? (optional)\"></textarea>"+
    "<label style=\"display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#333;font-weight:400;cursor:pointer;\"><input type=\"checkbox\" id=\"oc-feature\" style=\"width:18px;height:18px;flex-shrink:0;margin:1px 0 0;padding:0;accent-color:#534AB7;\"/><span>Partnr can feature this, for example on our website or social media.</span></label>"+
    "<div style=\"font-size:12px;color:#6b6b6b;border-top:1px solid #eee;padding-top:10px;margin-top:4px;\">We'll also add it to your profile under Experience. You can remove it anytime.</div>"+
    "<div id=\"oc-err\"></div>"+
    "<button class=\"bp\" id=\"oc-save\" style=\"margin-top:10px;\">Share it</button></div>";
  f.querySelectorAll(".oc-chip").forEach(function(c){
    c.addEventListener("click",function(){
      picked=this.dataset.r;
      f.querySelectorAll(".oc-chip").forEach(function(x){x.classList.toggle("on",x===c);});
      var e=document.getElementById("sec-err-oc-result");if(e)e.remove();
    });
  });
  document.getElementById("oc-save").addEventListener("click",async function(){
    var title=document.getElementById("oc-title").value.trim();
    var detail=document.getElementById("oc-detail").value.trim();
    var link=normalizeHandleLink(document.getElementById("oc-link").value.trim());
    var notes=document.getElementById("oc-notes").value.trim();
    var valid=true;
    if(!title){showErr("oc-title","Give it a name");valid=false;}
    if(!picked){showSecErr("oc-result","Pick how it turned out");valid=false;}
    if(link&&!/^https?:\/\//i.test(link))link="https://"+link;
    if(link){var lp=linkProblem(link);if(lp){showErr("oc-link",lp);valid=false;}}
    if(!valid){scrollToFirstErr();return;}
    var btn=this;btn.disabled=true;btn.textContent="Sharing…";
    var res=await sba.from("project_outcomes").insert({title:title,result:picked,result_detail:detail||null,link:link||null,details:notes||null,feature_ok:document.getElementById("oc-feature").checked});
    if(res.error){
      btn.disabled=false;btn.textContent="Share it";
      showInlineError(document.getElementById("oc-err"),res.error.message&&res.error.message.indexOf("tomorrow")>=0?res.error.message:"Couldn't share. Please try again.");
      return;
    }
    // Add it to Experience on their profile.
    if((S.proofOfWork||[]).length<8){
      S.proofOfWork=(S.proofOfWork||[]).concat([{type:"Project",title:title,desc:picked+(detail?": "+detail:""),link:link||""}]);
      try{var session=await getSession();if(session)await sba.from("students").update({proof_of_work:S.proofOfWork}).eq("id",session.user.id);}catch(ex){console.error("[Partnr] adding outcome to profile failed:",ex);}
    }
    showToast("Thanks for sharing! It's on your profile now.");
    renderTodos();
  });
}

    "<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;\">"+
      "<div class=\"slabel\" style=\"margin:0;\">"+label+" <span style=\"font-weight:400;color:#999;text-transform:none;letter-spacing:0;\">"+count+"</span></div>"+
      (addLabel?"<button id=\""+addId+"\" style=\"background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;padding:0;\">"+addLabel+"</button>":"")+
    "</div>"+
    "<div id=\""+id+"-form\"></div>"+
    (count?"<div class=\"bgrid\" data-sec=\""+id+"\">"+inner+"</div>":"<div style=\"font-size:13px;color:#999;padding:12px 14px;border:1px dashed #ddd;border-radius:12px;\">"+emptyMsg+"</div>")+

}
function pinShell(key,inner,extraStyle){

    "<span class=\"bgrip\" title=\"Drag to reorder\">⋮⋮</span>"+

}

// First visit to My board: start it with what the student already told
// us at signup, so it never opens empty. Their target competitions become
// competition pins, and what they wrote on page 1 becomes their first goal
// with three starter steps. Runs once per account (a flag is kept in the
// goal's data) and only when the board is completely empty.
async function seedBoardIfNew(){
  if(!BOARD_PINS||BOARD_PINS.length)return;
  var flagKey="partnr_board_seeded_"+(S.email||"me");
  try{if(localStorage.getItem(flagKey))return;localStorage.setItem(flagKey,"1");}catch(ex){}
  var idea=""; // The To-do list replaces the old auto-made goal.
  if(idea){
    var title=idea.length>120?idea.slice(0,120).replace(/\s+\S*$/,"")+"…":idea;
    // Only suggest a competition step to students who picked one.
    // Someone starting a business or nonprofit gets a milestone instead.
    var hasComps=(S.comps||[]).length>0;
    await addBoardPin("goal",title,{fromProfile:true,steps:[
      {t:"Find a partner on Partnr",done:false},
      {t:hasComps?"Pick the competition to aim for first":"Pick your first milestone",done:false},
      {t:"Make a plan together",done:false}
    ]});
  }
  var names=(S.comps||[]).slice(0,10);
  for(var i=0;i<names.length;i++){await addBoardPin("competition",names[i],{name:names[i],fromProfile:true});}
}
async function renderBoard(){
  var el=document.getElementById("tc");if(!el)return;
  if(!BOARD_PINS)el.innerHTML="<div style=\"text-align:center;padding:2rem;\"><div class=\"spin\" style=\"margin:0 auto;\"></div></div>";
  await loadBoardPins();
  await seedBoardIfNew();
  var realSaved=[];
  try{realSaved=await fetchSavedStudents();}catch(ex){console.error("[Partnr] loading saved students failed:",ex);}
  if(CURRENT_TAB!=="board")return;

  var goals=BOARD_PINS.filter(function(p){return p.kind==="goal";});
  var comps=BOARD_PINS.filter(function(p){return p.kind==="competition";});
  // Soonest deadline first, unconfirmed deadlines last, until the student
  // drags them into their own order.
  if(!compOrderIsCustom()){
    var dl=function(p){
      var d=DEADLINE_DATA[(p.data&&p.data.name)||p.title];
      if(d&&d.status==="confirmed"&&d.deadline_date){var n=daysUntilISODate(d.deadline_date);if(n>=0)return n;}
      return 1e6;
    };
    comps=comps.map(function(p,i){return {p:p,i:i};}).sort(function(a,b){return dl(a.p)-dl(b.p)||a.i-b.i;}).map(function(x){return x.p;});
  }
  var ideas=BOARD_PINS.filter(function(p){return p.kind==="idea"||p.kind==="link";});

  // Goals are the big picture, one line each. The steps to get there
  // live in the To-do list, so there's only one checklist on the board.
  var goalHtml=goals.map(function(p){
    return pinShell("pin:"+p.id,
      "<div class=\"bk\" style=\"color:#534AB7;\">Goal</div><div class=\"bt\">"+esc(p.title)+"</div>",
      "background:#EEEDFE;border-color:#d9d6fb;");
  }).join("");

  var compHtml=comps.map(function(p){
    var name=(p.data&&p.data.name)||p.title;
    var c=COMPS.find(function(x){return x.n===name;});
    var cm=c?(CM2[c.cat]||{c:"#7F77DD",n:""}):{c:"#7F77DD",n:"Competition"};
    var xs=c?getCrossStyle(c.cross):null;
    return pinShell("pin:"+p.id,
      "<div class=\"bk\" style=\"color:"+cm.c+";\">"+esc(cm.n||"Competition")+"</div>"+
      "<div class=\"bt bcomp\" data-name=\""+esc(name)+"\" style=\"cursor:pointer;\">"+esc(name)+"</div>"+
      (c?"<div class=\"bmeta\"><span>"+esc(xs.lbl)+"</span><span>"+esc(c.team)+"</span><span>"+esc(c.eli)+"</span></div>":"")+
      competitionDeadlineLine(name));
  }).join("");

  // Saved partners: AI matches saved with ♥, plus real students starred in Find students.
  var partnerItems=[];
  MATCHES.forEach(function(m,i){if(m._status==="saved")partnerItems.push({key:"ai:"+matchKey(m),type:"ai",idx:i,m:m});});
  realSaved.forEach(function(s){partnerItems.push({key:"real:"+s._realId,type:"real",s:s});});
  var order=getPartnerOrder();
  partnerItems.sort(function(a,b){var ia=order.indexOf(a.key),ib=order.indexOf(b.key);return (ia<0?9999:ia)-(ib<0?9999:ib);});
  var partnerHtml=partnerItems.map(function(it){
    var name,place,skills,av,col;
    if(it.type==="ai"){
      var m=it.m;name=displayName(m.name);place=locationLine(m.school,m.city,m.country,sharesSchoolRequiredComp(m.competitions));
      skills=Object.keys(m.skillsWithLevels||{}).slice(0,2);av=m.avatar;col=CM[m.avatarColor]||CM.purple;
    } else {
      var s=it.s;name=displayName(s.name);place=locationLine(s.school,s.city,s.country,false);
      skills=[s.keySkill].concat(s.otherSkills||[]).filter(function(x){return x&&x!=="Partner";}).slice(0,2);av=s.avatar;col=CM[s.avatarColor]||CM.purple;
    }
    return pinShell(it.key,
      "<div class=\"bt\" style=\"display:flex;align-items:center;gap:8px;\"><span class=\"av\" style=\"width:30px;height:30px;font-size:12px;background:"+col.bg+";color:"+col.c+";\">"+esc(av)+"</span>"+esc(name)+"</div>"+
      (skills.length?"<div class=\"bmeta\">"+skills.map(function(x){return "<span>"+esc(x)+"</span>";}).join("")+"</div>":"")+
      "<div style=\"font-size:12px;color:#6b6b6b;\">"+place+" · "+(it.type==="ai"?"Saved from Matches":"Saved from Find students")+"</div>"+
      (it.type==="ai"?"<button class=\"bopen\" data-idx=\""+it.idx+"\" style=\"margin-top:8px;background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;padding:0;\">View profile →</button>":""));
  }).join("");

  var ideaHtml=ideas.map(function(p){
    var d=p.data||{};
    var isLink=p.kind==="link";
    var host=isLink&&d.url?String(d.url).replace(/^https?:\/\//,"").split("/")[0]:"";
    return pinShell("pin:"+p.id,
      "<div class=\"bk\" style=\"color:"+(isLink?"#6D3F94":"#4A7F1E")+";\">"+(isLink?"Link":(d.projectId?"Open project":"Project idea"))+"</div>"+
      "<div class=\"bt\">"+esc(p.title)+"</div>"+
      (d.note?"<div style=\"font-size:12px;color:#555;line-height:1.45;\">"+esc(String(d.note).slice(0,160))+"</div>":"")+
      (isLink&&d.url?"<a href=\""+safeUrl(d.url)+"\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;color:#7F77DD;font-weight:600;text-decoration:none;\">"+esc(host)+" ↗</a>":""));
  }).join("");

  el.innerHTML=
    "<div style=\"font-size:20px;font-weight:700;margin-bottom:4px;\">My board</div>"+
    "<div class=\"page-note\">Your private place to plan. Only you can see this. Drag the ⋮⋮ handle to reorder.</div>"+
    "<div id=\"todo-wrap\" style=\"margin-bottom:1.5rem;\"></div>"+
    boardSection("goals","Goals",goals.length,"+ Add a goal","add-goal",goalHtml,"Your big goals, like \"Publish research by spring\" or \"Win DECA states.\" The steps go in your to-do list above.")+
    boardSection("comps","Competitions",comps.length,"+ Pin a competition","add-comp",compHtml,"Tap 📌 Pin on any competition to save it here.")+
    boardSection("partners","Saved partners",partnerItems.length,"+ Find students","add-partner",partnerHtml,"Tap ♥ on a match or ★ in Find students to save partners here.")+
    boardSection("ideas","Ideas & links",ideas.length,"+ Add an idea or link","add-idea",ideaHtml,"Pin an open project, or add an idea, article, video or doc.");

  bindBoard(partnerItems);
  renderTodos();
}

function bindBoard(partnerItems){
  var addGoalBtn=document.getElementById("add-goal");
  if(addGoalBtn)addGoalBtn.addEventListener("click",function(){
    var f=document.getElementById("goals-form");
    if(f.innerHTML){f.innerHTML="";return;}
    f.innerHTML="<div class=\"bform\"><input id=\"g-title\" placeholder=\"Your goal, e.g. Publish a research paper by spring\" maxlength=\"200\"/>"+
      "<div id=\"g-err\"></div>"+
      "<button class=\"bp\" id=\"g-save\" style=\"margin-top:0;\">Add goal</button></div>";
    document.getElementById("g-save").addEventListener("click",async function(){
      var t=document.getElementById("g-title").value.trim();
      if(!t){document.getElementById("g-err").innerHTML="<div class=\"sec-err\">Write your goal first.</div>";return;}
      this.disabled=true;
      if(await addBoardPin("goal",t,{}))renderBoard();else this.disabled=false;
    });
  });
  document.getElementById("add-comp").addEventListener("click",function(){openCompPicker(function(name){pinCompetition(name).then(renderBoard);});});
  document.getElementById("add-partner").addEventListener("click",function(){var b=document.getElementById("nb-search");if(b)b.click();});
  document.getElementById("add-idea").addEventListener("click",function(){
    var f=document.getElementById("ideas-form");
    if(f.innerHTML){f.innerHTML="";return;}
    f.innerHTML="<div class=\"bform\"><input id=\"i-title\" placeholder=\"Title, e.g. Free sunscreen stations at sports fields\" maxlength=\"200\"/>"+
      "<input id=\"i-url\" placeholder=\"Link (optional): article, video, website, Google Doc\"/>"+
      "<textarea id=\"i-note\" placeholder=\"Notes (optional)\"></textarea><div id=\"i-err\"></div>"+
      "<button class=\"bp\" id=\"i-save\" style=\"margin-top:0;\">Pin it</button></div>";
    document.getElementById("i-save").addEventListener("click",async function(){
      var t=document.getElementById("i-title").value.trim(),u=document.getElementById("i-url").value.trim(),n=document.getElementById("i-note").value.trim();
      var errEl=document.getElementById("i-err");
      if(!t&&!u){errEl.innerHTML="<div class=\"sec-err\">Add a title or a link.</div>";return;}
      if(u&&!/^https?:\/\//i.test(u))u="https://"+u;
      // A real link needs a real web address, like "nytimes.com".
      var hostOk=false;try{var hu=new URL(u);hostOk=/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(hu.hostname);}catch(ex){}
      if(u&&(safeUrl(u)==="#"||!hostOk)){errEl.innerHTML="<div class=\"sec-err\">That link doesn't look right. Check it and try again.</div>";return;}
      if(!t)t=u.replace(/^https?:\/\//,"").split("/")[0];
      this.disabled=true;
      if(await addBoardPin(u?"link":"idea",t,u?{url:u,note:n}:{note:n}))renderBoard();else this.disabled=false;
    });
  });
  document.querySelectorAll(".gstep").forEach(function(cb){
    cb.addEventListener("change",function(){
      var pin=BOARD_PINS.find(function(p){return p.id===parseInt(cb.dataset.id);});if(!pin)return;
      pin.data.steps[parseInt(cb.dataset.i)].done=cb.checked;updatePinData(pin);renderBoard();
    });
  });
  document.querySelectorAll(".bcomp").forEach(function(t){
    t.addEventListener("click",function(){var c=COMPS.find(function(x){return x.n===t.dataset.name;});if(c)openCompDetail(c,false,true);});
  });
  document.querySelectorAll(".bopen").forEach(function(b){b.addEventListener("click",function(){openProfile(parseInt(b.dataset.idx));});});
  document.querySelectorAll(".bremove").forEach(function(b){
    b.addEventListener("click",async function(){
      var key=b.dataset.key;
      if(key.indexOf("pin:")===0){removeBoardPin(parseInt(key.slice(4)));return;}
      var it=partnerItems.find(function(x){return x.key===key;});if(!it)return;
      if(it.type==="ai"){
        var m=it.m;setMatchStatus(m,"passed",null);renderBoard();
        showUndoToast("Removed "+nameInSentence(m.name)+" from your board.",function(){setMatchStatus(m,"saved",null);renderBoard();});
      } else {
        var id=it.s._realId;await toggleSaveProfile(id);renderBoard();
        showUndoToast("Removed "+nameInSentence(it.s.name)+" from your board.",async function(){await toggleSaveProfile(id);renderBoard();});
      }
    });
  });
  document.querySelectorAll(".bgrid").forEach(enableBoardDrag);
}

// Drag to reorder inside one section. Works with mouse and touch:
// press the ⋮⋮ handle and drag. Order is saved when you let go.
function enableBoardDrag(grid){
  grid.querySelectorAll(".bgrip").forEach(function(grip){
    grip.addEventListener("pointerdown",function(e){
      e.preventDefault();
      var card=grip.closest(".bpin");card.classList.add("bdragging");
      try{grip.setPointerCapture(e.pointerId);}catch(ex){}
      function move(ev){
        var under=document.elementFromPoint(ev.clientX,ev.clientY);
        var target=under?under.closest(".bpin"):null;
        if(!target||target===card||target.parentNode!==grid)return;
        var r=target.getBoundingClientRect();
        var after=(ev.clientY>r.top+r.height/2)||(ev.clientX>r.left+r.width/2&&ev.clientY>r.top);
        grid.insertBefore(card,after?target.nextSibling:target);
      }
      function up(){
        document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
        card.classList.remove("bdragging");saveBoardOrder(grid);
      }
      // Listen on the whole page so the drag keeps tracking even when the
      // pointer moves off the small handle.
      document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
    });
  });
}
function compOrderKey(){return "partnr_comp_order_custom_"+(S.email||"me");}
function compOrderIsCustom(){try{return !!localStorage.getItem(compOrderKey());}catch(ex){return false;}}
async function saveBoardOrder(grid){
  var keys=Array.prototype.map.call(grid.querySelectorAll(".bpin"),function(c){return c.dataset.key;});
  if(grid.dataset.sec==="partners"){setPartnerOrder(keys);return;}
  if(grid.dataset.sec==="comps"){try{localStorage.setItem(compOrderKey(),"1");}catch(ex){}}
  var updates=[];
  keys.forEach(function(k,i){
    var id=parseInt(k.slice(4));var pin=BOARD_PINS.find(function(p){return p.id===id;});
    if(pin&&pin.position!==i+1){pin.position=i+1;updates.push(sba.from("board_pins").update({position:i+1}).eq("id",id));}
  });
  BOARD_PINS.sort(function(a,b){return a.position-b.position;});
  try{var results=await Promise.all(updates);results.forEach(function(r){if(r.error)throw r.error;});}
  catch(ex){console.error("[Partnr] saving board order failed:",ex);}
}

// Searchable competition list in an overlay, used by "+ Pin a
// competition" on the board and "+ More competitions" in Find students.
function openCompPicker(onPick,opts){
  opts=opts||{};
  var old=document.getElementById("comp-picker");if(old)old.remove();
  var ov=document.createElement("div");ov.id="comp-picker";
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:210;display:flex;align-items:center;justify-content:center;padding:1rem;";
  var catKeys=["science","math","business","impact","tech","writing","arts","law"].filter(function(k){return COMPS.some(function(c){return c.cat===k;});});
  var cat="all";
  ov.innerHTML="<div style=\"background:white;border-radius:16px;padding:1.25rem;max-width:460px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.2);\">"+
    "<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><div style=\"font-size:16px;font-weight:700;\">All competitions ("+COMPS.length+")</div>"+
    "<button id=\"cp-close\" style=\"background:none;border:none;color:#7F77DD;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;\">Close</button></div>"+
    "<input id=\"cp-q\" placeholder=\"Search competitions\" style=\"width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px;\"/>"+
    "<div id=\"cp-cats\" class=\"cgrow\" style=\"margin-bottom:8px;\"></div>"+
    "<div id=\"cp-list\" style=\"overflow-y:auto;flex:1;border-top:1px solid #f0f0ec;\"></div></div>";
  document.body.appendChild(ov);
  function close(){ov.remove();}
  ov.addEventListener("click",function(e){if(e.target===ov)close();});
  document.getElementById("cp-close").addEventListener("click",close);
  function draw(){
    var q=document.getElementById("cp-q").value.trim().toLowerCase();
    document.getElementById("cp-cats").innerHTML=["all"].concat(catKeys).map(function(k){
      return "<span class=\"chip"+(cat===k?" on":"")+"\" data-c=\""+k+"\">"+(k==="all"?"All":esc((CM2[k]||{n:k}).n))+"</span>";
    }).join("");
    document.querySelectorAll("#cp-cats .chip").forEach(function(ch){ch.addEventListener("click",function(){cat=ch.dataset.c;draw();});});
    var list=COMPS.filter(function(c){return (cat==="all"||c.cat===cat)&&(!q||c.n.toLowerCase().indexOf(q)>=0);});
    var h="";
    if(opts.allowCategory&&cat!=="all"&&!q){
      h+="<div class=\"cp-row\" data-v=\"cat:"+cat+"\" style=\"font-weight:600;color:#534AB7;\">All "+esc((CM2[cat]||{n:cat}).n)+" competitions</div>";
    }
    h+=list.map(function(c){var cm=CM2[c.cat]||{c:"#7F77DD",n:""};
      return "<div class=\"cp-row\" data-v=\""+esc(c.n)+"\">"+esc(c.n)+"<small style=\"color:"+cm.c+";font-weight:600;font-size:11px;white-space:nowrap;\">"+esc(cm.n)+"</small></div>";}).join("");
    var listEl=document.getElementById("cp-list");
    listEl.innerHTML=h||"<div style=\"padding:12px 4px;color:#999;font-size:13px;\">No matches</div>";
    listEl.querySelectorAll(".cp-row").forEach(function(r){r.addEventListener("click",function(){close();onPick(r.dataset.v);});});
  }
  document.getElementById("cp-q").addEventListener("input",draw);
  draw();
  document.getElementById("cp-q").focus();
}

// ── Find students (rebuilt) ──────────────────
// Two clear rows: "Looking for" (a skill and/or a competition) and
// "Where" (anyone / my city / my school), plus a one-line summary.
var FS={skill:"",comp:"",where:"anyone",extra:[]};
function fsCompLabel(v){
  if(!v)return "";
  if(v.indexOf("cat:")===0)return "All "+((CM2[v.slice(4)]||{n:v.slice(4)}).n)+" competitions";
  if(v.indexOf("subcat:")===0)return "All "+(v.slice(7)==="coding"?"Coding":"Robotics")+" competitions";
  return v;
}
function fsQuickChips(){
  var chips=[];
  var trackKeys=[];if(S.track)trackKeys.push(S.track);
  (S.secondary||[]).forEach(function(n){var k=Object.keys(TR).find(function(kk){return TR[kk].n===n;});if(k&&trackKeys.indexOf(k)<0)trackKeys.push(k);});
  var catIds=[];trackKeys.forEach(function(tk){(TRACK_TO_SKILLCATS[tk]||[]).forEach(function(c){if(catIds.indexOf(c)<0)catIds.push(c);});});
  catIds.forEach(function(cid){var c=SKILL_CATS.find(function(x){return x.id===cid;});if(c&&c.items[0]&&chips.length<3)chips.push({t:"skill",v:c.items[0]});});
  if(!chips.length)SKILL_CATS.filter(function(c){return c.id!=="math";}).slice(0,3).forEach(function(c){chips.push({t:"skill",v:c.items[0]});});
  (S.comps||[]).slice(0,2).forEach(function(n){chips.push({t:"comp",v:n});});
  FS.extra.forEach(function(e){if(!chips.some(function(c){return c.v===e.v;}))chips.push(e);});
  return chips;
}
function sTab(){
  var whereOpts=[["school","🏫 "+(S.school||"My school")],["city","📍 Near me"],["country","🗺️ "+(S.country||"My country")],["anyone","🌍 Anyone"]];
  return "<div style=\"font-size:20px;font-weight:700;margin-bottom:2px;\">Find students</div>"+
    "<div class=\"page-note\">Search for a student with a specific skill or competition.</div>"+
    "<div style=\"position:relative;margin-bottom:4px;\">"+
      "<label for=\"ss\" class=\"sr-only\" style=\"position:absolute;left:-9999px;\">Search</label>"+
      "<i class=\"ti ti-search\" style=\"position:absolute;left:13px;top:13px;font-size:16px;color:#999;\"></i>"+
      "<input id=\"ss\" placeholder=\"Search a skill or competition\" autocomplete=\"off\" style=\"width:100%;padding:12px 14px 12px 38px;border:1px solid #ddd;border-radius:10px;font-size:14px;font-family:inherit;color:#1a1a1a;background:white;\"/>"+
      "<div id=\"skill-suggest\" style=\"display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.08);z-index:20;overflow:hidden;\"></div>"+
    "</div>"+
    "<div class=\"slabel\">Looking for</div>"+
    "<div class=\"cgrow\" id=\"fs-quick\" style=\"margin-bottom:0;\"></div>"+
    "<div id=\"fs-skill-panel\" class=\"fs-panel\" style=\"display:none;\"></div>"+
    "<div class=\"slabel\">Where</div>"+
    "<div id=\"fs-where\" class=\"fs-seg\">"+whereOpts.map(function(o){return "<div data-v=\""+o[0]+"\" role=\"button\" tabindex=\"0\" class=\""+(FS.where===o[0]?"on":"")+"\">"+esc(o[1])+"</div>";}).join("")+"</div>"+
    "<div class=\"fs-sum\"><span>Showing <b id=\"fs-what\"></b> · <b id=\"fs-wh\"></b></span><button id=\"fs-clear\">Clear</button></div>"+
    "<div id=\"sr\" style=\"margin-top:0.75rem;\"></div>";
}
function fsRenderQuick(){
  var el=document.getElementById("fs-quick");if(!el)return;
  el.innerHTML=fsQuickChips().map(function(q){
    var on=(q.t==="skill"&&FS.skill===q.v)||(q.t==="comp"&&FS.comp===q.v);
    return "<span class=\"chip"+(on?" on":"")+"\" data-t=\""+q.t+"\" data-v=\""+esc(q.v)+"\" role=\"button\" tabindex=\"0\">"+(q.t==="comp"?"🏆 ":"")+esc(q.t==="comp"?fsCompLabel(q.v):q.v)+"</span>";
  }).join("")+
  "<span class=\"chip fs-more\" id=\"fs-more-s\" role=\"button\" tabindex=\"0\">+ More skills</span>"+
  "<span class=\"chip fs-more\" id=\"fs-more-c\" role=\"button\" tabindex=\"0\">+ More competitions</span>";
  el.querySelectorAll(".chip[data-t]").forEach(function(c){
    c.addEventListener("click",function(){
      if(c.dataset.t==="skill")FS.skill=(FS.skill===c.dataset.v?"":c.dataset.v);else FS.comp=(FS.comp===c.dataset.v?"":c.dataset.v);
      fsRun();
    });
    addKbdActivation(c);
  });
  var ms=document.getElementById("fs-more-s");ms.addEventListener("click",function(){fsSkillPanel(null,true);});addKbdActivation(ms);
  var mc=document.getElementById("fs-more-c");mc.addEventListener("click",function(){openCompPicker(function(v){fsPick("comp",v);},{allowCategory:true});});addKbdActivation(mc);
}
function fsPick(t,v){
  if(t==="skill")FS.skill=v;else FS.comp=v;
  if(!FS.extra.some(function(e){return e.v===v;}))FS.extra.push({t:t,v:v});
  var p=document.getElementById("fs-skill-panel");if(p)p.style.display="none";
  fsRun();
}
function fsSkillPanel(catId,toggle){
  var p=document.getElementById("fs-skill-panel");if(!p)return;
  if(toggle&&p.style.display!=="none"&&!catId){p.style.display="none";return;}
  p.style.display="block";
  var head="<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;\"><b style=\"font-size:14px;\">"+(catId?esc(SKILL_CATS.find(function(c){return c.id===catId;}).label):"All skills")+"</b>"+
    "<button id=\"fs-sp-close\" style=\"background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;\">Close</button></div>";
  if(!catId){
    p.innerHTML=head+"<div class=\"fs-tiles\">"+SKILL_CATS.map(function(c){
      return "<button class=\"fs-tile\" data-c=\""+c.id+"\">"+esc(c.label)+"<span>"+c.items.length+" skills</span></button>";}).join("")+"</div>";
    p.querySelectorAll(".fs-tile").forEach(function(b){b.addEventListener("click",function(){fsSkillPanel(b.dataset.c);});});
  } else {
    var cat=SKILL_CATS.find(function(c){return c.id===catId;});
    p.innerHTML=head+"<button id=\"fs-sp-back\" style=\"background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:10px;\">← All categories</button>"+
      "<div class=\"cgrow\">"+cat.items.map(function(i){return "<span class=\"chip"+(FS.skill===i?" on":"")+"\" data-v=\""+esc(i)+"\">"+esc(i)+"</span>";}).join("")+"</div>";
    document.getElementById("fs-sp-back").addEventListener("click",function(){fsSkillPanel(null);});
    p.querySelectorAll(".chip").forEach(function(ch){ch.addEventListener("click",function(){fsPick("skill",ch.dataset.v);});});
  }
  document.getElementById("fs-sp-close").addEventListener("click",function(){p.style.display="none";});
}
function fsRun(){
  fsRenderQuick();
  var what=[FS.skill,fsCompLabel(FS.comp)].filter(Boolean);
  var whatEl=document.getElementById("fs-what");if(whatEl)whatEl.textContent=what.length?what.join(" + "):"everyone";
  var whEl=document.getElementById("fs-wh");
  if(whEl)whEl.textContent=FS.where==="city"?("Within 25 miles of "+(S.city||"you")):FS.where==="school"?("At "+(S.school||"my school")):FS.where==="country"?("In "+(S.country||"my country")):"Anyone";
  document.querySelectorAll("#fs-where div").forEach(function(d){d.classList.toggle("on",d.dataset.v===FS.where);});
  var comp=FS.comp,category="",subcat="";
  if(comp.indexOf("cat:")===0){category=comp.slice(4);comp="";}
  else if(comp.indexOf("subcat:")===0){subcat=comp.slice(7);comp="";}
  var city=FS.where==="city"?S.city:"",school=FS.where==="school"?S.school:"",country=FS.where==="country"?S.country:"";
  LAST_SKILL_SEARCH={fs:true};
  if(!FS.skill&&!comp&&!category&&!subcat&&!city&&!school&&!country){srchSkill({all:true});return;}
  srchSkill({query:FS.skill,competition:comp,category:category,subcat:subcat,city:city,school:school,country:country});
}
function bindSE(){
  document.querySelectorAll("#fs-where div").forEach(function(d){
    d.addEventListener("click",function(){FS.where=d.dataset.v;fsRun();});
    addKbdActivation(d);
  });
  document.getElementById("fs-clear").addEventListener("click",function(){FS.skill="";FS.comp="";FS.where="anyone";var ss=document.getElementById("ss");if(ss)ss.value="";fsRun();});
  // Search box: suggests skills and competitions as you type. Enter
  // searches the typed text directly (skill or name).
  var ss=document.getElementById("ss"),box=document.getElementById("skill-suggest");
  var allSkillNames=[];SKILL_CATS.forEach(function(cat){cat.items.forEach(function(item){allSkillNames.push(item);});});
  ss.addEventListener("input",function(){
    var v=ss.value.trim().toLowerCase();
    if(v.length<2){box.style.display="none";return;}
    var hits=allSkillNames.filter(function(n){return n.toLowerCase().indexOf(v)>=0;}).slice(0,4).map(function(n){return {t:"skill",v:n,l:"Skill"};})
      .concat(COMPS.filter(function(c){return c.n.toLowerCase().indexOf(v)>=0;}).slice(0,4).map(function(c){return {t:"comp",v:c.n,l:"Competition"};}));
    hits.push({t:"text",v:ss.value.trim(),l:"Search names & skills"});
    box.innerHTML=hits.map(function(h){
      return "<div class=\"skill-suggest-item\" role=\"option\" tabindex=\"0\" data-t=\""+h.t+"\" data-v=\""+esc(h.v)+"\" style=\"padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;gap:10px;\">"+
        (h.t==="comp"?"🏆 ":h.t==="text"?"🔍 ":"")+esc(h.t==="text"?"\""+h.v+"\"":h.v)+"<small style=\"color:#999;font-size:11px;white-space:nowrap;\">"+h.l+"</small></div>";
    }).join("");
    box.style.display="block";
    box.querySelectorAll(".skill-suggest-item").forEach(function(item){
      item.addEventListener("mouseenter",function(){item.style.background="#f6f5ff";});
      item.addEventListener("mouseleave",function(){item.style.background="";});
      addKbdActivation(item);
      item.addEventListener("click",function(){
        box.style.display="none";ss.value="";
        fsPick(item.dataset.t==="comp"?"comp":"skill",item.dataset.v);
      });
    });
  });
  ss.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&ss.value.trim()){box.style.display="none";var v=ss.value.trim();ss.value="";fsPick("skill",v);}
  });
  document.addEventListener("click",function(e){if(box&&e.target!==ss&&!box.contains(e.target))box.style.display="none";});
  fsRun();
}
// After a Report/Block flow, go back to the same search.
function returnToSkillSearch(){showTab("search");}


// ── Report a problem / send feedback ─────────
// Remembers the last error the app hit, so bug reports come with the
// technical detail needed to fix them (students never have to explain it).
var LAST_APP_ERROR="";
(function(){
  function note(x){try{LAST_APP_ERROR=String(x&&x.stack?x.stack:x).slice(0,900);}catch(ex){}}
  window.addEventListener("error",function(e){note(e.error||e.message);});
  window.addEventListener("unhandledrejection",function(e){note(e.reason);});
  var origErr=console.error;
  console.error=function(){try{note(Array.prototype.map.call(arguments,function(a){return a&&a.message?a.message:(typeof a==="object"?JSON.stringify(a):String(a));}).join(" "));}catch(ex){}return origErr.apply(console,arguments);};
})();
function describeDevice(){
  var ua=navigator.userAgent||"";
  var os=/iPhone|iPad/.test(ua)?"iPhone/iPad":/Android/.test(ua)?"Android":/Mac/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"Other";
  var br=/Edg\//.test(ua)?"Edge":/CriOS|Chrome\//.test(ua)?"Chrome":/FxiOS|Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":"Other browser";
  return (os+" · "+br+" · "+window.innerWidth+"x"+window.innerHeight+" · "+ua).slice(0,300);
}
function openFeedback(){
  var old=document.getElementById("fb-modal");if(old)old.remove();
  var kind="bug";
  var ov=document.createElement("div");ov.id="fb-modal";
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:230;display:flex;align-items:center;justify-content:center;padding:1rem;";
  ov.innerHTML="<div style=\"background:white;border-radius:16px;padding:1.25rem;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.2);\">"+
    "<div style=\"font-size:17px;font-weight:700;margin-bottom:4px;\">Report a problem or send feedback</div>"+
    "<div style=\"font-size:13px;color:#6b6b6b;margin-bottom:12px;\">Partnr is in beta. Every note helps us make it better.</div>"+
    "<div class=\"slabel\" style=\"margin-top:0;\">What kind?</div>"+
    "<div class=\"cgrow\" id=\"fb-kind\"></div>"+
    "<div class=\"fi\"><label for=\"fb-msg\">What happened?</label><textarea id=\"fb-msg\" maxlength=\"2000\" placeholder=\"e.g. I tapped Find my partners and nothing happened\" style=\"height:100px;resize:vertical;\"></textarea></div>"+
    "<div class=\"fi\" id=\"fb-email-wrap\" style=\"display:none;\"><label for=\"fb-email\">Your email (optional, so we can reply)</label><input id=\"fb-email\" type=\"email\" maxlength=\"200\"/></div>"+
    "<div style=\"font-size:12px;color:#6b6b6b;background:#f8f8f6;border-radius:8px;padding:8px 10px;margin-bottom:12px;\"><i class=\"ti ti-shield-check\" style=\"color:#3B6D11;\"></i> To report a person, use <b>Report</b> on their profile instead.</div>"+
    "<button class=\"bp\" id=\"fb-send\" style=\"margin-top:0;\">Send</button>"+
    "<button class=\"bkbtn\" id=\"fb-cancel\">Cancel</button></div>";
  document.body.appendChild(ov);
  mkChips("fb-kind",["Something's broken","Idea or suggestion","Other"],["Something's broken"],true);
  getSession().then(function(sess){if(!sess){var w=document.getElementById("fb-email-wrap");if(w)w.style.display="block";}}).catch(function(){});
  ov.addEventListener("click",function(e){if(e.target===ov)ov.remove();});
  document.getElementById("fb-cancel").addEventListener("click",function(){ov.remove();});
  document.getElementById("fb-send").addEventListener("click",async function(){
    var msg=document.getElementById("fb-msg").value.trim();
    if(msg.length<3){showErr("fb-msg","Tell us a little about what happened");return;}
    var pick=getChips("fb-kind")[0]||"Something's broken";
    kind=pick==="Idea or suggestion"?"idea":pick==="Other"?"other":"bug";
    var emailEl=document.getElementById("fb-email");
    var row={kind:kind,message:msg.slice(0,2000),page:(CURRENT_PAGE+(CURRENT_PAGE==="matches"?" / "+CURRENT_TAB:"")).slice(0,100),
      device:describeDevice(),last_error:LAST_APP_ERROR?LAST_APP_ERROR.slice(0,1000):null,
      contact_email:emailEl&&emailEl.value.trim()?emailEl.value.trim().slice(0,200):null};
    var btn=this;btn.disabled=true;btn.textContent="Sending…";
    try{
      var res=await sba.from("app_feedback").insert(row);
      if(res.error)throw res.error;
      ov.querySelector("div").innerHTML="<div style=\"text-align:center;padding:1rem 0.5rem;\"><i class=\"ti ti-circle-check\" style=\"font-size:44px;color:#1D9E75;\"></i>"+
        "<div style=\"font-size:16px;font-weight:700;margin:8px 0 4px;\">Thanks! We got it.</div>"+
        "<div style=\"font-size:13px;color:#6b6b6b;margin-bottom:14px;\">We read every report.</div>"+
        "<button class=\"bp\" id=\"fb-done\" style=\"margin-top:0;\">Done</button></div>";
      document.getElementById("fb-done").addEventListener("click",function(){ov.remove();});
    }catch(ex){
      console.warn("[Partnr] feedback failed:",ex);
      btn.disabled=false;btn.textContent="Send";
      showErr("fb-msg","Couldn't send right now. Please try again in a moment.");
    }
  });
}
(function(){var l=document.getElementById("fb-link");if(l)l.addEventListener("click",openFeedback);})();
