async function loadWorkspaceItems(connectionId){
  var el=document.getElementById("ws-list");if(!el)return;
  try{
    var res=await sba.from("workspace_items").select("*").eq("connection_id",connectionId).order("created_at",{ascending:false});
    if(res.error)throw res.error;
    var items=res.data||[];
    if(!items.length){
      el.innerHTML="<p style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">Nothing shared yet — add a link or upload a document below.</p>";
      return;
    }
    var session=await getSession();
    var myId=session&&session.user?session.user.id:null;
    var rows=[];
    for(var i=0;i<items.length;i++){
      var it=items[i];
      var mine=it.student_id===myId;
      var icon=it.type==="link"?"ti-link":"ti-file";
      var actionHtml;
      if(it.type==="link"){
        actionHtml="<a href=\""+safeUrl(it.url)+"\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;color:#7F77DD;text-decoration:none;\">Open →</a>";
      } else {
        var signed=await sba.storage.from("workspace-files").createSignedUrl(it.storage_path,3600);
        var dlUrl=(signed&&signed.data&&signed.data.signedUrl)||"#";
        actionHtml="<a href=\""+safeUrl(dlUrl)+"\" target=\"_blank\" rel=\"noopener\" style=\"font-size:12px;color:#7F77DD;text-decoration:none;\">Download →</a>";
      }
      rows.push("<div class=\"pit\">"+
        "<i class=\"ti "+icon+"\" style=\"font-size:18px;color:#6b6b6b;\"></i>"+
        "<div style=\"flex:1;min-width:0;\"><div style=\"font-size:13px;font-weight:600;color:#1a1a1a;\">"+esc(it.title)+"</div>"+actionHtml+"</div>"+
        (mine?"<button class=\"ws-delete\" data-id=\""+esc(it.id)+"\" style=\"background:none;border:none;cursor:pointer;color:#6b6b6b;font-size:15px;\">×</button>":"")+
      "</div>");
    }
    el.innerHTML=rows.join("");
    document.querySelectorAll(".ws-delete").forEach(function(btn){
      btn.addEventListener("click",async function(){
        await sba.from("workspace_items").delete().eq("id",this.dataset.id);
        loadWorkspaceItems(connectionId);
      });
    });
  }catch(ex){
    console.error("[Partnr] workspace load failed:",ex);
    el.innerHTML="<p style=\"font-size:13px;color:#C53030;\">Couldn't load workspace items — please try again.</p>";
  }
}

async function addWorkspaceLink(connectionId){
  var title=document.getElementById("ws-link-title").value.trim();
  var url=document.getElementById("ws-link-url").value.trim();
  if(!title||!url){showToast("Add both a title and a link");return;}
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  var session=await getSession();
  if(!session)return;
  var res=await sba.from("workspace_items").insert({
    connection_id:connectionId,student_id:session.user.id,type:"link",title:title,url:url
  });
  if(res.error){showToast("Couldn't add link — please try again");return;}
  document.getElementById("ws-link-title").value="";
  document.getElementById("ws-link-url").value="";
  loadWorkspaceItems(connectionId);
}

async function uploadWorkspaceFile(connectionId,inputEl){
  var file=inputEl.files[0];
  if(!file)return;
  var ext=file.name.split(".").pop().toLowerCase();
  var statusEl=document.getElementById("ws-upload-status");
  if(WORKSPACE_ALLOWED_EXT.indexOf(ext)<0){
    statusEl.textContent="That file type isn't supported — documents only (PDF, Word, PowerPoint, Excel, text, CSV).";
    statusEl.style.color="#C53030";
    inputEl.value="";
    return;
  }
  if(file.size>WORKSPACE_MAX_BYTES){
    statusEl.textContent="That file is too large — 10MB max.";
    statusEl.style.color="#C53030";
    inputEl.value="";
    return;
  }
  statusEl.textContent="Uploading…";
  statusEl.style.color="#6b6b6b";
  var session=await getSession();
  if(!session)return;
  var path=connectionId+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  try{
    var uploadRes=await sba.storage.from("workspace-files").upload(path,file);
    if(uploadRes.error)throw uploadRes.error;
    var insertRes=await sba.from("workspace_items").insert({
      connection_id:connectionId,student_id:session.user.id,type:"file",title:file.name,storage_path:path
    });
    if(insertRes.error)throw insertRes.error;
    statusEl.textContent="Uploaded.";
    statusEl.style.color="#3B6D11";
    inputEl.value="";
    loadWorkspaceItems(connectionId);
  }catch(ex){
    console.error("[Partnr] file upload failed:",ex);
    statusEl.textContent="Upload failed — please try again.";
    statusEl.style.color="#C53030";
  }
}

// ── Chat (per accepted connection) ────────────
// Text-only by design — files and images live in Workspace, not here.
// Messages are immutable once sent (no edit/delete policy exists at
// all), so a real, untampered conversation history is always available
// if a report is ever filed. Real-time via Supabase's built-in
// postgres_changes subscription — no separate infrastructure needed.
var CHAT_CHANNEL=null;

// Soft, non-blocking nudge — never prevents sending, just asks once.
// Off-platform contact means the conversation can no longer be
// reviewed if something goes wrong, which is the whole safety value
// of keeping it on Partnr in the first place.
function looksLikeContactInfo(text){
  var phonePattern=/\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b/;
  var emailPattern=/\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/i;
  var socialPattern=/\b(snap(chat)?|insta(gram)?|discord|whatsapp|telegram|kik)\b/i;
  return phonePattern.test(text)||emailPattern.test(text)||socialPattern.test(text);
}

// Shows a crisis resource to the person who just typed the message —
// modeled on how a search engine surfaces a resource banner to a
// searcher, not a report routed to anyone for review. The message
// still sends normally either way: never blocked, never delayed, and
// this card is never seen by the recipient or stored anywhere. No
// queue, no notification to anyone else, nothing for a human on the
// other end to catch or act on in real time.
var SELF_HARM_PATTERNS=[
  /kill myself/i,/killing myself/i,/want to die/i,/wanted to die/i,
  /end my life/i,/ending my life/i,/i'?m suicidal/i,
  /hurt myself/i,/hurting myself/i,
  /don'?t want to (live|be alive)/i,/no reason to live/i
];
function matchesSelfHarmConcern(text){
  return SELF_HARM_PATTERNS.some(function(p){return p.test(text);});
}

async function rChat(connectionId,otherName){
  R(logo()+
    "<button id=\"chat-back\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#6b6b6b;cursor:pointer;background:none;border:none;margin-bottom:0.5rem;padding:0;font-family:inherit;\"><i class=\"ti ti-arrow-left\" style=\"font-size:15px;\"></i> Back to Inbox</button>"+
    "<h2 style=\"margin-bottom:2px;\">Chat with "+esc(otherName)+"</h2>"+
    "<div style=\"font-size:11px;color:#6b6b6b;margin-bottom:1rem;\"><i class=\"ti ti-shield-check\" style=\"font-size:11px;vertical-align:-1px;margin-right:3px;color:#3B6D11;\"></i>Text only — for files and links, use your Workspace.</div>"+
    "<div id=\"chat-messages\" style=\"background:#f8f8f6;border-radius:12px;padding:12px;height:340px;overflow-y:auto;margin-bottom:0.75rem;display:flex;flex-direction:column;gap:8px;\"><div style=\"text-align:center;padding:1rem;\"><div class=\"spin\" style=\"margin:0 auto;\"></div></div></div>"+
    "<div id=\"chat-warning\" style=\"display:none;font-size:12px;color:#854F0B;background:#FAEEDA;border-radius:8px;padding:8px 12px;margin-bottom:8px;\">Sharing contact info off Partnr means this conversation can't be reviewed if something goes wrong. Send anyway?</div>"+
    "<div id=\"chat-selfharm-card\" style=\"display:none;font-size:13px;color:#1a1a1a;background:#EEEDFE;border-radius:10px;padding:12px 14px;margin-bottom:8px;line-height:1.5;\">"+
      "It sounds like you might be going through something hard. You don't have to deal with it alone.<br>"+
      "<a href=\"tel:988\" style=\"color:#534AB7;font-weight:600;text-decoration:none;\">Call or text 988</a> — free, confidential, any time. "+
      "<button id=\"chat-selfharm-dismiss\" style=\"background:none;border:none;color:#6b6b6b;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-left:6px;font-family:inherit;\">Dismiss</button>"+
    "</div>"+
    "<div style=\"display:flex;gap:8px;\">"+
      "<input id=\"chat-input\" placeholder=\"Type a message...\" style=\"flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;\"/>"+
      "<button id=\"chat-send\" style=\"padding:10px 16px;background:#7F77DD;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;\">Send</button>"+
    "</div>"
  );
  document.getElementById("chat-back").addEventListener("click",function(){
    unsubscribeChatChannel();
    showTab("conns");
  });
  var pendingSend=false;
  function doSend(force){
    var input=document.getElementById("chat-input");
    var text=input.value.trim();
    if(!text)return;
    if(!force&&looksLikeContactInfo(text)){
      document.getElementById("chat-warning").style.display="block";
      pendingSend=true;
      return;
    }
    document.getElementById("chat-warning").style.display="none";
    pendingSend=false;
    if(matchesSelfHarmConcern(text)){
      document.getElementById("chat-selfharm-card").style.display="block";
    }
    sendChatMessage(connectionId,text);
    input.value="";
  }
  document.getElementById("chat-send").addEventListener("click",function(){doSend(pendingSend);});
  document.getElementById("chat-input").addEventListener("keydown",function(e){
    if(e.key==="Enter"){e.preventDefault();doSend(pendingSend);}
  });
  var shDismiss=document.getElementById("chat-selfharm-dismiss");
  if(shDismiss)shDismiss.addEventListener("click",function(){
    document.getElementById("chat-selfharm-card").style.display="none";
  });
  await loadChatMessages(connectionId);
  subscribeChatChannel(connectionId);
}

async function sendChatMessage(connectionId,text){
  var session=await getSession();
  if(!session)return;
  var res=await sba.from("messages").insert({connection_id:connectionId,sender_id:session.user.id,body:text});
  if(res.error){showToast("Couldn't send — please try again");console.error("[Partnr] send message failed:",res.error);}
}

async function loadChatMessages(connectionId){
  var el=document.getElementById("chat-messages");if(!el)return;
  try{
    var res=await sba.from("messages").select("*").eq("connection_id",connectionId).order("created_at",{ascending:true});
    if(res.error)throw res.error;
    var session=await getSession();
    var myId=session&&session.user?session.user.id:null;
    renderChatMessages(res.data||[],myId);
    markMessagesRead(connectionId,myId);
  }catch(ex){
    console.error("[Partnr] loading messages failed:",ex);
    el.innerHTML="<p style=\"font-size:13px;color:#C53030;text-align:center;\">Couldn't load messages — please try again.</p>";
  }
}

function renderChatMessages(msgs,myId){
  var el=document.getElementById("chat-messages");if(!el)return;
  if(!msgs.length){
    el.innerHTML="<p style=\"font-size:13px;color:#6b6b6b;text-align:center;margin:auto;\">Say hi — this is the start of your conversation.</p>";
    return;
  }
  el.innerHTML=msgs.map(function(m,i){
    var mine=m.sender_id===myId;
    // Only the LAST of my own messages shows a read receipt — matches
    // how most chat apps do it, rather than a checkmark on every line.
    var isLastMine=mine&&(i===msgs.length-1||msgs.slice(i+1).every(function(x){return x.sender_id===myId;}));
    var readLabel=(mine&&isLastMine&&m.read_at)?"<div style=\"font-size:10px;color:#9a97c9;text-align:right;margin-top:2px;\">Read</div>":"";
    return "<div style=\"align-self:"+(mine?"flex-end":"flex-start")+";max-width:75%;\">"+
      "<div style=\"background:"+(mine?"#7F77DD":"white")+";color:"+(mine?"white":"#1a1a1a")+";padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;word-break:break-word;\">"+esc(m.body)+"</div>"+
      readLabel+
    "</div>";
  }).join("");
  el.scrollTop=el.scrollHeight;
}

async function markMessagesRead(connectionId,myId){
  try{
    await sba.from("messages").update({read_at:new Date().toISOString()})
      .eq("connection_id",connectionId).is("read_at",null).neq("sender_id",myId);
    updateConnBadge();
  }catch(ex){/* cosmetic — never block chat on this */}
}

// Real-time: on any new message in this connection, re-fetch and
// re-render. Simpler and more robust than trying to append just the
// one new row (also self-corrects if a message was somehow missed).
function subscribeChatChannel(connectionId){
  unsubscribeChatChannel();
  CHAT_CHANNEL=sba.channel("messages-"+connectionId)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"connection_id=eq."+connectionId},async function(){
      var session=await getSession();
      var myId=session&&session.user?session.user.id:null;
      var res=await sba.from("messages").select("*").eq("connection_id",connectionId).order("created_at",{ascending:true});
      renderChatMessages(res.data||[],myId);
      markMessagesRead(connectionId,myId);
    })
    .subscribe();
}
function unsubscribeChatChannel(){
  if(CHAT_CHANNEL){sba.removeChannel(CHAT_CHANNEL);CHAT_CHANNEL=null;}
}

      "<button id=\"sendVerifyCodeBtn\" style=\"font-size:12px;font-weight:600;color:#fff;background:#534AB7;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;\">Send code</button>";
    wrap.appendChild(inputBox);
    var schoolEmailInputEl=document.getElementById("schoolEmailInput");
    // Pre-fill only if the login email is itself already a non-personal
    // domain - a small convenience, never assumed otherwise.
    schoolEmailInputEl.value=(S.email&&PERSONAL_EMAIL_DOMAINS.indexOf(getEmailDomain(S.email))<0)?S.email:"";
    schoolEmailInputEl.focus();
    function showVerifyEmailErr(msg){
      var errBox=document.getElementById("verifyEmailErr");
      if(!errBox){
        errBox=document.createElement("div");
        errBox.id="verifyEmailErr";
        errBox.style.cssText="margin-top:6px;font-size:12px;color:#A32D2D;width:100%;";
        wrap.appendChild(errBox);
      }
      errBox.textContent=msg;
    }
    document.getElementById("sendVerifyCodeBtn").addEventListener("click",async function(){
      var typedEmail=document.getElementById("schoolEmailInput").value.trim();
      var domain=getEmailDomain(typedEmail);
      var sendBtn=this;
      var existingErr=document.getElementById("verifyEmailErr");if(existingErr)existingErr.remove();
      if(!typedEmail||!typedEmail.includes("@")){
        showVerifyEmailErr("Enter a valid email address.");
        return;
      }
      if(!domain||PERSONAL_EMAIL_DOMAINS.indexOf(domain)>=0){
        showVerifyEmailErr("This only works with a school email address, not a personal one like Gmail.");
        return;
      }
      sendBtn.disabled=true;sendBtn.textContent="Generating code…";
      function makeCode(){
        var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";var c="";
        for(var i=0;i<6;i++)c+=chars[Math.floor(Math.random()*chars.length)];
        return c;
      }
      try{
        var session=await getSession();
        var code=null,attemptsN=0;
        while(attemptsN<3&&!code){
          var candidate=makeCode();
          var ins=await sba.from("school_email_verification_codes").insert({
            student_id:session.user.id,code:candidate,expected_domain:domain,claimed_email:typedEmail
          });
          if(!ins.error)code=candidate;
          attemptsN++;
        }
        if(!code){throw new Error("Could not generate a unique code");}
        inputBox.innerHTML="Send an email from <strong>"+esc(typedEmail)+"</strong> to <strong>verify@projectpartnr.com</strong> with this code anywhere in the subject line:"+
          "<div style=\"font-size:18px;font-weight:700;letter-spacing:2px;margin:8px 0;color:#534AB7;\">"+code+"</div>"+
          "<button id=\"checkVerifyStatus\" style=\"font-size:12px;font-weight:600;color:#fff;background:#534AB7;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;\">I've sent it - check now</button>"+
          "<div id=\"verifyStatusMsg\" style=\"margin-top:6px;\"></div>";
        document.getElementById("checkVerifyStatus").addEventListener("click",async function(){
          var btn=this;btn.disabled=true;btn.textContent="Checking…";
          try{
            var check=await sba.from("school_email_verification_codes").select("status").eq("code",code).maybeSingle();
            var msgEl=document.getElementById("verifyStatusMsg");
            if(check.data&&check.data.status==="verified"){
              S.schoolVerification="verified";
              var el=document.getElementById("tc");
              if(el){el.innerHTML=meTab();bindMeTab();}
            }else if(check.data&&check.data.status==="failed"){
              msgEl.innerHTML="<span style=\"font-size:12px;color:#A32D2D;\">The email arrived, but not from the expected domain. Make sure you're sending from your real school account.</span>";
              btn.disabled=false;btn.textContent="Check again";
            }else{
              msgEl.innerHTML="<span style=\"font-size:12px;color:#6b6b6b;\">Not received yet - school email can take a few minutes to arrive.</span>";
              btn.disabled=false;btn.textContent="Check again";
            }
          }catch(ex){
            btn.disabled=false;btn.textContent="Check again";
          }
        });
      }catch(ex){
        console.error("Verification code generation failed",ex);
        showVerifyEmailErr("Something went wrong generating your code — please try again.");
        sendBtn.disabled=false;sendBtn.textContent="Send code";
      }
    });
    schoolEmailInputEl.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();document.getElementById("sendVerifyCodeBtn").click();}
    });
  });
  // Real fallback for students who genuinely can't complete school-email
  // verification (e.g. their school blocks all outside mail). Replaces
  // the old "Request verification" field, which only wrote to a column
  // nobody ever reviewed - this inserts into a real table with a DB
  // trigger that emails hello@projectpartnr.com automatically.
  var helpVerifyBtn=document.getElementById("helpVerifyBtn");
  if(helpVerifyBtn)helpVerifyBtn.addEventListener("click",function(){
    var wrap=helpVerifyBtn.parentNode;

  var epBtn=document.getElementById("edit-profile-btn");

async function srchSkill(opts){
  if(typeof opts==="string")opts={query:opts};
  opts=opts||{};
  var query=(opts.query||"").trim();
  var competition=(opts.competition||"").trim();
  var category=(opts.category||"").trim();
  var subcat=(opts.subcat||"").trim();
  var city=(opts.city||"").trim();
  var school=(opts.school||"").trim();
  var SUBCAT_LABELS={coding:"Coding",robotics:"Robotics"};
  var isFilterOnly=!query&&(competition||category||subcat||city||school); // no typed text, pure structured filter

  var descParts=[];
  if(query)descParts.push("\""+query+"\"");
  if(competition)descParts.push(competition);
  if(category)descParts.push("all "+((CM2[category]&&CM2[category].n)||category)+" competitions");
  if(subcat)descParts.push("all "+(SUBCAT_LABELS[subcat]||subcat)+" competitions");
  if(city)descParts.push("in "+city);
  if(school)descParts.push("at "+school);
  var desc=descParts.join(" · ")||"partners";

  var el=document.getElementById("sr");if(!el)return;
  el.innerHTML="<div style=\"text-align:center;padding:1.5rem;\"><div class=\"spin\" style=\"margin:0 auto 0.5rem;\"></div><div style=\"font-size:13px;color:#6b6b6b;\">Searching for "+esc(desc)+"...</div></div>";
  try{
    var session=await getSession();
    var myId=session&&session.user?session.user.id:null;
    var real=await searchRealStudents({query:query,competition:competition,category:category,subcat:subcat,city:city,school:school},myId);
    if(real.length){renderSR(real,desc,false);return;}
  }catch(ex){
    console.error("[Partnr search] failed:",ex);
    el.innerHTML="<div style=\"text-align:center;padding:2rem 1rem;\">"+
      "<i class=\"ti ti-alert-circle\" style=\"font-size:32px;color:#C53030;\"></i>"+
      "<div style=\"font-size:14px;font-weight:600;color:#1a1a1a;margin:10px 0 6px;\">Search didn't work</div>"+
      "<div style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">Something went wrong reaching the student database. Check your connection and try again.</div>"+
    "</div>";
    return;
  }
  if(isFilterOnly){
    // Structured filters (competition/city/school) found no real matches.
    // Demo profiles here would actively mislead — they wouldn't actually
    // be at that school or targeting that competition — so this gets an
    // honest empty state instead of a fabricated result.
    el.innerHTML="<div style=\"text-align:center;padding:2rem 1rem;\">"+
      "<i class=\"ti ti-users-group\" style=\"font-size:32px;color:#AFA9EC;\"></i>"+
      "<div style=\"font-size:14px;font-weight:600;color:#1a1a1a;margin:10px 0 6px;\">No real students match yet</div>"+
      "<div style=\"font-size:13px;color:#6b6b6b;line-height:1.6;\">Nobody onboarded so far matches "+esc(desc)+". Check back as more students join, or try widening your filters.</div>"+
    "</div>";
    return;
  }
  // Free-text search with no real matches — show demo profiles instead,
  // clearly labeled so nobody mistakes them for real matches.
  renderSR(demoSR(query||desc),desc,true);
}

          ((r.links&&r.links[0])?"<a href=\""+safeUrl(r.links[0].url)+"\" style=\"font-size:12px;color:"+t.c+";text-decoration:none;display:flex;align-items:center;gap:3px;padding:6px 0;\" target=\"_blank\" rel=\"noopener\"><i class=\"ti ti-external-link\" style=\"font-size:12px;\"></i>"+esc(r.links[0].url)+"</a>":"")+
          (r._realId?"<button class=\"bg2 sr-save\" data-realid=\""+esc(r._realId)+"\" title=\""+(isSaved?"Remove from saved":"Save privately")+"\" aria-label=\""+(isSaved?"Remove ":"Save ")+esc(r.name)+"\"><i class=\"ti "+(isSaved?"ti-star-filled":"ti-star")+"\" style=\"font-size:14px;color:"+(isSaved?"#BA7517":"inherit")+";\"></i></button>":"")+

        "</div>"+
      "</div>"+
    "</div>";
  });
  el.innerHTML=h;
  document.querySelectorAll(".sr-connect").forEach(function(btn){
    btn.addEventListener("click",function(){
      var realId=this.dataset.realid;
      if(realId){openSearchConnectModal(realId,btn.dataset.name);}
      else{showToast("Connect request sent to "+btn.dataset.name+" (demo)");}
    });
  });
  document.querySelectorAll(".sr-report").forEach(function(btn){
    btn.addEventListener("click",function(){
      openReportModal(this.dataset.realid,this.dataset.name,"profile",null,returnToSkillSearch);
    });
  });
  document.querySelectorAll(".sr-save").forEach(function(btn){
    btn.addEventListener("click",async function(){
      var id=this.dataset.realid;
      var icon=this.querySelector("i");
      var nowSaved=await toggleSaveProfile(id);
      icon.className="ti "+(nowSaved?"ti-star-filled":"ti-star");
      icon.style.color=nowSaved?"#BA7517":"inherit";
      this.title=nowSaved?"Remove from saved":"Save privately";
      var savedChipEl=document.getElementById("filter-saved");
      if(savedChipEl)savedChipEl.textContent="★ Saved ("+S.savedIds.length+")";
    });
  });
}

// Lightweight connect modal specifically for real Skill Search
// results — separate from openModal() since search results aren't
// indexed into the MATCHES array the way AI matches are.
function openSearchConnectModal(realId,name){
  R(logo()+
    "<div style=\"min-height:340px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;border-radius:16px;padding:1rem;\">"+
      "<div style=\"background:white;border-radius:16px;padding:1.5rem;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,0.15);\">"+
        "<div style=\"font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:4px;\">Connect with "+esc(name)+"</div>"+
        "<div style=\"font-size:13px;color:#6b6b6b;margin-bottom:1rem;\">Write a short intro — tell them why you want to collaborate.</div>"+
        "<div style=\"background:#f8f8f6;border-radius:8px;padding:10px 12px;margin-bottom:1rem;font-size:13px;color:#666;\"><i class=\"ti ti-shield-check\" style=\"font-size:13px;vertical-align:-1px;margin-right:4px;color:#3B6D11;\"></i>This introduces you — you'll both see the connection in your Inbox once accepted. Full messaging and parent visibility are still being built.</div>"+
        "<textarea id=\"srmsg\" placeholder=\"Hi! I saw your profile and think we would work great together...\" style=\"width:100%;height:90px;resize:none;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;color:#1a1a1a;background:white;margin-bottom:1rem;\"></textarea>"+
        "<div style=\"display:flex;gap:8px;\">"+
          "<button id=\"srsbtn\" style=\"flex:1;padding:10px;background:#7F77DD;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;\">Send request →</button>"+
          "<button id=\"srcbtn\" style=\"padding:10px 16px;background:#f8f8f6;border:1px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer;color:#666;font-family:inherit;\">Cancel</button>"+
        "</div>"+
      "</div>"+
    "</div>"
  );
  document.getElementById("srcbtn").addEventListener("click",returnToSkillSearch);
  document.getElementById("srsbtn").addEventListener("click",async function(){
    var msg=document.getElementById("srmsg").value.trim();
    if(!msg){showErr("srmsg","Write a short intro message before sending");scrollToFirstErr();return;}
    var btn=this;btn.disabled=true;btn.textContent="Sending…";
    try{
      var res=await sendConnectionRequest(realId,msg);
      if(res.error){
        btn.disabled=false;btn.textContent="Send request →";
        showToast("Couldn't send request — please try again");
        return;
      }
      R(logo()+"<div style=\"min-height:280px;display:flex;align-items:center;justify-content:center;\"><div style=\"text-align:center;padding:2rem;\"><i class=\"ti ti-circle-check\" style=\"font-size:52px;color:#1D9E75;\"></i><div style=\"font-size:20px;font-weight:700;color:#1a1a1a;margin:12px 0 6px;\">Request sent!</div><div style=\"font-size:14px;color:#6b6b6b;margin-bottom:1.5rem;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.5;\">We notified <strong>"+esc(name)+"</strong>. You'll both get a shared project board when they accept.</div><button id=\"srdbn\" class=\"bp\" style=\"max-width:240px;margin:0 auto;display:block;\">Back to search</button></div></div>");
      document.getElementById("srdbn").addEventListener("click",returnToSkillSearch);
    }catch(ex){
      console.error("Search connect failed",ex);
      btn.disabled=false;btn.textContent="Send request →";
      showToast("Something went wrong — please try again");
    }
  });
}
function showToast(msg){
  var t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.2);";
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},2500);
}
