// Lazy-loads the world cities autocomplete data once (name + country +
// population, ~48k entries limited to real, medium-or-larger places).
// This is a suggestion list, not a whitelist — free text always stays
// allowed, since a global list this size can't include every small town
// and rejecting a real student's real hometown would work directly
// against why Partnr exists.
async function loadWorldCities(){
  if(WORLD_CITIES)return WORLD_CITIES;
  if(worldCitiesLoading)return worldCitiesLoading;
  worldCitiesLoading=fetch("world_cities.json").then(function(r){return r.json();}).then(function(data){
    WORLD_CITIES=data;
    return data;
  }).catch(function(ex){
    console.error("Could not load world cities list",ex);
    WORLD_CITIES=[];
    return WORLD_CITIES;
  });
  return worldCitiesLoading;
}

// Zip → city autofill via Zippopotam.us (free, no API key, ~60 countries,
// GeoNames-backed). Never blocks or errors the form — if the lookup fails,
// times out, or the country isn't covered, the student just keeps typing
// their city normally. Only fills the city field if it's currently empty,
// so it never overwrites something the student already entered.
async function autofillCityFromZip(country,zip,cityInputEl){
  var iso=COUNTRY_ISO[country];
  if(!iso||!zip||!cityInputEl||cityInputEl.value.trim())return;
  try{
    var res=await fetch("https://api.zippopotam.us/"+iso.toLowerCase()+"/"+encodeURIComponent(zip.trim()));
    if(!res.ok){console.warn("[Partnr] zip lookup returned",res.status,"for",iso,zip);return;}
    var data=await res.json();
    var place=data&&data.places&&data.places[0]&&data.places[0]["place name"];
    if(place&&!cityInputEl.value.trim()){
      cityInputEl.value=place;
      cityInputEl.dispatchEvent(new Event("input"));
    }
  }catch(ex){
    // Never shown to the user — this is a convenience, not a requirement —
    // but logged so a failure is actually diagnosable via DevTools instead
    // of just "the zip thing isn't working" with no way to tell why.
    console.warn("[Partnr] zip autofill failed (non-fatal):",ex);
  }
}

// Google includes an "hd" (hosted domain) claim ONLY for real school/
// work Google Workspace accounts — never for personal Gmail. This is
// Google itself cryptographically confirming domain ownership, which
// is stronger evidence than anything else in our verification system.
function getGoogleHostedDomain(session){
  if(!session||!session.user)return null;
  var meta=session.user.user_metadata||{};
  if(meta.hd)return meta.hd;
  var identities=session.user.identities||[];
  for(var i=0;i<identities.length;i++){
    if(identities[i].provider==="google"&&identities[i].identity_data&&identities[i].identity_data.hd){
      return identities[i].identity_data.hd;
    }
  }
  return null;
}
// Checks BOTH Google and Microsoft SSO for a confirmed organizational
// domain. Google gives us a direct "hd" claim. Microsoft doesn't
// expose an equivalent claim through Supabase, so instead we check
// the actual signed-in email's domain against the personal-provider
// blocklist (which already includes outlook.com, hotmail.com, etc.)
// — if it's NOT personal, it's a real Microsoft 365 organizational
// account, which is just as trustworthy a signal.
function getSSOConfirmedDomain(session){
  var hd=getGoogleHostedDomain(session);
  if(hd)return hd;
  if(session&&session.user&&session.user.app_metadata&&session.user.app_metadata.provider==="azure"){
    var msDomain=getEmailDomain(session.user.email);
    if(msDomain&&PERSONAL_EMAIL_DOMAINS.indexOf(msDomain)<0)return msDomain;
  }
  return null;

// ── School email verification ───────────────
// Personal email providers = NOT a school, always "self-reported"
var PERSONAL_EMAIL_DOMAINS=["gmail.com","yahoo.com","hotmail.com","outlook.com",
  "icloud.com","aol.com","live.com","msn.com","protonmail.com","mail.com",
  "gmx.com","yandex.com","qq.com","163.com","mail.ru","zoho.com"];

function getEmailDomain(email){
  var parts=(email||"").toLowerCase().split("@");
  return parts.length===2?parts[1]:"";
}

// Checks the student's email against the personal-provider list and
// the verified school_domains table. Returns:
//   {tier:"verified", schoolName: "..."}   — domain matches a confirmed school
//   {tier:"self_reported"}                  — personal email or unmatched domain
async function checkSchoolVerification(email,ssoConfirmedDomain){
  // SSO short-circuit: if Google or Microsoft itself confirmed this is
  // a real organizational account (not personal Gmail/Outlook), that's
  // stronger evidence than our own domain list — trust it directly,
  // but still try to look up the real school name if we happen to have it.
  if(ssoConfirmedDomain){
    var schoolName=null;
    try{
      var ssoRes=await sba.from("school_domains").select("school_name").eq("domain",ssoConfirmedDomain).maybeSingle();
      if(ssoRes.data)schoolName=ssoRes.data.school_name;
    }catch(ex){/* ignore, fall through to generic label below */}
    return {
      tier:"verified",
      schoolName:schoolName||("Verified via "+ssoConfirmedDomain),
      viaSSO:true
    };
  }

  var domain=getEmailDomain(email);
  if(!domain||PERSONAL_EMAIL_DOMAINS.indexOf(domain)>=0){
    return {tier:"self_reported"};
  }
  // Build every parent-domain candidate at real label (dot) boundaries only.
  // e.g. mymail.lausd.net -> also checks "lausd.net", but NEVER matches
  // via raw substring, so "evillausd.net" can never falsely match
  // "lausd.net" just because the characters happen to line up.
  var parts=domain.split(".");
  var candidates=[domain];
  for(var i=1;i<parts.length-1;i++){
    candidates.push(parts.slice(i).join("."));
  }
  try{
    var res=await sba.from("school_domains").select("domain,school_name,source").in("domain",candidates);
    if(res.data&&res.data.length){
      // If multiple candidates matched, prefer the most specific (longest) one.
      var best=res.data.reduce(function(a,b){return b.domain.length>a.domain.length?b:a;});
      // Hand-verified entries (manual/nais) get full "Verified" status.
      // Bulk-imported entries (cde_bulk) are honestly labeled as a lower
      // confidence tier, since the source data is a district's general
      // public website, not a confirmed email domain — some districts
      // (LAUSD, San Diego, Oak Park) turned out to use a totally
      // different domain for actual student/staff email.
      var isHighConfidence=(best.source==="manual"||best.source==="nais");
      return {
        tier:isHighConfidence?"verified":"likely_verified",
        schoolName:best.school_name
      };
    }
  }catch(ex){
    console.error("School verification lookup failed",ex);
  }
  // Domain isn't a known personal provider, but also isn't in our
  // verified table yet — treat as self-reported until it's added.
  return {tier:"self_reported"};
}

// Counts OTHER students who self-reported the SAME school name with
// the SAME email domain. This is a read-only trust signal only — it
// never writes to school_domains, so it can't be gamed into fake
// "verified" status the way an auto-write system could be.
async function countPeerCorroboration(email,schoolName){
  var domain=getEmailDomain(email);
  if(!domain||!schoolName)return 0;
  try{
    // The database counts matching students for us and returns only a
    // number - the app never downloads anyone else's email address.
    var res=await sba.rpc("peer_corroboration_count",{p_school:schoolName.trim(),p_domain:domain});
    return (res&&typeof res.data==="number")?res.data:0;
  }catch(ex){
    return 0;
  }
}

// ── Profile save / load ─────────────────────
// ── Signup lead capture ──────────────────────
// Fire-and-forget: saves whatever the student has entered so far into
// signup_leads, a separate table that doesn't require an authenticated
// session (unlike students). This runs at Step 2, updates at Step 3,
// and gets marked converted:true once the real students row is saved
// in saveProfile(). Lets us re-engage anyone who drops off partway
// through — "Come back and finish your profile" emails.
function saveSignupLead(fields){
  if(!fields||!fields.email)return;
  var row=Object.assign({email:fields.email,updated_at:new Date().toISOString()},fields);
  sba.from("signup_leads").upsert(row,{onConflict:"email"}).then(function(res){
    if(res.error)console.error("Lead capture failed",res.error);
  }).catch(function(ex){console.error("Lead capture threw",ex);});
}

async function saveProfile(){
  var session=await getSession();
  if(!session)return {error:"no session"};
  var uid=session.user.id;

  var ssoDomain=getSSOConfirmedDomain(session);
  var verification=await checkSchoolVerification(S.email,ssoDomain);
  var savedSchoolName=S.school;
  if(verification.tier==="verified"||verification.tier==="likely_verified"){
    // Safety fix: the displayed school comes from the confirmed domain
    // match, NOT from whatever the student typed — this is what stops
    // someone claiming a school their email doesn't actually belong to.
    // Applies to both tiers since the SCHOOL NAME is accurate either way
    // (from official government data) — the tier only reflects how
    // confident we are that this domain is actually used for email.
    savedSchoolName=verification.schoolName;
    S.school=verification.schoolName;
  } else {
    // Self-reported: check if others independently reported the same
    // school + domain combo. 2+ others (3 total) upgrades the badge
    // to a distinct "confirmed by multiple students" tier — still not
    // fully "Verified", but more trustworthy than a lone self-report.
    var peerCount=await countPeerCorroboration(S.email,S.school);
    if(peerCount>=2){
      verification.tier="self_reported_multiple";
    }
  }

  var upsertRes=await sba.from("students").upsert({
    id:uid,name:S.name,email:S.email,school:savedSchoolName,country:S.country,city:S.city,
    zip:S.zip,grade:S.grade,track:S.track,role:S.role,secondary:S.secondary,status:S.status,
    idea:S.idea,availability:S.availability,commit:S.commit,github:S.github,location:S.location,
    location_pref:S.locationPref,links:S.links||[],proof_of_work:S.proofOfWork||[],
    stage:S.stage,school_verification:verification.tier,onboarded:true,skills_needed:S.skillsNeeded||"",dob:S.dob||null
  });
  if(upsertRes.error)return upsertRes;

  await sba.from("skills").delete().eq("student_id",uid);
  var skillRows=Object.keys(S.skillLevels||{}).map(function(k){
    var parts=k.split(":");
    return {student_id:uid,category:parts[0],skill_name:parts[1]||parts[0],level:S.skillLevels[k]||null};
  });
  if(skillRows.length){
    var skillsIns=await sba.from("skills").insert(skillRows);
    if(skillsIns.error)return skillsIns;
  }

  await sba.from("languages").delete().eq("student_id",uid);
  if((S.languages||[]).length){
    var langIns=await sba.from("languages").insert(S.languages.map(function(l){return {student_id:uid,language_name:l};}));
    if(langIns.error)return langIns;
  }

  await sba.from("competitions").delete().eq("student_id",uid);
  if((S.comps||[]).length){
    var compIns=await sba.from("competitions").insert(S.comps.map(function(c){
      return {student_id:uid,competition_name:(c&&c.name)?c.name:c,cross_type:(c&&c.type)?c.type:null};
    }));
    if(compIns.error)return compIns;
  }
  return {error:null};
}
async function loadProfileIntoState(uid){
  var pRes=await sba.from("students").select("*").eq("id",uid).single();
  if(pRes.error||!pRes.data)return null;
  var p=pRes.data;
  S.name=p.name||"";S.email=p.email||"";S.school=p.school||"";S.country=p.country||"";
  S.city=p.city||"";S.zip=p.zip||"";S.grade=p.grade||"";S.track=p.track||"";S.role=p.role||"";
  S.secondary=p.secondary||[];S.status=p.status||"";S.idea=p.idea||"";S.availability=p.availability||"";
  S.commit=p.commit||"";S.github=p.github||"";S.location=p.location||"";S.locationPref=p.location_pref||"";
  S.links=p.links||[];S.proofOfWork=p.proof_of_work||[];S.savedIds=p.saved_profiles||[];S.stage=p.stage||"";
  S.schoolVerification=p.school_verification||"self_reported";
  S.dob=p.dob||"";
  S.skillsNeeded=p.skills_needed||"";

  return p;
}

// ── Safety: blocks & reports ─────────────────
// BLOCKED_IDS is a convenience cache for hiding people in the UI.
// It is NOT the security boundary — blocking is enforced server-side
// by restrictive RLS policies in Supabase, so a blocked student can't
// reach around the interface by calling the API directly.
var BLOCKED_IDS={};

async function loadBlockedIds(){
  try{
    var session=await getSession();
    if(!session)return;
    var res=await sba.from("blocks").select("blocked_id").eq("blocker_id",session.user.id);
    BLOCKED_IDS={};
    (res.data||[]).forEach(function(r){BLOCKED_IDS[r.blocked_id]=true;});
  }catch(ex){console.error("Could not load blocks",ex);}
}

async function blockStudent(otherId){
  var session=await getSession();
  if(!session)return {error:"no session"};
  if(!otherId||otherId===session.user.id)return {error:"invalid target"};
  var res=await sba.from("blocks").insert({blocker_id:session.user.id,blocked_id:otherId});
  // A duplicate block isn't a failure from the student's point of
  // view — they wanted this person blocked, and they are.
  if(res.error&&res.error.code!=="23505")return res;
  BLOCKED_IDS[otherId]=true;
  return {error:null};
}

async function unblockStudent(otherId){
  var session=await getSession();
  if(!session)return {error:"no session"};
  var res=await sba.from("blocks").delete().eq("blocker_id",session.user.id).eq("blocked_id",otherId);
  if(!res.error)delete BLOCKED_IDS[otherId];
  return res;
}

    reporter_id:session.user.id,
    reported_id:reportedId,
    reason:reason,
    details:details||null,
    context:context||"profile",
    context_id:contextId||null
  });
}

// ── Real student search ──────────────────────
// Searches the real students table by skill/category, competition name,
// and free-text idea — instead of asking Claude to invent fictional
// people. Returns an array shaped to match what renderSR() expects,
// plus a hidden _realId on each result so Connect can send a real
// connection request instead of a demo toast.
var AVATAR_COLORS=["purple","teal","coral","blue","green"];
function colorForId(id){
  var sum=(id||"").split("").reduce(function(a,c){return a+c.charCodeAt(0);},0);
  return AVATAR_COLORS[sum%AVATAR_COLORS.length];
}
function initialsFor(name){
  return (name||"?").trim().split(/\s+/).map(function(w){return w[0];}).join("").substring(0,2).toUpperCase();
}
// Shown to OTHER students — "Lucas H." instead of a full last name. The
// full name is still collected and stored (needed for verification and
// safety review), this only affects how it's rendered in the app to
// people who aren't the profile's own owner. A single-word name (or one
// already this short) is returned unchanged rather than truncated oddly.
// School is hidden from other students by default - the same kind of
// identifying detail displayName() already protects by truncating last
// names. It's shown only when it's actually load-bearing: a real,
// currently-shared target competition that requires same school (the
// whole point of that match is confirming that), or once a connection
// is genuinely accepted. Falls back to city, which tells another
// student everything they actually need (can we meet, what hours
// overlap) without handing a stranger the exact school a minor attends.
function locationLine(school,city,country,showSchool){
  var head=(showSchool&&school)?school:(city||"");
  return esc(head)+(country?" · "+esc(country):"");
}
// True only when a competition both students are actually targeting
// requires the same school - not just any shared interest.
function sharesSchoolRequiredComp(theirComps){
  if(!theirComps||!theirComps.length||!S.comps||!S.comps.length)return false;
  return theirComps.some(function(name){
    if(S.comps.indexOf(name)<0)return false;
    var c=COMPS.find(function(x){return x.n===name;});
    return c&&c.cross===false;
  });
}

function displayName(name){
  var parts=(name||"").trim().split(/\s+/);
  if(parts.length<2)return name||"";
  return parts[0]+" "+parts[parts.length-1][0]+".";
}
// Accepts either a plain string (old free-text call sites keep working)
// or an options object: {query, city, school, competition}. Filters
// combine with AND — e.g. city + competition finds students in that city
// targeting that exact competition. city/school are plain columns on
// students, so they're applied directly; competition and free-text query
// narrow via a candidate-id set first, same as the original approach.
// Toggling a save is a private, personal action - persist it immediately
// rather than waiting for the student to hit Continue somewhere else.
async function toggleSaveProfile(id){
  var on=S.savedIds.indexOf(id)>=0;

async function fetchSavedStudents(){
  if(!S.savedIds.length)return [];
  var studentsRes=await sba.from("students_public").select("id,name,school,city,country,grade,track,role,availability,status,idea,proof_of_work,links").in("id",S.savedIds);
  if(studentsRes.error)throw studentsRes.error;
  var students=(studentsRes.data||[]).filter(function(s){return !BLOCKED_IDS[s.id];});
  if(!students.length)return [];
  var finalIds=students.map(function(s){return s.id;});
  var allSkillsRes=await sba.from("skills").select("student_id,category,skill_name,level").in("student_id",finalIds);
  var skillsByStudent={};
  (allSkillsRes.data||[]).forEach(function(r){(skillsByStudent[r.student_id]=skillsByStudent[r.student_id]||[]).push(r);});
  var allCompsRes=await sba.from("competitions").select("student_id,competition_name").in("student_id",finalIds);
  var compsByStudent={};
  (allCompsRes.data||[]).forEach(function(r){(compsByStudent[r.student_id]=compsByStudent[r.student_id]||[]).push(r.competition_name);});
  return students.map(function(s){
    var mySkills=skillsByStudent[s.id]||[];
    var keySkill=mySkills[0]?mySkills[0].skill_name:"Partner";
    var keyLevel=(mySkills[0]&&mySkills[0].level)||"Intermediate";
    var otherSkills=mySkills.filter(function(x){return x.skill_name!==keySkill;}).slice(0,3).map(function(x){return x.skill_name;});
    return {
      name:s.name,school:s.school,city:s.city,country:s.country,grade:s.grade,
      avatar:initialsFor(s.name),avatarColor:colorForId(s.id),
      track:s.track,role:s.role,
      availability:s.availability||"Not specified",
      status:s.status||"Open to connecting",
      bio:s.idea||"Hasn't added a bio yet.",
      keySkill:keySkill,keyLevel:keyLevel,
      otherSkills:otherSkills,
      competitions:compsByStudent[s.id]||[],
      proofOfWork:s.proof_of_work||[],
      links:s.links||[],
      _realId:s.id
    };
  });
}
async function searchRealStudents(opts,excludeId){
  if(typeof opts==="string")opts={query:opts};
  opts=opts||{};
  var query=(opts.query||"").trim();
  var city=(opts.city||"").trim();
  var school=(opts.school||"").trim();
  var competition=(opts.competition||"").trim();
  var category=(opts.category||"").trim();
  var subcat=(opts.subcat||"").trim();
  if(!query&&!city&&!school&&!competition&&!category&&!subcat)return [];

  var idList=null; // null = no id-narrowing needed (pure city/school filter)
  var skillMatch={};

  if(query||competition||category||subcat){
    var ids={};
    if(query){
      var wc=query;
      var skillsRes=await sba.from("skills").select("student_id,category,skill_name,level")
        .or("skill_name.ilike.*"+wc+"*,category.ilike.*"+wc+"*");
      if(skillsRes.error)throw skillsRes.error;
      (skillsRes.data||[]).forEach(function(r){
        ids[r.student_id]=true;
        if(!skillMatch[r.student_id])skillMatch[r.student_id]={skill:r.skill_name,level:r.level};
      });
      var qp="%"+query+"%";
      var compTextRes=await sba.from("competitions").select("student_id,competition_name").ilike("competition_name",qp);
      if(compTextRes.error)throw compTextRes.error;
      (compTextRes.data||[]).forEach(function(r){ids[r.student_id]=true;});
      var ideaRes=await sba.from("students_public").select("id").ilike("idea",qp);
      if(ideaRes.error)throw ideaRes.error;
      (ideaRes.data||[]).forEach(function(r){ids[r.id]=true;});
    }
    if(competition){
      var compExactRes=await sba.from("competitions").select("student_id").eq("competition_name",competition);
      if(compExactRes.error)throw compExactRes.error;
      var compIds={};
      (compExactRes.data||[]).forEach(function(r){compIds[r.student_id]=true;});
      if(query){
        var narrowed={};
        Object.keys(ids).forEach(function(id){if(compIds[id])narrowed[id]=true;});
        ids=narrowed;
      } else {
        ids=compIds;
      }
    }
    if(category){
      // Broader than an exact competition name — matches any student
      // targeting ANY real competition that falls under this category,
      // e.g. "All Tech competitions" captures Congressional App
      // Challenge, USACO, CyberPatriot, etc. all at once.
      var namesInCategory=COMPS.filter(function(c){return c.cat===category;}).map(function(c){return c.n;});
      var catIds={};
      if(namesInCategory.length){
        var catCompRes=await sba.from("competitions").select("student_id").in("competition_name",namesInCategory);
        if(catCompRes.error)throw catCompRes.error;
        (catCompRes.data||[]).forEach(function(r){catIds[r.student_id]=true;});
      }
      if(query||competition){
        var narrowedCat={};
        Object.keys(ids).forEach(function(id){if(catIds[id])narrowedCat[id]=true;});
        ids=narrowedCat;
      } else {
        ids=catIds;
      }
    }
    if(subcat){
      // Coding and Robotics are already tagged on real competitions
      // (subcat), but until now nothing in the UI ever let a student
      // filter by them — this makes that existing data reachable.
      var namesInSubcat=COMPS.filter(function(c){return c.subcat===subcat;}).map(function(c){return c.n;});
      var subIds={};
      if(namesInSubcat.length){
        var subCompRes=await sba.from("competitions").select("student_id").in("competition_name",namesInSubcat);
        if(subCompRes.error)throw subCompRes.error;
        (subCompRes.data||[]).forEach(function(r){subIds[r.student_id]=true;});
      }
      if(query||competition||category){
        var narrowedSub={};
        Object.keys(ids).forEach(function(id){if(subIds[id])narrowedSub[id]=true;});
        ids=narrowedSub;
      } else {
        ids=subIds;
      }
    }
    idList=Object.keys(ids);
    if(!idList.length)return [];
  }

  var studentsQuery=sba.from("students_public").select("id,name,school,city,country,grade,track,role,availability,status,idea,proof_of_work,links").eq("onboarded",true).limit(40);
  if(idList!==null)studentsQuery=studentsQuery.in("id",idList);
  if(city)studentsQuery=studentsQuery.ilike("city",city);
  if(school)studentsQuery=studentsQuery.ilike("school",school);
  if(excludeId)studentsQuery=studentsQuery.neq("id",excludeId);

  var studentsRes=await studentsQuery;
  if(studentsRes.error)throw studentsRes.error;
  // Server-side RLS already hides blocked students, but filtering here
  // too keeps the UI consistent immediately after a block, before any
  // refetch happens.
  var students=(studentsRes.data||[]).filter(function(s){return !BLOCKED_IDS[s.id];});
  console.log("[Partnr search] filters:",{query:query,city:city,school:school,competition:competition},"| matched:",students.length);
  if(!students.length)return [];

  var finalIds=students.map(function(s){return s.id;});
  var allSkillsRes=await sba.from("skills").select("student_id,category,skill_name,level").in("student_id",finalIds);
  var skillsByStudent={};
  (allSkillsRes.data||[]).forEach(function(r){(skillsByStudent[r.student_id]=skillsByStudent[r.student_id]||[]).push(r);});

  var allCompsRes=await sba.from("competitions").select("student_id,competition_name").in("student_id",finalIds);
  var compsByStudent={};
  (allCompsRes.data||[]).forEach(function(r){(compsByStudent[r.student_id]=compsByStudent[r.student_id]||[]).push(r.competition_name);});

  var fallbackLabel=query||competition||"Partner";
  return students.map(function(s){
    var mySkills=skillsByStudent[s.id]||[];
    var matched=skillMatch[s.id];
    var keySkill=matched?matched.skill:(mySkills[0]?mySkills[0].skill_name:fallbackLabel);
    var keyLevel=(matched&&matched.level)||(mySkills[0]&&mySkills[0].level)||"Intermediate";
    var otherSkills=mySkills.filter(function(x){return x.skill_name!==keySkill;}).slice(0,3).map(function(x){return x.skill_name;});
    return {
      name:s.name,school:s.school,city:s.city,country:s.country,grade:s.grade,
      avatar:initialsFor(s.name),avatarColor:colorForId(s.id),
      track:s.track,role:s.role,
      availability:s.availability||"Not specified",
      status:s.status||"Open to connecting",
      bio:s.idea||"Hasn't added a bio yet.",
      keySkill:keySkill||fallbackLabel,keyLevel:keyLevel,
      otherSkills:otherSkills,
      competitions:compsByStudent[s.id]||[],
      proofOfWork:s.proof_of_work||[],
      links:s.links||[],
      _realId:s.id
    };
  });
}

// ── App boot ─────────────────────────────────
async function boot(){
  try{
    var session=await getSession();
    if(session){
      await loadBlockedIds();
      var profile=await loadProfileIntoState(session.user.id);
      if(profile&&profile.onboarded){
        goTo("matches");
        return;
      }
      if(profile){
        goTo("track");
        return;
      }
      // Session exists but no students row yet.
      // Case 1: signed in via Google, Microsoft, or GitHub directly
      // from Welcome — none of these give us school/country/city/etc,
      // so route to the full signup form (pre-filled) instead of
      // skipping straight to Track & Role.
      var provider=session.user.app_metadata&&session.user.app_metadata.provider;
      if(provider==="google"||provider==="azure"||provider==="github"){
        var ssoMeta=session.user.user_metadata||{};
        S.name=ssoMeta.full_name||ssoMeta.name||"";
        S.email=session.user.email||"";
        // GitHub is the one provider that also hands us something
        // directly useful: the account's real username, which becomes
        // a ready-made entry in Your Links - actually shown to other
        // students, unlike the old standalone field it replaces.
        if(provider==="github"&&ssoMeta.user_name)S.links=[{url:"https://github.com/"+ssoMeta.user_name}];
        PENDING_GOOGLE_SESSION=session; // name kept for simplicity; covers every SSO provider
        goTo("signup");
        return;
      }
      // Case 2: returning from a magic-link email, possibly in a
      // totally different browser/app than the one they signed up
      // in. First choice: our own metadata attached at signup time
      // (works everywhere, since it's stored server-side, and always
      // includes every field together — school, grade, country, etc).
      var meta=session.user.user_metadata||{};
      if(meta.name){
        S.name=meta.name;S.email=session.user.email;S.school=meta.school||"";
        S.grade=meta.grade||"";S.country=meta.country||"";S.city=meta.city||"";
        S.zip=meta.zip||"";S.languages=meta.languages||[];
        goTo("track");
        return;
      }
      // Fallback: local browser storage, in case metadata wasn't set
      // (e.g. an older signup from before this fix).
      try{
        var pending=localStorage.getItem("partnr_pending_signup");
        if(pending){
          var restored=JSON.parse(pending);
          Object.keys(restored).forEach(function(k){S[k]=restored[k];});
          localStorage.removeItem("partnr_pending_signup");
        }
      }catch(ex){}
      if(S.name&&S.email){
        goTo("track");
        return;
      }
      // Safety net: a session exists, there's no saved profile row,
      // and none of the cases above found enough info to proceed
      // straight to Track & Role. Rather than risk skipping a
      // student past the profile form with missing data, always fall
      // back to the full signup form.
      goTo("signup");
      return;
    }
  }catch(e){
    console.error("Supabase session check failed",e);
  }
  goTo("welcome");
}

// Calculates age in whole years from a YYYY-MM-DD date-of-birth string.
function calculateAge(dobStr){
  var dob=new Date(dobStr+"T00:00:00");
  var now=new Date();
  var age=now.getFullYear()-dob.getFullYear();
  var hasHadBirthdayThisYear=(now.getMonth()>dob.getMonth())||(now.getMonth()===dob.getMonth()&&now.getDate()>=dob.getDate());
  if(!hasHadBirthdayThisYear)age--;
  return age;
}

function getLangsForCountry(country){
  var primary=COUNTRY_LANGS[country]||[];
  if(primary.indexOf("English")<0) primary=primary.concat(["English"]);
  return primary;
}
function getAllSelectedLangs(){
  var a=Array.from(document.querySelectorAll("#lang-primary .chip.on")).map(function(c){return c.textContent;});
  var b=Array.from(document.querySelectorAll("#lang-other .chip.on")).map(function(c){var lbl=c.querySelector("span");return lbl?lbl.textContent:c.textContent;});
  return a.concat(b);
}
function renderLangSections(country,selected){
  selected=selected||[];
  var primary=getLangsForCountry(country);
  var other=LANGS.filter(function(l){return primary.indexOf(l)<0&&l!=="English";});
  var sDiv=document.getElementById("lang-suggested");
  var pDiv=document.getElementById("lang-primary");
  var oDiv=document.getElementById("lang-other");
  var oLabel=document.getElementById("lang-other-label");
  if(!pDiv||!oDiv) return;
  sDiv.style.display=primary.length>=1?"":"none";
  pDiv.innerHTML="";
  primary.forEach(function(lang){
    var c=document.createElement("div");c.className="chip";c.textContent=lang;
    if(selected.indexOf(lang)>=0)c.classList.add("on");
    c.style.borderColor="#AFA9EC";
    c.addEventListener("click",function(){c.classList.toggle("on");});
    pDiv.appendChild(c);
  });
  oLabel.textContent=primary.length>1?"Other languages":"Languages";
  oDiv.innerHTML="";
  other.forEach(function(lang){
    var c=document.createElement("div");c.className="chip";c.textContent=lang;
    if(selected.indexOf(lang)>=0)c.classList.add("on");

  });
}

// get a status shown at all — no field means no claim. Compares month-day
// only (not year), since these deadlines recur annually and we don't track
// which exact year each one was last confirmed for. Once passed, this says
// so plainly rather than showing a stale date as if it were still current —
// matches the honest-by-default approach used everywhere else in Partnr.
var MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Parse a "YYYY-MM-DD" string into a Date at local midnight.
function parseISODate(iso){
  var p=iso.split("-");
  return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));
}
function formatISODate(iso,includeYear){
  var p=iso.split("-");
  var m=MONTH_NAMES[parseInt(p[1],10)-1];
  var d=parseInt(p[2],10);
  return includeYear?m+" "+d+" "+p[0]:m+" "+d;
}
function daysUntilISODate(iso){
  var now=new Date();now.setHours(0,0,0,0);
  var target=parseISODate(iso);
  return Math.round((target-now)/(1000*60*60*24));
}

// Every deadline chip and the Deadlines calendar both read from real,
// independently-verified data in Supabase (competition_deadlines),
// looked up by competition name - never a local estimate or rollover.
// Four possible states, matching exactly what the backend verified:
//  - confirmed: entry is open, deadline_date is a real upcoming date
//  - cycle_active: entry closed, but the competition is still running -
//    show cycle_end_date instead of a deadline
//  - not_yet_announced: nothing confirmed yet; show the honest observed
//    pattern (typical_reopen_period) only if one was actually found
//  - uncertain: show nothing at all
function deadlineChipHtml(compName){
  var d=DEADLINE_DATA[compName];
  if(!d)return "";
  if(d.status==="confirmed"&&d.deadline_date){
    return "<span style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:#FAEEDA;color:#854F0B;\"><i class=\"ti ti-clock\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>Deadline ~"+formatISODate(d.deadline_date)+"</span>";
  }
  if(d.status==="cycle_active"&&d.cycle_end_date){
    return "<span style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:#EAF3DE;color:#3B6D11;\"><i class=\"ti ti-refresh\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>Running through "+formatISODate(d.cycle_end_date,true)+"</span>";
  }
  if(d.status==="not_yet_announced"&&d.typical_reopen_period){
    return "<span style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:#F1EFE8;color:#6b6b6b;\"><i class=\"ti ti-calendar\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>"+esc(d.typical_reopen_period)+"</span>";
  }
  return "";
}

// Shared list order everywhere competitions are browsed: most
// nationally/internationally recognized first (tier), then within a tier
// the ones with a real confirmed deadline surface before the ones we
// haven't verified an upcoming date for (soonest first), then alphabetical
// as the final, honest tiebreak.
function compareComps(a,b){
  if(a.tier!==b.tier)return a.tier-b.tier;
  var da=DEADLINE_DATA[a.n],db=DEADLINE_DATA[b.n];
  var aHas=(da&&da.status==="confirmed"&&da.deadline_date)?1:0;
  var bHas=(db&&db.status==="confirmed"&&db.deadline_date)?1:0;
  if(aHas!==bHas)return bHas-aHas;
  if(aHas&&bHas){
    var diff=daysUntilISODate(da.deadline_date)-daysUntilISODate(db.deadline_date);
    if(diff!==0)return diff;
  }
  return a.n.localeCompare(b.n);
}

function showErr(id,msg){
  var el=document.getElementById(id);if(!el)return;
  el.classList.add("err");
  var existing=el.parentNode.querySelector(".field-err");if(existing)existing.remove();
  var err=document.createElement("div");err.className="field-err";
  var errId=id+"-err";err.id=errId;
  err.setAttribute("role","alert");
  err.innerHTML='<i class="ti ti-alert-circle"></i>'+msg;
  el.parentNode.appendChild(err);
  el.setAttribute("aria-invalid","true");
  el.setAttribute("aria-describedby",errId);
  el.addEventListener("input",function(){clearErr(id);},{once:true});
  el.addEventListener("change",function(){clearErr(id);},{once:true});
}
function clearErr(id){
  var el=document.getElementById(id);if(!el)return;
  el.classList.remove("err");
  el.removeAttribute("aria-invalid");
  el.removeAttribute("aria-describedby");
  var existing=el.parentNode.querySelector(".field-err");if(existing)existing.remove();
}
function showSecErr(id,msg){
  var existing=document.getElementById("sec-err-"+id);if(existing)existing.remove();
  var div=document.createElement("div");div.className="sec-err";div.id="sec-err-"+id;
  div.setAttribute("role","alert");
  div.innerHTML='<i class="ti ti-alert-circle" style="font-size:14px;flex-shrink:0;"></i>'+msg;
  var target=document.getElementById(id);if(target)target.parentNode.insertBefore(div,target);
}
function scrollToFirstErr(){
  var first=document.querySelector(".err,.sec-err");
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});
}
function addKbdActivation(el){
  el.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "||e.key==="Spacebar"){e.preventDefault();el.click();}
  });
}
function mkChips(id,items,sel,single){
  var div=document.getElementById(id);if(!div)return;
  div.innerHTML="";
  items.forEach(function(item){
    var c=document.createElement("div");c.className="chip";c.textContent=item;
    c.setAttribute("role","button");c.setAttribute("tabindex","0");
    var isOn=Array.isArray(sel)?sel.indexOf(item)>=0:sel===item;
    if(isOn)c.classList.add("on");
    c.setAttribute("aria-pressed",isOn?"true":"false");
    c.addEventListener("click",function(){
      if(single)div.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");x.setAttribute("aria-pressed","false");});
      c.classList.toggle("on");
      c.setAttribute("aria-pressed",c.classList.contains("on")?"true":"false");
    });
    addKbdActivation(c);
    div.appendChild(c);
  });
}
function getChips(id){
  return Array.from(document.querySelectorAll("#"+id+" .chip.on")).map(function(c){return c.textContent;});
}
function countryOpts(){
  var rest=COUNTRIES.filter(function(c){return c&&c!=="United States"&&c!=="Other";});

}

}

// this is public, non-personal data (just the static competition list),

// carries the competition they were looking at straight into signup.
function rCompPreview(catIds,label,subcat){
  var list=COMPS.filter(function(c){
    if(catIds.indexOf(c.cat)<0)return false;
    if(subcat==="none")return !c.subcat;
    if(subcat)return c.subcat===subcat;
    return true;
  });

    "</div>"+
    "<div class=\"fi\"><label for=\"igrade\">Grade / Year"+req()+"</label><select id=\"igrade\">"+gradeOpts()+"</select></div>"+
    "<div class=\"fi\"><label for=\"idob\">Date of birth"+req()+"</label><input id=\"idob\" type=\"date\" value=\""+esc(S.dob)+"\"/></div>"+

      "<button id=\"langaddbtn\" style=\"padding:8px 14px;background:#EEEDFE;color:#534AB7;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;\">Add</button>"+

    var zipEl=document.getElementById("izip");
    if(zipEl&&!hasZip(this.value))zipEl.value="";
    renderLangSections(this.value,getAllSelectedLangs());
  });
  var zipInputEl=document.getElementById("izip");
  if(zipInputEl){
    zipInputEl.addEventListener("blur",function(){
      autofillCityFromZip(document.getElementById("icountry").value,this.value,document.getElementById("icity"));
    });
  }
  document.getElementById("langaddbtn").addEventListener("click",function(){
    var inp=document.getElementById("langother");
    var val=inp.value.trim();if(!val)return;
    val=val.charAt(0).toUpperCase()+val.slice(1);
    var all=document.querySelectorAll("#lang-primary .chip, #lang-other .chip");
    var ex=Array.from(all).find(function(c){var lbl=c.querySelector("span");var t=lbl?lbl.textContent:c.textContent;return t.toLowerCase()===val.toLowerCase();});
    if(ex){ex.classList.add("on");inp.value="";return;}
    var chip=document.createElement("div");chip.className="chip on";
    chip.style.background="#EEEDFE";chip.style.borderColor="#AFA9EC";chip.style.color="#3C3489";chip.style.fontWeight="500";
    chip.style.display="inline-flex";chip.style.alignItems="center";chip.style.gap="6px";
    var chipLabel=document.createElement("span");chipLabel.textContent=val;
    chipLabel.addEventListener("click",function(){chip.classList.toggle("on");});
    var chipDel=document.createElement("span");chipDel.textContent="×";chipDel.setAttribute("aria-label","Remove "+val);
    chipDel.style.cursor="pointer";chipDel.style.fontWeight="700";chipDel.style.opacity="0.6";
    chipDel.addEventListener("click",function(e){e.stopPropagation();chip.remove();});
    chip.appendChild(chipLabel);chip.appendChild(chipDel);
    var oDiv=document.getElementById("lang-other");if(oDiv)oDiv.appendChild(chip);

  var suggestBox=document.getElementById("schoolSuggest");

    var q=schoolInput.value.trim().toLowerCase();
    if(q.length<3){suggestBox.style.display="none";return;}
    var list=await loadSchoolList();
    var matches=list.filter(function(s){return s.name.toLowerCase().indexOf(q)>=0;}).slice(0,8);
    if(!matches.length){suggestBox.style.display="none";return;}
    suggestBox.setAttribute("role","listbox");
    suggestBox.innerHTML=matches.map(function(s){
      return "<div class=\"school-suggest-item\" role=\"option\" tabindex=\"0\" data-name=\""+esc(s.name)+"\" data-city=\""+esc(s.city)+"\" style=\"padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;\">"+
        "<div style=\"font-weight:600;color:#1a1a1a;\">"+esc(s.name)+"</div>"+
        "<div style=\"font-size:11px;color:#6b6b6b;\">"+esc(s.city)+", CA · "+(s.type==="private"?"Private":"Public")+"</div>"+
      "</div>";
    }).join("");
    suggestBox.style.display="block";
    suggestBox.querySelectorAll(".school-suggest-item").forEach(function(item){
      item.addEventListener("mouseenter",function(){item.style.background="#f8f8f6";});
      item.addEventListener("mouseleave",function(){item.style.background="";});
      addKbdActivation(item);
      item.addEventListener("click",function(){
        schoolInput.value=item.dataset.name;
        var cityInput=document.getElementById("icity");
        if(cityInput)cityInput.value=item.dataset.city;
        var countrySelect=document.getElementById("icountry");
        if(countrySelect){
          countrySelect.value="United States";
          countrySelect.dispatchEvent(new Event("change"));
        }
        suggestBox.style.display="none";
        clearErr("ischool");clearErr("icity");
      });
    });
  });
  document.addEventListener("click",function(e){
    if(e.target!==schoolInput&&!suggestBox.contains(e.target)){
      suggestBox.style.display="none";
    }
  });

  // City autocomplete — suggestions only, never a hard requirement.
  // Filtered to the currently selected country so "Los Angeles" can't
  // show up as a suggestion while Uganda is selected. If a student's
  // real town isn't in the list (a global dataset this size can't cover
  // every small town), they can still just type it — nothing blocks that.
  loadWorldCities();
  var cityInput=document.getElementById("icity");
  var citySuggestBox=document.getElementById("citySuggest");
  cityInput.addEventListener("input",async function(){
    var q=cityInput.value.trim().toLowerCase();
    var country=document.getElementById("icountry").value;
    if(q.length<2||!country){citySuggestBox.style.display="none";return;}
    var list=await loadWorldCities();
    var matches=list.filter(function(c){return c.c===country&&c.n.toLowerCase().indexOf(q)===0;}).slice(0,8);
    if(!matches.length){citySuggestBox.style.display="none";return;}
    citySuggestBox.setAttribute("role","listbox");
    citySuggestBox.innerHTML=matches.map(function(c){
      return "<div class=\"city-suggest-item\" role=\"option\" tabindex=\"0\" data-name=\""+esc(c.n)+"\" style=\"padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;\">"+esc(c.n)+"</div>";
    }).join("");
    citySuggestBox.style.display="block";
    citySuggestBox.querySelectorAll(".city-suggest-item").forEach(function(item){
      item.addEventListener("mouseenter",function(){item.style.background="#f8f8f6";});
      item.addEventListener("mouseleave",function(){item.style.background="";});
      addKbdActivation(item);
      item.addEventListener("click",function(){
        cityInput.value=item.dataset.name;
        citySuggestBox.style.display="none";
        clearErr("icity");
      });
    });
  });
  document.addEventListener("click",function(e){
    if(e.target!==cityInput&&!citySuggestBox.contains(e.target)){
      citySuggestBox.style.display="none";
    }
  });
}

// Renders/refreshes the small Interest chips inside the panel from
// current S.track/S.secondary - called on page load and again any time
// a stronger signal (a picked competition, or an AI-read of typed
// interest text) updates the interest programmatically, so the chips
// never silently disagree with what's actually stored.
function renderInterestChips(){
  var el=document.getElementById("interest-chips");if(!el)return;
  var keys=["research","business","impact","tech","law","arts"];
  el.innerHTML="";
  keys.forEach(function(k){
    var on=S.track===k||(Array.isArray(S.secondary)&&S.secondary.indexOf(TR[k].n)>=0);
    var c=document.createElement("div");c.className="chip"+(on?" on":"");c.textContent=TR[k].n;c.dataset.key=k;
    c.setAttribute("role","button");c.setAttribute("tabindex","0");c.setAttribute("aria-pressed",on?"true":"false");
    if(on){c.style.background=TR[k].bg;c.style.borderColor=TR[k].c;c.style.color=TR[k].tc;c.style.fontWeight="600";}
    c.addEventListener("click",function(){
      var currentlyOn=S.track===k||(Array.isArray(S.secondary)&&S.secondary.indexOf(TR[k].n)>=0);
      if(currentlyOn){
        // Turning off: demote secondary to primary if needed, or just clear.
        if(S.track===k){S.track=(Array.isArray(S.secondary)&&S.secondary[0])?Object.keys(TR).find(function(kk){return TR[kk].n===S.secondary[0];})||"":"";S.secondary=(S.secondary||[]).slice(1);}
        else{S.secondary=(S.secondary||[]).filter(function(n){return n!==TR[k].n;});}
      } else {
        var onCount=(S.track?1:0)+((S.secondary||[]).length);
        if(onCount>=2)return; // cap at 2 total, same as before
        if(!S.track)S.track=k;else S.secondary=(S.secondary||[]).concat([TR[k].n]).slice(0,2);
      }
      renderInterestChips();
    });
    addKbdActivation(c);
    el.appendChild(c);
  });
}

// Math: horizontal chips, tap-cycle (Currently taking → Completed →
// removed). Selecting immediately counts - the question here is "what
// have you taken", already answered by naming the course.
// Interest categories, "everything else", and Math all render the same
// way: a collapsed accordion header naming the category and its real
// count, expanding to plain horizontal chips. Only one chip's rating
// is ever open at a time. Clicking a chip opens it (closing whatever
// else was open); picking a tag sets it without closing, so you can
// change your mind before moving on; clicking a different chip is what
// actually closes the previous one - and it collapses back to a
// compact label that still shows what you picked ("Python ·
// Intermediate", "Algebra 2 · Currently taking"), so nothing is lost
// from view, it just stops needing its own visible row once you've
// moved on. Math uses its own two-tag set (Completed / Currently
// taking) instead of the three proficiency tiers - checked by category
// type here so a math course is never accidentally rendered with the
// wrong tag set, wherever it's rendered from.
var openSkillKey=null;
var pendingHours="",pendingWhen="";
function chipHTML(catId,item){
  var cat=SKILL_CATS.find(function(c){return c.id===catId;});
  var isMath=cat&&cat.type==="course";
  var tagSet=isMath?MATH_TAGS:LEVELS;
  var key=catId+":"+item;
  var on=S.skillLevels[key]!==undefined;
  var lv=S.skillLevels[key];
  var isOpen=openSkillKey===key;
  if(NO_LEVEL_ITEMS.has(item)){
    var notedOn=lv==="noted";
    return "<button class=\"chip skill-chip no-level-chip"+(notedOn?" on":"")+"\" data-key=\""+key+"\" data-item=\""+esc(item)+"\">"+esc(item)+"</button>";
  }
  if(isOpen){
    return "<div style=\"background:white;border:1px solid #AFA9EC;border-radius:8px;padding:8px 10px;\">"+
      "<div style=\"font-size:13px;font-weight:500;color:#3C3489;margin-bottom:6px;\">"+esc(item)+"</div>"+
      "<div style=\"display:flex;gap:4px;flex-wrap:wrap;\">"+
        tagSet.map(function(l){return "<button class=\"rate-btn\" data-key=\""+key+"\" data-lv=\""+l+"\" style=\"font-size:11px;padding:4px 8px;border:1px solid "+(lv===l?"#7F77DD":"#ddd")+";border-radius:6px;background:"+(lv===l?"#EEEDFE":"white")+";color:"+(lv===l?"#3C3489":"#444")+";cursor:pointer;font-family:inherit;\">"+l+"</button>";}).join("")+
      "</div>"+
      (lv&&!isMath?"<div style=\"font-size:11px;color:#6b6b6b;margin-top:5px;\">"+LEVEL_DEFS[lv]+"</div>":"")+
    "</div>";
  }
  var label=on&&lv?item+" · "+lv:item;
  if(on&&!lv){
    return "<span class=\"chip skill-chip\" data-key=\""+key+"\" data-item=\""+esc(item)+"\" style=\"border-color:#E24B4A;background:#FCEBEB;color:#A32D2D;display:inline-flex;align-items:center;gap:6px;\">"+esc(label)+"<span class=\"skill-chip-remove\" data-key=\""+key+"\" role=\"button\" aria-label=\"Remove "+esc(item)+"\" style=\"font-weight:700;opacity:0.75;cursor:pointer;\">×</span></span>";
  }
  return "<button class=\"chip skill-chip"+(on?" on":"")+"\" data-key=\""+key+"\" data-item=\""+esc(item)+"\">"+esc(label)+"</button>";

function wireChipContainer(container){
  container.querySelectorAll(".skill-chip-remove").forEach(function(x){
    x.addEventListener("click",function(e){
      e.stopPropagation();
      delete S.skillLevels[this.dataset.key];
      if(openSkillKey===this.dataset.key)openSkillKey=null;
      rSkills();
    });
  });
  container.querySelectorAll(".skill-chip").forEach(function(btn){
    btn.addEventListener("click",function(){
      var key=this.dataset.key;
      if(this.classList.contains("no-level-chip")){
        if(S.skillLevels[key]==="noted")delete S.skillLevels[key];
        else S.skillLevels[key]="noted";
        rSkills();
        return;
      }
      if(openSkillKey===key){
        if(!S.skillLevels[key])delete S.skillLevels[key];
        openSkillKey=null;
      } else {
        openSkillKey=key;
        if(S.skillLevels[key]===undefined)S.skillLevels[key]=null;
      }
      rSkills();
    });
  });
  container.querySelectorAll(".rate-btn").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      S.skillLevels[this.dataset.key]=this.dataset.lv;
      rSkills();
    });
  });

// Maps a competition's finer CM2 category to one of the 5 Interest
// tracks. Law has no direct home among the 5 (it doesn't map cleanly
// onto any of them) so it's left unset there deliberately, rather than
// forced into a track it doesn't fit.
var CAT_TO_TRACK={science:"research",math:"research",business:"business",impact:"impact",arts:"arts",writing:"arts",tech:"tech"};
function addComp(c){
  if(selComps.some(function(s){return s.n===c.n;}))return;
  selComps.push(c);
  // A picked, real competition is the strongest interest signal there
  // is - always sets Primary Interest, overriding a prior chip tap or
  // AI read, since nothing is more concrete than a competition someone
  // already knows they're targeting.
  var mappedTrack=CAT_TO_TRACK[c.cat];
  if(mappedTrack){
    S.track=mappedTrack;
    renderInterestChips();
  }
  renderPills();if(exploreOpen)renderCat();
}
function removeComp(name){selComps=selComps.filter(function(c){return c.n!==name;});renderPills();if(exploreOpen)renderCat();}
function renderPills(){

    msg.textContent="Not sure where to start? Browse by category, or let us help.";

// ── AI competition suggestions from free-text interest ──────
// Asks the AI to pick from Partnr's own real competition list based on
// a student's stated interest — never to invent a new competition or
// state a fact (deadline, prize) not already in the list. Even so,
// every returned name is checked against the real COMPS array before
// rendering, so a model slip can never surface a fabricated result.
// If the student already wrote something in the main idea box, that
// same text IS their stated interest - asking them to type it again in
// a popup was pure redundancy, and worse, whatever they typed here
// never made it back into the main box, so the two could silently
// disagree. Now: already-typed text skips straight to suggestions, and
// whichever text is actually used always gets written back to S.idea,
// so returning to Goals always shows the interest that was really used.

// Reads whatever's in the inline interests panel (chips and/or typed
// text) and gets real competition suggestions - no separate screen, no
// popup, results render right inside the same panel the student is
// already looking at.
async function runInlineSuggestions(){
  var text=document.getElementById("interest-text").value.trim();
  var chipKeys=Array.from(document.querySelectorAll("#interest-chips .chip.on")).map(function(c){return c.dataset.key;});
  var resultsEl=document.getElementById("interest-results");
  if(!text&&!chipKeys.length){
    resultsEl.innerHTML="<div class=\"sec-err\" style=\"margin-top:0;\"><i class=\"ti ti-alert-circle\" style=\"font-size:14px;flex-shrink:0;\"></i>Pick a chip or describe your interest first.</div>";
    return;
  }
  var btn=document.getElementById("interest-go");
  btn.disabled=true;btn.textContent="Thinking…";
  resultsEl.innerHTML="<div style=\"text-align:center;padding:1rem;\"><div class=\"spin\" style=\"margin:0 auto;\"></div></div>";
  try{
    if(text){
      // Typed text goes to the AI, which also reads a category out of
      // it - that read is more informed than a plain chip tap (it's
      // seen the actual description), so it's allowed to override
      // whatever chips happen to be selected right now.
      var result=await fetchCompetitionSuggestions(text,chipKeys.map(function(k){return TR[k].n;}));
      if(result.primaryCategory&&TR[result.primaryCategory]){
        S.track=result.primaryCategory;
        renderInterestChips();
      }
      renderInlineSuggestionResults(result.suggestions,text);
    } else {
      // Chips only, no text - no need for an AI call at all, just
      // filter the real competition list by the selected categories
      // directly. Cheaper and more literal than asking the AI to
      // interpret something the student never actually described.
      var picks=COMPS.filter(function(c){return chipKeys.indexOf(c.cat)>=0;})
        .sort(compareComps).slice(0,6)
        .map(function(c){return {comp:c,why:c.why};});
      renderInlineSuggestionResults(picks,chipKeys.map(function(k){return TR[k].n;}).join(", "));
    }
  }catch(ex){
    console.error("[Partnr] competition suggestion failed:",ex);
    var notSignedIn=ex&&ex.code==="not_signed_in";
    resultsEl.innerHTML="<div class=\"sec-err\" style=\"margin-top:0;\">"+(notSignedIn?"You've been signed out — please sign in again.":"Something went wrong — please try again.")+"</div>";
  }
  btn.disabled=false;btn.textContent="Suggest competitions →";
}

// Calls the edge function in 'suggest_competitions' mode with the full
// real competition list (name, category, team requirement, eligibility,
// cross type, description) so the model can only choose among real,
// accurate entries — never invent a new one or a fact not given here.
// Also asks it to read a single best-fit category out of the same
// text, so a typed description can set Primary Interest directly
// instead of relying on whichever chip happened to be tapped.
async function fetchCompetitionSuggestions(interestText,alsoInterestedIn){
  var session=await getSession();
  if(!session){
    // getSession() reads from local storage and doesn't always force a
    // refresh - a session that looks stale here often isn't actually
    // gone, just not re-validated yet. One explicit refresh attempt
    // before treating this as a real sign-out avoids failing a request
    // for a student who is, in fact, still signed in.
    try{
      var refreshed=await sba.auth.refreshSession();
      session=refreshed&&refreshed.data?refreshed.data.session:null;
    }catch(ex){/* fall through to the not-signed-in error below */}
  }
  if(!session){var e=new Error("You're not signed in anymore");e.code="not_signed_in";throw e;}
  var compList=COMPS.map(function(c){
    var catName=(CM2[c.cat]&&CM2[c.cat].n)||c.cat;
    var typeLabel=c.cross===true?"cross-school ok":c.cross==="prep"?"prep partner":"same school";
    return c.n+" | "+catName+" | "+c.team+" | "+c.eli+" | "+typeLabel+" | "+c.desc;
  }).join("\n");
  var auxLine=(alsoInterestedIn&&alsoInterestedIn.length)?("\nThey also separately marked interest in: "+alsoInterestedIn.join(", ")+" - weigh this alongside their own words, but their own words are the stronger signal if they conflict."):"";
  var prompt="A high school student described their interest as: \""+interestText+"\""+auxLine+"\n\n"+
    "Here is the COMPLETE real list of competitions available on Partnr (name | category | team size | eligibility | type | description):\n"+compList+"\n\n"+
    "Pick the 3 to 5 BEST-FITTING competitions from this exact list for this student's stated interest. "+
    "You MUST only use competition names EXACTLY as they appear above — never invent a new competition, and never state a deadline or prize amount, since none are given here. "+
    "For each pick, write one specific sentence on why it fits what they said. "+
    "Also read their description and pick the single best-fitting category from this list: research, business, impact, tech, law, arts.\n\n"+
    "Return ONLY valid JSON: {\"primaryCategory\":\"one of research|business|impact|tech|law|arts\",\"suggestions\":[{\"name\":\"exact name from the list\",\"why\":\"one sentence\"}]}";
  var res=await fetch(SUPABASE_URL+"/functions/v1/match-students",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+session.access_token
    },
    body:JSON.stringify({prompt:prompt,mode:"suggest_competitions",max_tokens:800})
  });
  if(!res.ok)throw new Error("status "+res.status);
  var d=await res.json();
  if(d.error)throw new Error("api error");
  var txt=d.content.map(function(b){return b.text||"";}).join("").replace(/```json|```/g,"").trim();
  var parsed=JSON.parse(txt);
  var raw=parsed.suggestions||[];
  // Defensive: only keep suggestions whose name exactly matches a real
  // competition. Anything else is dropped silently — a model slip
  // should never surface a fabricated competition to a student. Same
  // defensiveness for primaryCategory - only ever accept one of the
  // real track keys, never whatever raw string the model returned.
  var kept=[];
  raw.forEach(function(s){
    var real=COMPS.find(function(c){return c.n===s.name;});
    if(real)kept.push({comp:real,why:s.why||real.why});
  });
  var validCats=["research","business","impact","tech","law","arts"];
  var primaryCategory=validCats.indexOf(parsed.primaryCategory)>=0?parsed.primaryCategory:null;
  return {suggestions:kept,primaryCategory:primaryCategory};
}

  REMATCH_FEEDBACK=""; // one-time use — consumed here so it never leaks into a later, unrelated call
  var hasPrepComp=selComps.some(function(c){return c.cross==="prep";});
  var prompt="You are Partnr AI matching engine for global high school students.\n\nStudent: "+S.name+", "+S.school+", "+S.city+", "+S.country+", "+S.grade+"\nLanguages: "+(S.languages.join(", ")||"English")+"\nPrimary Track: "+t.n+", Role: "+r.n+", Status: "+S.status+"\nSecondary Interests: "+secStr+"\nStage: "+(S.stage||"open")+"\nSkills: "+skStr()+"\nSkills needed in a partner: "+neededStr+feedbackLine+"\nProof of work: "+powStr+"\nAvailability: "+S.availability+", Commitment: "+S.commit+"\nTarget Competitions: "+compInfo+"\nIdea / Looking for: "+(S.idea||"open")+"\nLocation preference: "+(S.location||"open")+"\n\nIMPORTANT MATCHING RULES:\n- Default mode is COMPLEMENTARY: match roles and skills that fill the gap (CEO gets CTO, researcher gets engineer). \"Skills needed in a partner\" above is the strongest signal for this — prioritize matches who actually have those skills over generic role-matching alone.\n"+(hasPrepComp?"- This student has at least one PREP-PARTNER competition (individual entry, no team). For matches aimed at that competition specifically, flip the logic: prioritize someone with SIMILAR skills and a SIMILAR level, not a complementary role — they need a peer to study or sharpen work with, not a co-founder.\n":"")+"- Match skill LEVELS carefully\n- FIRST match should be local (same city, state, or US) when student is in the US — feels most real and actionable\n- SECOND match can be another US student or nearby country\n- THIRD match should be from a different continent for global diversity\n- For cross-school competitions: match globally\n- For same-school competitions: prioritize same city/region\n- For prep-partner competitions: match globally by similar skill and level, not complementary role\n- Weight target competitions heavily — students targeting same competitions are strong matches\n- Use their idea description and secondary interests to refine beyond the primary track\n\nGenerate 3 student matches. Each: name,school,city,country,grade,avatar(2 initials),avatarColor(purple/teal/coral/blue/green),track,role(vision/tech_r/mktg/ops/res_r/creative),skillsWithLevels(object),competitions(array 2-3),matchScore(85-98),why(2 specific sentences on role+skill complementarity),projectIdea,commitment,availability,timezone,isNearby(bool),languages(array),status,stage,bio(2 sentences),experience(array 3:{title,desc}),awards(array 0-2),portfolio(URL or null),lookingFor(2 sentences)\n\nGenerate 3 fictional projects that could genuinely use this student's skills. Each: title,description,neededRole,skills(2-3),competition,spots(1-2),authorName,authorSchool,authorCountry,track,posted,matchReason,stage\n\nGenerate 5 competitions for track "+t.n+". Each: name,track,description,deadline,daysUntil(integer 30-300),prize,teamSize,isRecommended(bool),eligibility\n\nReturn ONLY valid JSON: {\"matches\":[...],\"projects\":[...],\"competitions\":[...]}";
  try{
    // Real matching now goes through a Supabase edge function that holds
    // the actual Anthropic key server-side — the previous direct
    // fetch("https://api.anthropic.com/...") call with no key attached
    // only ever works inside Claude's own Artifacts preview, never on a
    // real deployed site, so this call was almost certainly always
    // failing and silently landing on fallback() below.
    var session=await getSession();
    if(!session)throw new Error("no session");
    var res=await fetch(SUPABASE_URL+"/functions/v1/match-students",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+session.access_token
      },
      body:JSON.stringify({prompt:prompt})
    });
    if(res.status===429){
      // Daily limit reached — this is not a failure, so it gets its own
      // clear message rather than silently showing demo profiles, which
      // would look identical to "the AI call broke" from the student's
      // side and just be confusing.
      var limitInfo={};
      try{limitInfo=await res.json();}catch(ex){}
      var limitN=limitInfo.limit||3;
      if(MATCHES.length){
        showToast("You've used today's "+limitN+" match rounds — new ones available tomorrow.");
        goTo("matches");
      } else {
        // No existing matches to fall back to (first-ever call somehow
        // hit the limit) — show demo profiles rather than a dead end.
        fallback();
      }
      return;
    }
    if(!res.ok)throw new Error("status "+res.status);
    var d=await res.json();
    if(d.error)throw new Error("api error");
    var txt=d.content.map(function(b){return b.text||"";}).join("").replace(/```json|```/g,"").trim();
    var parsed=JSON.parse(txt);
    MATCHES=parsed.matches||[];PROJECTS=parsed.projects||[];COMPS_DATA=parsed.competitions||[];
    goTo("matches");
  } catch(e){console.error("[Partnr] AI matching failed, showing demo data:",e);fallback();}
}

// Counts real pending requests addressed to this student, so the
// Connections tab shows a badge without opening the tab.
async function updateConnBadge(){
  try{
    var session=await getSession();
    if(!session)return;
    var myId=session.user.id;
    var pendingRes=await sba.from("connections").select("id",{count:"exact",head:true})
      .eq("student_b_id",myId).eq("status","pending");
    var pendingCount=pendingRes.count||0;

    // Unified badge: pending requests + unread messages across every
    // accepted connection, added together into one number — matches
    // how a real inbox works, rather than tracking these separately.
    var connsRes=await sba.from("connections").select("id")
      .eq("status","accepted").or("student_a_id.eq."+myId+",student_b_id.eq."+myId);
    var connIds=(connsRes.data||[]).map(function(c){return c.id;});
    var unreadCount=0;
    if(connIds.length){
      var unreadRes=await sba.from("messages").select("id",{count:"exact",head:true})
        .in("connection_id",connIds).is("read_at",null).neq("sender_id",myId);
      unreadCount=unreadRes.count||0;
    }

    var n=pendingCount+unreadCount;
    var el=document.getElementById("conn-badge");
    if(!el)return;
    el.innerHTML=n?" <span style=\"background:#C53030;color:white;border-radius:20px;padding:1px 7px;font-size:10px;margin-left:2px;font-weight:700;\">"+n+"</span>":"";
  }catch(ex){/* badge is cosmetic — never block the UI on it */}
}

function submitWaitlist(){
  var email=document.getElementById("wl-email").value.trim();
  var city=document.getElementById("wl-city").value.trim();
  var emailErr=document.getElementById("wl-email-err");
  var formErr=document.getElementById("wl-err");
  var btn=document.getElementById("wl-submit");
  emailErr.style.display="none";
  formErr.style.display="none";
  if(!email||!email.includes("@")){emailErr.style.display="block";return;}
  btn.textContent="Joining...";btn.disabled=true;
  var xhr=new XMLHttpRequest();
  xhr.open("POST","https://formspree.io/f/mkolwgkd",true);
  xhr.setRequestHeader("Accept","application/json");
  xhr.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
  xhr.onload=function(){
    if(xhr.status===200||xhr.status===302){
      document.getElementById("wl-form-wrap").style.display="none";
      document.getElementById("wl-success").style.display="block";
    } else {
      btn.textContent="Join the waitlist →";btn.disabled=false;
      formErr.style.display="block";
    }
  };
  xhr.onerror=function(){
    btn.textContent="Join the waitlist →";btn.disabled=false;
    formErr.style.display="block";
  };
  xhr.send("email="+encodeURIComponent(email)+"&city="+encodeURIComponent(city)+"&_subject="+encodeURIComponent("New Partnr Waitlist Signup!"));
}

// ── Recruiting Me: real project postings ─────────────
// Replaces the old 100% AI-fictional PROJECTS array. Anyone can browse
// open postings (mirrors how Skill Search already works — discoverable,
// not scoped to a pair); applying sends a real application a project
// owner can accept or decline, same shape as the connections flow.
async function loadRealProjects(){
  var session=await getSession();
  var myId=session&&session.user?session.user.id:null;
  var res=await sba.from("projects").select("*").eq("status","open").order("created_at",{ascending:false}).limit(30);
  if(res.error)throw res.error;
  var projects=(res.data||[]).filter(function(p){return p.student_id!==myId;});
  if(!projects.length)return [];
  var authorIds=projects.map(function(p){return p.student_id;});
  var authorsRes=await sba.from("students_public").select("id,name,school,city,country,role,track").in("id",authorIds);
  var authorsById={};
  (authorsRes.data||[]).forEach(function(a){authorsById[a.id]=a;});
  return projects.map(function(p){return {project:p,author:authorsById[p.student_id]};});
}

// Ensures a real, accepted connection exists between the project owner
// (the one accepting, currently authenticated) and the applicant, so
// chat and workspace unlock exactly the way they do from the normal
// matching flow. Reuses any existing connection between the two rather
// than creating a duplicate. The insert must put the current user as
// student_a_id — confirmed against the real RLS policy rather than
// assumed, since connections_insert_own requires auth.uid() = student_a_id.
async function ensureAcceptedConnection(otherId,projectTitle){
  var session=await getSession();
  if(!session)return;
  var myId=session.user.id;
  try{
    var existing=await sba.from("connections").select("id,status")
      .or("and(student_a_id.eq."+myId+",student_b_id.eq."+otherId+"),and(student_a_id.eq."+otherId+",student_b_id.eq."+myId+")")
      .maybeSingle();
    if(existing.data){
      if(existing.data.status!=="accepted"){
        await sba.from("connections").update({status:"accepted"}).eq("id",existing.data.id);
      }
    } else {
      var insertRes=await sba.from("connections").insert({
        student_a_id:myId,student_b_id:otherId,
        message:"Accepted for \""+projectTitle+"\"",
        status:"accepted"
      });
      if(insertRes.error)console.error("[Partnr] connection insert failed:",insertRes.error);
    }
  }catch(ex){
    console.error("[Partnr] ensureAcceptedConnection failed:",ex);
  }
}

            "<i class=\"ti "+cat.icon+"\" style=\"font-size:16px;color:"+cc.color+";\"></i>"+

  // Location is a single choice, not independent toggles - Anyone,

  if(globalChip&&!(cityChip&&cityChip.classList.contains("on"))&&!(schoolChip&&schoolChip.classList.contains("on"))){

  var savedChip=document.getElementById("filter-saved");

        console.error("[Partnr] loading saved profiles failed:",ex);
        el.innerHTML="<div style=\"text-align:center;padding:2rem;color:#6b6b6b;\">Couldn't load saved profiles — please try again.</div>";
      }
    });
    addKbdActivation(savedChip);
  }

  // Gathers the current query + all active filters and runs a search.
  // Filters alone (no typed text) are enough to trigger a real search —
  // that's the whole point of being able to just browse by competition,
  // city, or school without needing to guess a keyword.
  function runSkillSearch(){
    var q=document.getElementById("ss").value.trim();
    var compRaw=document.getElementById("filter-comp").value;
    var comp=(compRaw.indexOf("cat:")===0||compRaw.indexOf("subcat:")===0)?"":compRaw;
    var category=compRaw.indexOf("cat:")===0?compRaw.slice(4):"";
    var subcat=compRaw.indexOf("subcat:")===0?compRaw.slice(7):"";
    var city=cityChip&&cityChip.classList.contains("on")?S.city:"";
    var school=schoolChip&&schoolChip.classList.contains("on")?S.school:"";
    if(!q&&!comp&&!category&&!subcat&&!city&&!school){
      // Browse-by-category is now a manual toggle the student
      // controls directly - clearing filters doesn't force it open or
      // closed either, it stays exactly as they left it.
      document.getElementById("skill-drill").style.display="none";
      document.getElementById("sr").innerHTML="";
      LAST_SKILL_SEARCH=null;
      return;
    }
    // Browse-by-category is a tool for picking a skill to search by - it
    // has nothing to do with the competition, city, or school filters, and
    // it's now a manual toggle the student controls, so a search running
    // never forces it open or closed on its own.
    document.getElementById("skill-drill").style.display="none";
    LAST_SKILL_SEARCH={qRaw:q,compRawValue:compRaw,cityOn:!!(cityChip&&cityChip.classList.contains("on")),schoolOn:!!(schoolChip&&schoolChip.classList.contains("on"))};
    srchSkill({query:q,competition:comp,category:category,subcat:subcat,city:city,school:school});
  }

  document.getElementById("ssb").addEventListener("click",runSkillSearch);
  document.getElementById("ss").addEventListener("keydown",function(e){
    if(e.key==="Enter")runSkillSearch();
  });
  // Also react live as text is typed/cleared — not just on Enter or the
  // Search button — so deleting the text alone restores the browse view.
  document.getElementById("ss").addEventListener("input",function(){
    if(!this.value.trim())runSkillSearch();
  });
  document.getElementById("filter-comp").addEventListener("change",runSkillSearch);

  // Skill-name autocomplete — same pattern as the school/city
  // autocomplete elsewhere: suggests as you type, never forces a
  // selection, free text still works if what you want isn't listed.
  var allSkillNames=[];
  SKILL_CATS.forEach(function(cat){cat.items.forEach(function(item){allSkillNames.push(item);});});
  var ssInput=document.getElementById("ss");
  var skillSuggestBox=document.getElementById("skill-suggest");
  if(ssInput&&skillSuggestBox){
    ssInput.addEventListener("input",function(){
      var q=ssInput.value.trim().toLowerCase();
      if(q.length<2){skillSuggestBox.style.display="none";return;}
      var matches=allSkillNames.filter(function(name){return name.toLowerCase().indexOf(q)===0;}).slice(0,8);
      if(!matches.length){skillSuggestBox.style.display="none";return;}
      skillSuggestBox.innerHTML=matches.map(function(name){
        return "<div class=\"skill-suggest-item\" role=\"option\" tabindex=\"0\" data-name=\""+esc(name)+"\" style=\"padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;\">"+esc(name)+"</div>";
      }).join("");
      skillSuggestBox.style.display="block";
      skillSuggestBox.querySelectorAll(".skill-suggest-item").forEach(function(item){
        item.addEventListener("mouseenter",function(){item.style.background="#f8f8f6";});
        item.addEventListener("mouseleave",function(){item.style.background="";});
        addKbdActivation(item);
        item.addEventListener("click",function(){
          ssInput.value=item.dataset.name;
          skillSuggestBox.style.display="none";
        });
      });
    });
    document.addEventListener("click",function(e){
      if(e.target!==ssInput&&!skillSuggestBox.contains(e.target)){
        skillSuggestBox.style.display="none";
      }
    });
  }
}

function dCards(){

  }

  var trackToCats={research:["science","math"],business:["business"],impact:["impact"],arts:["arts","writing"],tech:["tech"],law:["law"]};
  var myCats=trackToCats[S.track]||[];

  // Main list: only genuinely confirmed, actionable deadlines - real
  // dates the backend has independently verified are current.
  var upcoming=COMPS.filter(function(c){
    var d=DEADLINE_DATA[c.n];
    // Guard against stale data: a "confirmed" deadline that has already
    // passed (not yet re-checked by the weekly verification job) should
    // never show as "-2d left, Act now" - exclude it rather than

    return d&&d.status==="confirmed"&&d.deadline_date&&daysUntilISODate(d.deadline_date)>=0;

  // closed) with a real cycle-end date - useful status, not a deadline.
  var running=COMPS.filter(function(c){

// ── Connections: real inbox ──────────────────
// Reads real rows from the connections table in both directions.
// Incoming pending requests are what matter most — this is the only
// place today where one real student sends another real student
// free text, so accept / decline / report all live here.
async function loadRealConnections(){
  var session=await getSession();
  if(!session)return {incoming:[],outgoing:[],accepted:[],me:null};
  var me=session.user.id;
  var res=await sba.from("connections").select("*").or("student_a_id.eq."+me+",student_b_id.eq."+me).order("created_at",{ascending:false});
  var rows=res.data||[];
  if(!rows.length)return {incoming:[],outgoing:[],accepted:[],me:me};

  var otherIds=rows.map(function(r){return r.student_a_id===me?r.student_b_id:r.student_a_id;});
  var pplRes=await sba.from("students_public").select("id,name,school,city,country,track,role").in("id",otherIds);
  var ppl={};
  (pplRes.data||[]).forEach(function(p){ppl[p.id]=p;});

  var incoming=[],outgoing=[],accepted=[];
  rows.forEach(function(r){
    var otherId=r.student_a_id===me?r.student_b_id:r.student_a_id;
    // A blocked student's profile is hidden by RLS, so ppl[otherId]
    // comes back undefined — skip those rows entirely rather than
    // rendering a ghost entry.
    if(!ppl[otherId])return;
    var item={row:r,other:ppl[otherId],otherId:otherId};
    if(r.status==="accepted")accepted.push(item);
    else if(r.student_b_id===me&&r.status==="pending")incoming.push(item);
    else if(r.student_a_id===me&&r.status==="pending")outgoing.push(item);
  });
  return {incoming:incoming,outgoing:outgoing,accepted:accepted,me:me};
}

async function respondToConnection(connId,newStatus){
  return await sba.from("connections").update({status:newStatus}).eq("id",connId);
}

// Honest alternative to promising a response time nobody can control:
// shows how long a request has actually been sitting, computed from the
// real timestamp. This creates real pressure to respond without Partnr
// claiming a commitment it has no way to enforce.
function daysWaitingInfo(createdAt){
  var days=Math.floor((Date.now()-new Date(createdAt).getTime())/(1000*60*60*24));
  var label=days<=0?"Sent today":days===1?"Waiting 1 day":"Waiting "+days+" days";
  return {label:label,urgent:days>=3};
}

// Blocked students list, with unblock. Names are looked up through a
// SECURITY DEFINER-free path: the blocker can always see who they
// blocked because they own those rows, but the restrictive RLS policy
// hides the student profile itself — so we show whatever we can and
// fall back to a neutral label rather than leaking anything.
// ── Shared workspace (per accepted connection) ────────────
// Files and links shared between two connected students. Files are
// documents only (PDF/Word/PowerPoint/Excel/text/CSV) — no images yet,
// since image content needs real screening before it's safe to host
// directly, and that isn't built. A document is a meaningfully lower-risk
// category and covers the overwhelming majority of what two students
// actually need to share to collaborate on a project.
var WORKSPACE_ALLOWED_EXT=["pdf","doc","docx","ppt","pptx","xls","xlsx","txt","csv"];
var WORKSPACE_MAX_BYTES=10*1024*1024;
