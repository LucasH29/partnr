<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Partnr: Find Your Perfect Student Partner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f8f6;color:#1a1a1a;min-height:100vh;}
.app{max-width:680px;margin:0 auto;padding:1.5rem 1rem 3rem;}
.logo{font-size:26px;font-weight:600;color:#1a1a1a;letter-spacing:-0.5px;margin-bottom:1.5rem;}
.logo.big{font-size:60px;line-height:1;margin-bottom:1.5rem;}
.logo span{color:#7F77DD;}
h2{font-size:20px;font-weight:600;color:#1a1a1a;margin-bottom:0.5rem;}
.sub{font-size:14px;color:#666;line-height:1.6;margin-bottom:1.25rem;}
.sbar{display:flex;gap:6px;margin-bottom:1.75rem;}
.sd{height:4px;border-radius:2px;flex:1;background:#e0e0dc;}
.sd.done{background:#7F77DD;}
.slabel{font-size:11px;font-weight:600;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.5px;margin:1rem 0 0.5rem;}
.cgrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1rem;}
.chip{padding:6px 14px;border-radius:20px;border:1px solid #ddd;font-size:13px;cursor:pointer;color:#666;background:white;user-select:none;}
.chip.on{background:#EEEDFE;border-color:#AFA9EC;color:#3C3489;font-weight:500;}
.fi{margin-bottom:1rem;}
.fi label{display:block;font-size:13px;color:#666;margin-bottom:5px;font-weight:500;}
.fi input,.fi select,.fi textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:white;}
.fi textarea{height:80px;resize:none;}
.bp{width:100%;padding:12px;background:#7F77DD;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:0.5rem;font-family:inherit;}
.bp:hover{background:#534AB7;}
.bkbtn{width:100%;margin-top:8px;padding:10px;background:none;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#6b6b6b;cursor:pointer;font-family:inherit;}
.card{background:white;border:1px solid #e8e8e4;border-radius:12px;padding:1.1rem;margin-bottom:0.9rem;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#f4f4f0;color:#666;border:1px solid #e8e8e4;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.why{background:#f8f8f6;border-radius:8px;padding:10px 12px;font-size:13px;color:#666;line-height:1.55;margin-bottom:10px;}
.why strong{color:#1a1a1a;font-weight:600;}
.bc{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:white;font-family:inherit;}
.bo{padding:9px 14px;background:white;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;color:#666;font-family:inherit;}
.bg2{padding:9px 12px;background:white;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;color:#666;font-family:inherit;}
.bg2:hover{background:#f8f8f6;border-color:#bbb;color:#444;}
/* Top bar: logo left, Inbox + profile initials right */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:1rem;}
.topbar .logo{margin-bottom:0;}
.tb-right{display:flex;align-items:center;gap:12px;position:relative;}
.tb-icon{position:relative;width:44px;height:44px;border-radius:50%;background:none;border:none;cursor:pointer;color:#555;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0;}
.tb-icon:hover,.tb-icon.on{background:#EEEDFE;color:#534AB7;}
/* Inbox envelope: a touch bigger so it's easy to spot and tap. */
.nb.tb-icon{width:46px;height:46px;padding:0;flex:none;font-size:26px;color:#444;}
.nb.tb-icon i{font-size:26px;}
.tb-icon #conn-badge{position:absolute;top:0;right:-4px;}
.tb-icon #conn-badge span{margin:0!important;}
.tb-av{width:38px;height:38px;border-radius:50%;background:#EEEDFE;color:#534AB7;font-weight:700;font-size:14px;border:2px solid transparent;cursor:pointer;font-family:inherit;padding:0;}
.tb-av:hover,.tb-av.on{border-color:#7F77DD;}
.pmenu{position:absolute;right:0;top:48px;background:#fff;border:1px solid #e3e2dc;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:250px;padding:6px;z-index:150;}
.pm-who{padding:10px 12px;border-bottom:1px solid #eee;margin-bottom:4px;}
.pm-who b{display:block;font-size:14px;color:#1a1a1a;}
.pm-who small{font-size:12px;color:#888;}
.pm-it{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:14px;color:#333;padding:9px 12px;border-radius:8px;cursor:pointer;}
.pm-it:hover{background:#f5f4fd;}
.pm-it small{display:block;font-size:12px;color:#888;}
.pm-hr{border-top:1px solid #eee;margin:4px 0;}
/* Main tabs */
.nav{display:flex;gap:2px;border-bottom:1px solid #e8e8e4;padding-bottom:8px;margin-bottom:1.5rem;overflow-x:auto;}
.nb{padding:8px 12px;font-size:14px;cursor:pointer;color:#6b6b6b;background:none;border:none;border-radius:8px;white-space:nowrap;font-family:inherit;}
.nb:hover{color:#534AB7;}
.nb.on{color:#534AB7;background:#EEEDFE;font-weight:600;}
.nav .nic{display:none;}
.nav .ns{display:none;}
.nav #nb-board .nic{display:inline;margin-right:4px;}
.page-note{font-size:13px;color:#6b6b6b;margin-bottom:1rem;}
/* Phones: stack the My profile header so the verify links have room */
@media(max-width:480px){.me-head{flex-wrap:wrap;}.me-head>div:last-child{width:100%;text-align:left!important;}}
/* On/off switch (Email settings) */
input.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:#d6d5cf;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;margin:0;}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s;}
input.sw:checked{background:#7F77DD;}
input.sw:checked::after{left:21px;}
input.sw:focus-visible{outline:2px solid #534AB7;outline-offset:2px;}
/* Phones: the five tabs become a bar fixed to the bottom of the screen */
@media(max-width:640px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:120;background:#fff;border-top:1px solid #e8e8e4;border-bottom:none;margin:0;padding:6px 2px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;gap:0;overflow:visible;}
  .nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px 6px;flex:1;border-radius:8px;}
  .nb.on{background:none;}
  .nav .nic{display:block;font-size:20px;line-height:1;margin:0!important;}
  .nav .nl{display:none;}
  .nav .ns{display:block;}
  body{padding-bottom:74px;}
}
/* Sep 30 upgrades: match cards, My board, Find students */
.mcard{touch-action:pan-y;user-select:none;}
.mcircle{width:42px;height:42px;flex-shrink:0;border-radius:50%;border:1px solid #ddd;background:white;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.mpass{color:#888;}.mpass:hover{background:#f6f6f3;border-color:#bbb;}
.msave{color:#B8456E;border-color:#f1c7d6;}.msave:hover{background:#fdf0f4;}
.rate-card{background:#faf9ff;border:1.5px solid #d9d6fb;border-radius:14px;padding:14px;margin-bottom:12px;}
.mloc{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#f1f0ec;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px;color:#555;}
.mloc button{background:none;border:none;cursor:pointer;font-size:12px;color:#7F77DD;font-weight:600;font-family:inherit;padding:0;}
.nfit-toggle{width:100%;text-align:left;background:white;border:1px solid #d9d6fb;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;color:#534AB7;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.nfit-panel{background:white;border:1px solid #d9d6fb;border-radius:12px;padding:12px;margin:-4px 0 12px;}
.nfit-panel textarea{width:100%;height:56px;resize:none;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;}
.nfit-panel input{padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;}
.nfit-or{font-size:11px;font-weight:700;color:#6b6b6b;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;}
.nfit-sbtn{padding:8px 14px;background:#EEEDFE;color:#534AB7;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.todo-card{background:white;border:1px solid #e8e8e4;border-radius:14px;padding:6px 14px;}
.todo-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #f0efeb;}
.todo-row:first-child{border-top:none;}
.todo-row.next{background:#faf9ff;margin:0 -14px;padding:10px 14px;}
.todo-auto{width:20px;height:20px;border-radius:50%;border:2px solid #d6d4cc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:white;margin-top:1px;}
.todo-row.done .todo-auto{background:#1D9E75;border-color:#1D9E75;}
.todo-box{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:#1D9E75;cursor:pointer;}
.todo-t{font-size:14px;color:#1a1a1a;line-height:1.4;}
.todo-row.done .todo-t{color:#999;text-decoration:line-through;}
.todo-hint{font-size:11px;color:#aaa;font-weight:400;margin-left:4px;}
.todo-acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;}
.todo-act{background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;padding:0;}
.msave.on{background:#B8456E;color:white;border-color:#B8456E;}
.msaved-note{font-size:12px;color:#B8456E;font-weight:600;margin:-2px 0 10px;}
.msaved-note a{color:#B8456E;}
.mreasons{margin-top:12px;background:#f8f8f6;border-radius:10px;padding:10px 12px;}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.bpin{background:white;border:1px solid #e8e8e4;border-radius:12px;padding:12px 40px 12px 13px;position:relative;}
.bpin.bdragging{opacity:0.5;outline:2px dashed #7F77DD;outline-offset:2px;}
.bgrip{position:absolute;top:34px;right:2px;width:36px;height:40px;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:14px;letter-spacing:-1px;cursor:grab;touch-action:none;user-select:none;}
.bremove{position:absolute;top:2px;right:2px;width:36px;height:32px;background:none;border:none;color:#bbb;font-size:16px;cursor:pointer;line-height:1;padding:0;font-family:inherit;}
.bremove:hover{color:#C53030;}
.bk{font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;}
.bt{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:6px;line-height:1.3;}
.bmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.bmeta span{font-size:11px;padding:3px 8px;border-radius:20px;background:#f1efe8;color:#555;}
.bform{background:white;border:1px solid #e3e1f7;border-radius:12px;padding:12px;margin-bottom:10px;}
.bform input,.bform textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;margin-bottom:8px;color:#1a1a1a;}
.bform textarea{height:70px;resize:vertical;}
.fs-seg{display:flex;background:white;border:1px solid #ddd;border-radius:10px;padding:3px;gap:3px;}
.fs-seg div{flex:1;text-align:center;padding:9px 6px;border-radius:7px;font-size:13px;color:#555;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fs-seg div.on{background:#7F77DD;color:white;font-weight:600;}
.fs-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px dashed #cfcce9;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:14px;}
.fs-sum b{color:#3C3489;}
.fs-sum button{background:none;border:none;color:#7F77DD;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;}
.fs-more{border-style:dashed !important;color:#7F77DD !important;font-weight:600;border-color:#c9c5f2 !important;}
.fs-panel{background:white;border:1px solid #e3e1f7;border-radius:12px;padding:14px;margin-top:10px;}
.fs-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.fs-tile{border:1px solid #e8e8e4;border-radius:10px;padding:11px 10px;cursor:pointer;font-size:13px;font-weight:600;background:#fafaf8;text-align:left;font-family:inherit;color:#1a1a1a;}
.fs-tile:hover{border-color:#7F77DD;background:#f6f5ff;}
.fs-tile span{display:block;font-weight:400;color:#888;font-size:11px;margin-top:2px;}
.cp-row{padding:10px 4px;border-bottom:1px solid #f0f0ec;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;}
.cp-row:hover{background:#f6f5ff;}
.app-foot{text-align:center;padding:8px 16px 28px;}
.app-foot button{background:none;border:none;color:#999;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline;text-underline-offset:2px;}
.app-foot button:hover{color:#7F77DD;}
.foot-links{font-size:12px;color:#999;margin-bottom:6px;line-height:1.8;}
.foot-links a{color:#888;text-decoration:none;}
#termswrap a{color:#534AB7;font-weight:600;}
.foot-links a:hover{color:#7F77DD;text-decoration:underline;}
.inv-opt{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid #e8e8e4;border-radius:10px;background:#fafaf8;font-size:14px;font-weight:600;color:#1a1a1a;text-decoration:none;cursor:pointer;font-family:inherit;}
.inv-opt:hover{border-color:#7F77DD;background:#f6f5ff;}

.spin{width:30px;height:30px;border:2px solid #e0e0dc;border-top-color:#7F77DD;border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 1rem;}
@keyframes sp{to{transform:rotate(360deg);}}
.tc{padding:14px;border-radius:12px;border:1px solid #ddd;cursor:pointer;user-select:none;}
.tc.on{border-width:2px;}
.rc{padding:12px;border-radius:12px;border:1px solid #ddd;cursor:pointer;user-select:none;}
.rc.on{border-color:#AFA9EC;background:#EEEDFE;}
.rc.on .rn{color:#3C3489;}
.rn{font-size:13px;font-weight:600;color:#1a1a1a;margin-top:4px;}
.rd{font-size:11px;color:#6b6b6b;margin-top:2px;line-height:1.3;}
.stbar{display:flex;gap:6px;margin-bottom:1rem;}
.stb{flex:1;padding:9px 4px;border:1px solid #ddd;border-radius:8px;font-size:10px;text-align:center;cursor:pointer;color:#6b6b6b;line-height:1.3;font-family:inherit;user-select:none;}
.stb.on{background:#EEEDFE;border-color:#AFA9EC;color:#3C3489;font-weight:600;}
.skill-cat{border:1px solid #e8e8e4;border-radius:12px;margin-bottom:10px;overflow:hidden;background:white;}
.skill-cat-header{display:flex;align-items:center;justify-content:space-between;padding:14px;cursor:pointer;user-select:none;}
.skill-cat-header:hover{background:#f8f8f6;}
.skill-items-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.skill-item{border:1px solid #e8e8e4;border-radius:8px;padding:10px;cursor:pointer;user-select:none;background:white;}
.skill-item:hover{background:#f8f8f6;}
.skill-item.on{border-color:#AFA9EC;background:#EEEDFE;}
.skill-item-top{display:flex;align-items:center;gap:8px;}
.skill-item-check{width:16px;height:16px;border-radius:50%;border:1px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.skill-item-check.on{background:#7F77DD;border-color:#7F77DD;}
.skill-item-name{font-size:12px;font-weight:500;color:#666;line-height:1.3;pointer-events:none;}
.skill-item.on .skill-item-name{color:#3C3489;}
.lv-inline{display:none;gap:4px;flex-wrap:wrap;margin-top:6px;}
.lv-inline.show{display:flex;}
.lv{padding:3px 8px;border-radius:20px;border:1px solid #ddd;font-size:10px;cursor:pointer;color:#6b6b6b;background:white;}
.lv[data-lv="Beginner"].on{background:#F1EFE8;border-color:#B4B2A9;color:#444;font-weight:600;}
.lv[data-lv="Intermediate"].on{background:#E6F1FB;border-color:#85B7EB;color:#0C447C;font-weight:600;}
.lv[data-lv="Advanced"].on{background:#EEEDFE;border-color:#AFA9EC;color:#3C3489;font-weight:600;}
.lv[data-lv="Expert"].on{background:#EAF3DE;border-color:#97C459;color:#3B6D11;font-weight:600;}
.swrap{position:relative;margin-bottom:10px;}
.swrap input{width:100%;padding:10px 12px 10px 38px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;color:#1a1a1a;background:white;}
.sico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#6b6b6b;pointer-events:none;}
.cdd{background:white;border:1px solid #ddd;border-radius:8px;margin-top:4px;max-height:260px;overflow-y:auto;position:absolute;width:100%;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,0.1);}
.cddo{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0ec;}
.cddo:last-child{border-bottom:none;}
.cddo:hover{background:#f8f8f6;}
.exbtn{display:flex;align-items:center;gap:8px;padding:12px 14px;border:1px dashed #ccc;border-radius:8px;cursor:pointer;color:#6b6b6b;font-size:13px;background:white;width:100%;margin-bottom:10px;font-family:inherit;user-select:none;}
.exbtn:hover{background:#f8f8f6;}
.expp{display:none;border:1px solid #e8e8e4;border-radius:12px;overflow:hidden;margin-bottom:10px;}
.expp.open{display:block;}
.ctabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid #e8e8e4;background:#f8f8f6;}
.ctab{padding:6px 12px;font-size:12px;cursor:pointer;color:#6b6b6b;background:white;border:1px solid #ddd;border-radius:20px;white-space:nowrap;font-family:inherit;font-weight:500;user-select:none;}
.ctab.on{border-color:currentColor;font-weight:600;}
.ex2{justify-content:center;margin-bottom:0;padding:12px 10px;font-size:13px;border-style:solid;}
.ex2.on{border-color:#AFA9EC;background:#EEEDFE;color:#3C3489;}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media(max-width:420px){.wgrid{grid-template-columns:repeat(2,1fr);}}
.citem{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid #f0f0ec;background:white;}
.citem:last-child{border-bottom:none;}
.citem:hover{background:#f8f8f6;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;margin:0 5px 5px 0;}
.pill button{background:none;border:none;cursor:pointer;font-size:15px;padding:0;opacity:0.7;line-height:1;}
.ps{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid #f0f0ec;}
.ps:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ac{background:#f8f8f6;border-radius:8px;padding:10px 12px;}
.al2{font-size:11px;color:#6b6b6b;margin-bottom:3px;}
.av2{font-size:13px;font-weight:600;color:#1a1a1a;}
.ei{padding:8px 0;border-bottom:1px solid #f0f0ec;}
.ei:last-child{border-bottom:none;}
.dl{display:flex;gap:12px;background:white;border:1px solid #e8e8e4;border-radius:12px;padding:1rem;margin-bottom:0.75rem;align-items:flex-start;}
.pit{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0ec;}
.pit:last-child{border-bottom:none;}
.hint{font-size:12px;color:#6b6b6b;background:#f8f8f6;border-radius:8px;padding:8px 12px;margin-bottom:8px;line-height:1.5;}
.fi input[type="date"]{height:42px;line-height:1.2;-webkit-appearance:none;appearance:none;}
.fi input.err,.fi select.err,.fi textarea.err{border-color:#C53030;background:#FFF5F5;}
.fi input.err:focus,.fi select.err:focus{outline:none;border-color:#C53030;box-shadow:0 0 0 3px rgba(229,62,62,0.15);}
.field-err{font-size:12px;color:#C53030;margin-top:4px;display:flex;align-items:center;gap:4px;}

// Lazy-loads the world cities autocomplete data once (name + country +
// population, ~48k entries limited to real, medium-or-larger places).
// This is a suggestion list, not a whitelist — free text always stays
// allowed, since a global list this size can't include every small town
// and rejecting a real student's real hometown would work directly
// against why Partnr exists.
async function loadWorldCities(){
  if(WORLD_CITIES)return WORLD_CITIES;
  if(worldCitiesLoading)return worldCitiesLoading;
  worldCitiesLoading=fetch("world_cities.json").then(function(r){return r.json();}).then(function(data){
    WORLD_CITIES=data;
    return data;
  }).catch(function(ex){
    console.error("Could not load world cities list",ex);
    WORLD_CITIES=[];
    return WORLD_CITIES;
  });
  return worldCitiesLoading;
}

// Zip → city autofill via Zippopotam.us (free, no API key, ~60 countries,
// GeoNames-backed). Never blocks or errors the form — if the lookup fails,
// times out, or the country isn't covered, the student just keeps typing
// their city normally. Only fills the city field if it's currently empty,
// so it never overwrites something the student already entered.
async function autofillCityFromZip(country,zip,cityInputEl){
  var iso=COUNTRY_ISO[country];
  if(!iso||!zip||!cityInputEl||cityInputEl.value.trim())return;
  try{
    var res=await fetch("https://api.zippopotam.us/"+iso.toLowerCase()+"/"+encodeURIComponent(zip.trim()));
    if(!res.ok){console.warn("[Partnr] zip lookup returned",res.status,"for",iso,zip);return;}
    var data=await res.json();
    var place=data&&data.places&&data.places[0]&&data.places[0]["place name"];
    if(place&&!cityInputEl.value.trim()){
      cityInputEl.value=place;
      cityInputEl.dispatchEvent(new Event("input"));
    }
  }catch(ex){
    // Never shown to the user — this is a convenience, not a requirement —
    // but logged so a failure is actually diagnosable via DevTools instead
    // of just "the zip thing isn't working" with no way to tell why.
    console.warn("[Partnr] zip autofill failed (non-fatal):",ex);
  }
}

// State/province from a postal code (e.g. 91316 -> "CA"), used to show
// same-state students first. Never blocks signup if the lookup fails.
async function lookupStateFromZip(country,zip){
  var iso=COUNTRY_ISO[country];
  if(!iso||!zip)return "";
  try{
    var res=await fetch("https://api.zippopotam.us/"+iso.toLowerCase()+"/"+encodeURIComponent(String(zip).trim()));
    if(!res.ok)return "";
    var data=await res.json();
    var pl=data&&data.places&&data.places[0];
    // Also keep an approximate spot (rounded to about 1 km) so "my city /
    // region" can include nearby towns. Never shown to other students.
    if(pl&&pl.latitude&&pl.longitude){
      S.lat=Math.round(parseFloat(pl.latitude)*100)/100;
      S.lng=Math.round(parseFloat(pl.longitude)*100)/100;
      S.geoZip=String(zip).trim();
    }
    return (pl&&(pl["state abbreviation"]||pl.state))||"";
  }catch(ex){console.warn("[Partnr] state lookup failed (non-fatal):",ex);return "";}
}

// Google includes an "hd" (hosted domain) claim ONLY for real school/
// work Google Workspace accounts — never for personal Gmail. This is
// Google itself cryptographically confirming domain ownership, which
// is stronger evidence than anything else in our verification system.
function getGoogleHostedDomain(session){
  if(!session||!session.user)return null;
  var meta=session.user.user_metadata||{};
  if(meta.hd)return meta.hd;
  var identities=session.user.identities||[];
  for(var i=0;i<identities.length;i++){
    if(identities[i].provider==="google"&&identities[i].identity_data&&identities[i].identity_data.hd){
      return identities[i].identity_data.hd;
    }
  }
  return null;
}
// Checks BOTH Google and Microsoft SSO for a confirmed organizational
// domain. Google gives us a direct "hd" claim. Microsoft doesn't
// expose an equivalent claim through Supabase, so instead we check
// the actual signed-in email's domain against the personal-provider
// blocklist (which already includes outlook.com, hotmail.com, etc.)
// — if it's NOT personal, it's a real Microsoft 365 organizational
// account, which is just as trustworthy a signal.
function getSSOConfirmedDomain(session){
  var hd=getGoogleHostedDomain(session);
  if(hd)return hd;
  if(session&&session.user&&session.user.app_metadata&&session.user.app_metadata.provider==="azure"){
    var msDomain=getEmailDomain(session.user.email);
    if(msDomain&&PERSONAL_EMAIL_DOMAINS.indexOf(msDomain)<0)return msDomain;
  }
  return null;
}

// ── School email verification ───────────────
// Personal email providers = NOT a school, always "self-reported"
var PERSONAL_EMAIL_DOMAINS=["gmail.com","yahoo.com","hotmail.com","outlook.com",
  "icloud.com","aol.com","live.com","msn.com","protonmail.com","mail.com",
  "gmx.com","yandex.com","qq.com","163.com","mail.ru","zoho.com"];

function getEmailDomain(email){
  var parts=(email||"").toLowerCase().split("@");
  return parts.length===2?parts[1]:"";
}

// Checks the student's email against the personal-provider list and
// the verified school_domains table. Returns:
//   {tier:"verified", schoolName: "..."}   — domain matches a confirmed school
//   {tier:"self_reported"}                  — personal email or unmatched domain
async function checkSchoolVerification(email,ssoConfirmedDomain){
  // SSO short-circuit: if Google or Microsoft itself confirmed this is
  // a real organizational account (not personal Gmail/Outlook), that's
  // stronger evidence than our own domain list — trust it directly,
  // but still try to look up the real school name if we happen to have it.
  if(ssoConfirmedDomain){
    var schoolName=null;
    try{
      var ssoRes=await sba.from("school_domains").select("school_name").eq("domain",ssoConfirmedDomain).maybeSingle();
      if(ssoRes.data)schoolName=ssoRes.data.school_name;
    }catch(ex){/* ignore, fall through to generic label below */}
    return {
      tier:"verified",
      schoolName:schoolName||("Verified via "+ssoConfirmedDomain),
      viaSSO:true
    };
  }

  var domain=getEmailDomain(email);
  if(!domain||PERSONAL_EMAIL_DOMAINS.indexOf(domain)>=0){
    return {tier:"self_reported"};
  }
  // Build every parent-domain candidate at real label (dot) boundaries only.
  // e.g. mymail.lausd.net -> also checks "lausd.net", but NEVER matches
  // via raw substring, so "evillausd.net" can never falsely match
  // "lausd.net" just because the characters happen to line up.
  var parts=domain.split(".");
  var candidates=[domain];
  for(var i=1;i<parts.length-1;i++){
    candidates.push(parts.slice(i).join("."));
  }
  try{
    var res=await sba.from("school_domains").select("domain,school_name,source").in("domain",candidates);
    if(res.data&&res.data.length){
      // If multiple candidates matched, prefer the most specific (longest) one.
      var best=res.data.reduce(function(a,b){return b.domain.length>a.domain.length?b:a;});
      // Hand-verified entries (manual/nais) get full "Verified" status.
      // Bulk-imported entries (cde_bulk) are honestly labeled as a lower
      // confidence tier, since the source data is a district's general
      // public website, not a confirmed email domain — some districts
      // (LAUSD, San Diego, Oak Park) turned out to use a totally
      // different domain for actual student/staff email.
      var isHighConfidence=(best.source==="manual"||best.source==="nais");
      return {
        tier:isHighConfidence?"verified":"likely_verified",
        schoolName:best.school_name
      };
    }
  }catch(ex){
    console.error("School verification lookup failed",ex);
  }
  // Domain isn't a known personal provider, but also isn't in our
  // verified table yet — treat as self-reported until it's added.
  return {tier:"self_reported"};
}

// Counts OTHER students who self-reported the SAME school name with
// the SAME email domain. This is a read-only trust signal only — it
// never writes to school_domains, so it can't be gamed into fake
// "verified" status the way an auto-write system could be.
async function countPeerCorroboration(email,schoolName){
  var domain=getEmailDomain(email);
  if(!domain||!schoolName)return 0;
  try{
    // The database counts matching students for us and returns only a
    // number - the app never downloads anyone else's email address.
    var res=await sba.rpc("peer_corroboration_count",{p_school:schoolName.trim(),p_domain:domain});
    return (res&&typeof res.data==="number")?res.data:0;
  }catch(ex){
    return 0;
  }
}

// ── Signup lead capture ──────────────────────

function saveSignupLead(fields){}

async function saveProfile(){
  var session=await getSession();
  if(!session)return {error:"no session"};
  var uid=session.user.id;

  var ssoDomain=getSSOConfirmedDomain(session);
  var verification=await checkSchoolVerification(S.email,ssoDomain);
  var savedSchoolName=S.school;
  if(verification.tier==="verified"||verification.tier==="likely_verified"){
    // Safety fix: the displayed school comes from the confirmed domain
    // match, NOT from whatever the student typed — this is what stops
    // someone claiming a school their email doesn't actually belong to.
    // Applies to both tiers since the SCHOOL NAME is accurate either way
    // (from official government data) — the tier only reflects how
    // confident we are that this domain is actually used for email.
    savedSchoolName=verification.schoolName;
    S.school=verification.schoolName;
  } else {
    // Self-reported: check if others independently reported the same
    // school + domain combo. 2+ others (3 total) upgrades the badge
    // to a distinct "confirmed by multiple students" tier — still not
    // fully "Verified", but more trustworthy than a lone self-report.
    // The database now works out the "confirmed by multiple students"
    // badge itself when the profile is saved.
  }

  if(S.zip&&S.country&&(!S.state||S.geoZip!==String(S.zip).trim())){
    var st=await lookupStateFromZip(S.country,S.zip);
    if(st)S.state=st;
  }
  if(!S.zip){S.lat=null;S.lng=null;}
  var upsertRes=await sba.from("students").upsert({
    id:uid,name:S.name,email:S.email,school:savedSchoolName,country:S.country,city:S.city,
    zip:S.zip,state:S.state||null,lat:(S.lat==null?null:S.lat),lng:(S.lng==null?null:S.lng),grade:S.grade,track:S.track,role:S.role,secondary:S.secondary,status:S.status,
    idea:S.idea,availability:S.availability,commit:S.commit,github:S.github,location:S.location,
    location_pref:S.locationPref,links:S.links||[],proof_of_work:S.proofOfWork||[],
    stage:S.stage,school_verification:verification.tier,onboarded:true,skills_needed:S.skillsNeeded||"",dob:S.dob||null,fun_fact:(S.funFact||"").trim().slice(0,150)||null,
    terms_version:S.termsVersion||undefined // the database stamps the time
  });
  if(upsertRes.error)return upsertRes;
  // The database decides the school badge (and may correct the school
  // name for verified schools), so show what it saved.
  try{
    var back=await sba.from("students").select("school,school_verification,email").eq("id",uid).maybeSingle();
    if(back.data){S.school=back.data.school||S.school;S.schoolVerification=back.data.school_verification||"self_reported";S.email=back.data.email||S.email;}
  }catch(ex){}

  await sba.from("skills").delete().eq("student_id",uid);
  var skillRows=Object.keys(S.skillLevels||{}).map(function(k){
    var parts=k.split(":");
    return {student_id:uid,category:parts[0],skill_name:parts[1]||parts[0],level:S.skillLevels[k]||null};
  });
  if(skillRows.length){
    var skillsIns=await sba.from("skills").insert(skillRows);
    if(skillsIns.error)return skillsIns;
  }

  await sba.from("languages").delete().eq("student_id",uid);
  if((S.languages||[]).length){
    var langIns=await sba.from("languages").insert(S.languages.map(function(l){return {student_id:uid,language_name:l};}));
    if(langIns.error)return langIns;
  }

  await sba.from("competitions").delete().eq("student_id",uid);
  if((S.comps||[]).length){
    var compIns=await sba.from("competitions").insert(S.comps.map(function(c){
      return {student_id:uid,competition_name:(c&&c.name)?c.name:c,cross_type:(c&&c.type)?c.type:null};
    }));
    if(compIns.error)return compIns;
  }
  return {error:null};
}
async function loadProfileIntoState(uid){
  var pRes=await sba.from("students").select("*").eq("id",uid).maybeSingle();
  if(pRes.error||!pRes.data)return null;
  var p=pRes.data;
  S.name=p.name||"";S.email=p.email||"";S.school=p.school||"";S.country=p.country||"";
  S.city=p.city||"";S.zip=p.zip||"";S.grade=p.grade||"";S.track=p.track||"";S.role=p.role||"";
  S.secondary=p.secondary||[];S.status=(p.status||"").replace(/^I have a project.*$/,"I have a project and need partners");S.idea=p.idea||"";S.availability=p.availability||"";
  S.commit=p.commit||"";S.github=p.github||"";S.location=p.location||"";S.locationPref=(p.location_pref||"").replace("🏣","🏫");
  S.links=p.links||[];S.proofOfWork=(p.proof_of_work||[]).map(function(it){if(it&&it.link){var l=normalizeHandleLink(it.link);if(l!==it.link)it.link=l;}return it;});S.savedIds=p.saved_profiles||[];S.stage=p.stage||"";

  S.skillsNeeded=p.skills_needed||"";S.funFact=p.fun_fact||"";S.termsVersion=p.terms_version||"";S.emailPrefs=p.email_prefs||{};

  var skillsRes=await sba.from("skills").select("*").eq("student_id",uid);
  S.skillLevels={};

  var langRes=await sba.from("languages").select("*").eq("student_id",uid);
  S.languages=(langRes.data||[]).map(function(r){return r.language_name;});

  var compRes=await sba.from("competitions").select("*").eq("student_id",uid);
  S.comps=(compRes.data||[]).map(function(r){return r.competition_name;});

  return p;
}

// ── Safety: blocks & reports ─────────────────
// BLOCKED_IDS is a convenience cache for hiding people in the UI.
// It is NOT the security boundary — blocking is enforced server-side
// by restrictive RLS policies in Supabase, so a blocked student can't
// reach around the interface by calling the API directly.
var BLOCKED_IDS={};

async function loadBlockedIds(){
  try{
    var session=await getSession();
    if(!session)return;
    var res=await sba.from("blocks").select("blocked_id").eq("blocker_id",session.user.id);
    BLOCKED_IDS={};
    (res.data||[]).forEach(function(r){BLOCKED_IDS[r.blocked_id]=true;});
  }catch(ex){console.error("Could not load blocks",ex);}
}

async function blockStudent(otherId){
  var session=await getSession();
  if(!session)return {error:"no session"};
  if(!otherId||otherId===session.user.id)return {error:"invalid target"};
  var res=await sba.from("blocks").insert({blocker_id:session.user.id,blocked_id:otherId});
  // A duplicate block isn't a failure from the student's point of
  // view — they wanted this person blocked, and they are.
  if(res.error&&res.error.code!=="23505")return res;
  BLOCKED_IDS[otherId]=true;
  return {error:null};
}

async function unblockStudent(otherId){
  var session=await getSession();
  if(!session)return {error:"no session"};
  var res=await sba.from("blocks").delete().eq("blocker_id",session.user.id).eq("blocked_id",otherId);
  if(!res.error)delete BLOCKED_IDS[otherId];
  return res;
}

async function submitReport(reportedId,reason,details,context,contextId){
  var session=await getSession();
  if(!session)return {error:"no session"};
  if(!reportedId||reportedId===session.user.id)return {error:"invalid target"};
  return await sba.from("reports").insert({
    reporter_id:session.user.id,
    reported_id:reportedId,
    reason:reason,
    details:details||null,
    context:context||"profile",
    context_id:contextId||null
  });
}

// ── Real student search ──────────────────────
// Searches the real students table by skill/category, competition name,
// and free-text idea — instead of asking Claude to invent fictional
// people. Returns an array shaped to match what renderSR() expects,
// plus a hidden _realId on each result so Connect can send a real
// connection request instead of a demo toast.
var AVATAR_COLORS=["purple","teal","coral","blue","green"];
function colorForId(id){
  var sum=(id||"").split("").reduce(function(a,c){return a+c.charCodeAt(0);},0);
  return AVATAR_COLORS[sum%AVATAR_COLORS.length];
}
function initialsFor(name){
  return (name||"?").trim().split(/\s+/).map(function(w){return w[0];}).join("").substring(0,2).toUpperCase();
}
// Shown to OTHER students — "Lucas H." instead of a full last name. The
// full name is still collected and stored (needed for verification and
// safety review), this only affects how it's rendered in the app to
// people who aren't the profile's own owner. A single-word name (or one
// already this short) is returned unchanged rather than truncated oddly.
// School is hidden from other students by default - the same kind of
// identifying detail displayName() already protects by truncating last
// names. It's shown only when it's actually load-bearing: a real,
// currently-shared target competition that requires same school (the
// whole point of that match is confirming that), or once a connection
// is genuinely accepted. Falls back to city, which tells another
// student everything they actually need (can we meet, what hours
// overlap) without handing a stranger the exact school a minor attends.
function locationLine(school,city,country,showSchool){
  var head=(showSchool&&school)?school:(city||"");
  return esc(head)+(country?" · "+esc(country):"");
}
// True only when a competition both students are actually targeting
// requires the same school - not just any shared interest.
function sharesSchoolRequiredComp(theirComps){
  if(!theirComps||!theirComps.length||!S.comps||!S.comps.length)return false;
  return theirComps.some(function(name){
    if(S.comps.indexOf(name)<0)return false;
    var c=COMPS.find(function(x){return x.n===name;});
    return c&&c.cross===false;
  });
}

function displayName(name){
  var parts=(name||"").trim().split(/\s+/);
  if(parts.length<2)return name||"";
  return parts[0]+" "+parts[parts.length-1][0]+".";
}
// Accepts either a plain string (old free-text call sites keep working)
// or an options object: {query, city, school, competition}. Filters
// combine with AND — e.g. city + competition finds students in that city
// targeting that exact competition. city/school are plain columns on
// students, so they're applied directly; competition and free-text query
// narrow via a candidate-id set first, same as the original approach.
// Toggling a save is a private, personal action - persist it immediately
// rather than waiting for the student to hit Continue somewhere else.
async function toggleSaveProfile(id){
  var on=S.savedIds.indexOf(id)>=0;
  S.savedIds=on?S.savedIds.filter(function(x){return x!==id;}):S.savedIds.concat([id]);
  var session=await getSession();
  if(!session)return !on;
  await sba.from("students").update({saved_profiles:S.savedIds}).eq("id",session.user.id);
  return !on;
}
async function fetchSavedStudents(){
  if(!S.savedIds.length)return [];
  var studentsRes=await sba.from("students_public").select("id,name,school,city,country,grade,track,role,availability,status,idea,proof_of_work,links").in("id",S.savedIds);
  if(studentsRes.error)throw studentsRes.error;
  var students=(studentsRes.data||[]).filter(function(s){return !BLOCKED_IDS[s.id];});
  students.forEach(function(s){if(s.status&&s.status.indexOf("I have a project")===0)s.status="I have a project and need partners";});
  if(!students.length)return [];
  var finalIds=students.map(function(s){return s.id;});
  var allSkillsRes=await sba.from("skills").select("student_id,category,skill_name,level").in("student_id",finalIds);
  var skillsByStudent={};
  (allSkillsRes.data||[]).forEach(function(r){(skillsByStudent[r.student_id]=skillsByStudent[r.student_id]||[]).push(r);});
  var allCompsRes=await sba.from("competitions").select("student_id,competition_name").in("student_id",finalIds);
  var compsByStudent={};
  (allCompsRes.data||[]).forEach(function(r){(compsByStudent[r.student_id]=compsByStudent[r.student_id]||[]).push(r.competition_name);});
  return students.map(function(s){
    var mySkills=skillsByStudent[s.id]||[];
    var keySkill=mySkills[0]?mySkills[0].skill_name:"Partner";
    var keyLevel=(mySkills[0]&&mySkills[0].level)||"";
    var otherSkills=mySkills.filter(function(x){return x.skill_name!==keySkill;}).slice(0,3).map(function(x){return x.skill_name;});
    return {
      name:s.name,school:s.school,city:s.city,country:s.country,grade:s.grade,
      avatar:initialsFor(s.name),avatarColor:colorForId(s.id),
      track:s.track,role:s.role,
      availability:s.availability||"Not specified",
      status:s.status||"Open to connecting",
      bio:s.idea||"",
      keySkill:keySkill,keyLevel:keyLevel,
      otherSkills:otherSkills,
      competitions:compsByStudent[s.id]||[],
      proofOfWork:s.proof_of_work||[],
      links:s.links||[],
      _realId:s.id
    };
  });
}
async function searchRealStudents(opts,excludeId){
  if(typeof opts==="string")opts={query:opts};
  opts=opts||{};
  var query=(opts.query||"").trim();
  var city=(opts.city||"").trim();
  var school=(opts.school||"").trim();
  var country=(opts.country||"").trim();
  var competition=(opts.competition||"").trim();
  var category=(opts.category||"").trim();
  var subcat=(opts.subcat||"").trim();
  if(!opts.all&&!query&&!city&&!school&&!country&&!competition&&!category&&!subcat)return [];

  var idList=null; // null = no id-narrowing needed (pure city/school filter)
  var skillMatch={};

  if(query||competition||category||subcat){
    var ids={};
    if(query){
      var wc=query;
      var skillsRes=await sba.from("skills").select("student_id,category,skill_name,level")
        .or("skill_name.ilike.*"+wc+"*,category.ilike.*"+wc+"*");
      if(skillsRes.error)throw skillsRes.error;
      (skillsRes.data||[]).forEach(function(r){
        ids[r.student_id]=true;
        if(!skillMatch[r.student_id])skillMatch[r.student_id]={skill:r.skill_name,level:r.level};
      });
      var qp="%"+query+"%";
      var compTextRes=await sba.from("competitions").select("student_id,competition_name").ilike("competition_name",qp);
      if(compTextRes.error)throw compTextRes.error;
      (compTextRes.data||[]).forEach(function(r){ids[r.student_id]=true;});
      var ideaRes=await sba.from("students_public").select("id").ilike("idea",qp);
      if(ideaRes.error)throw ideaRes.error;
      (ideaRes.data||[]).forEach(function(r){ids[r.id]=true;});
    }
    if(competition){
      var compExactRes=await sba.from("competitions").select("student_id").eq("competition_name",competition);
      if(compExactRes.error)throw compExactRes.error;
      var compIds={};
      (compExactRes.data||[]).forEach(function(r){compIds[r.student_id]=true;});
      if(query){
        var narrowed={};
        Object.keys(ids).forEach(function(id){if(compIds[id])narrowed[id]=true;});
        ids=narrowed;
      } else {
        ids=compIds;
      }
    }
    if(category){
      // Broader than an exact competition name — matches any student
      // targeting ANY real competition that falls under this category,
      // e.g. "All Tech competitions" captures Congressional App
      // Challenge, USACO, CyberPatriot, etc. all at once. Also matches
      // by TRACK, not just saved competitions - a student whose track
      // is Research & Science should show up under "All Science
      // competitions" even if they haven't logged a specific one yet,
      // the same track-or-competition rule used everywhere else in
      // this app (Open Projects sorting, the weekly match email).
      var namesInCategory=COMPS.filter(function(c){return c.cat===category;}).map(function(c){return c.n;});
      var catIds={};
      if(namesInCategory.length){
        var catCompRes=await sba.from("competitions").select("student_id").in("competition_name",namesInCategory);
        if(catCompRes.error)throw catCompRes.error;
        (catCompRes.data||[]).forEach(function(r){catIds[r.student_id]=true;});
      }
      var CATEGORY_TO_TRACK={science:"research",business:"business",impact:"impact",tech:"tech",arts:"arts",writing:"arts",law:"law"};
      var mappedTrack=CATEGORY_TO_TRACK[category];
      if(mappedTrack){
        var trackRes=await sba.from("students_public").select("id").eq("track",mappedTrack);
        if(trackRes.error)throw trackRes.error;
        (trackRes.data||[]).forEach(function(r){catIds[r.id]=true;});
      }
      if(query||competition){
        var narrowedCat={};
        Object.keys(ids).forEach(function(id){if(catIds[id])narrowedCat[id]=true;});
        ids=narrowedCat;
      } else {
        ids=catIds;
      }
    }
    if(subcat){
      // Coding and Robotics are already tagged on real competitions
      // (subcat), but until now nothing in the UI ever let a student
      // filter by them — this makes that existing data reachable.
      var namesInSubcat=COMPS.filter(function(c){return c.subcat===subcat;}).map(function(c){return c.n;});
      var subIds={};
      if(namesInSubcat.length){
        var subCompRes=await sba.from("competitions").select("student_id").in("competition_name",namesInSubcat);
        if(subCompRes.error)throw subCompRes.error;
        (subCompRes.data||[]).forEach(function(r){subIds[r.student_id]=true;});
      }
      if(query||competition||category){
        var narrowedSub={};
        Object.keys(ids).forEach(function(id){if(subIds[id])narrowedSub[id]=true;});
        ids=narrowedSub;
      } else {
        ids=subIds;
      }
    }
    idList=Object.keys(ids);
    if(!idList.length)return [];
  }

  var studentsQuery=sba.from("students_public").select("id,name,school,city,state,country,grade,track,role,availability,status,idea,proof_of_work,links").eq("onboarded",true).limit(60);
  if(idList!==null)studentsQuery=studentsQuery.in("id",idList);
  // "Near me" = same city or within about 25 miles (worked out by the
  // database, so nobody's location is ever sent to the browser).
  if(city)studentsQuery=studentsQuery.eq("near_me",true);
  if(country)studentsQuery=studentsQuery.ilike("country",country);
  if(excludeId)studentsQuery=studentsQuery.neq("id",excludeId);

  var studentsRes=await studentsQuery;
  if(studentsRes.error)throw studentsRes.error;
  // Server-side RLS already hides blocked students, but filtering here
  // too keeps the UI consistent immediately after a block, before any
  // refetch happens.
  var students=(studentsRes.data||[]).filter(function(s){return !BLOCKED_IDS[s.id];});
  students.forEach(function(s){if(s.status&&s.status.indexOf("I have a project")===0)s.status="I have a project and need partners";});
  // Nearest first: same school, city, state, country, then everyone else.
  // "My school": only your own school (the school name is hidden for
  // everyone else anyway). Same spelling rules as the database.
  if(school)students=students.filter(function(s){return s.school&&normSchool(s.school)===normSchool(school);});
  students.sort(function(a,b){return locationRank(a)-locationRank(b);});
  console.log("[Partnr search] filters:",{query:query,city:city,school:school,competition:competition},"| matched:",students.length);
  if(!students.length)return [];

  var finalIds=students.map(function(s){return s.id;});
  var allSkillsRes=await sba.from("skills").select("student_id,category,skill_name,level").in("student_id",finalIds);
  var skillsByStudent={};
  (allSkillsRes.data||[]).forEach(function(r){(skillsByStudent[r.student_id]=skillsByStudent[r.student_id]||[]).push(r);});

  var allCompsRes=await sba.from("competitions").select("student_id,competition_name").in("student_id",finalIds);
  var compsByStudent={};
  (allCompsRes.data||[]).forEach(function(r){(compsByStudent[r.student_id]=compsByStudent[r.student_id]||[]).push(r.competition_name);});

  var fallbackLabel=query||competition||"Partner";
  return students.map(function(s){
    var mySkills=skillsByStudent[s.id]||[];
    var matched=skillMatch[s.id];
    var keySkill=matched?matched.skill:(mySkills[0]?mySkills[0].skill_name:fallbackLabel);
    var keyLevel=(matched&&matched.level)||(mySkills[0]&&mySkills[0].level)||"";
    var otherSkills=mySkills.filter(function(x){return x.skill_name!==keySkill;}).slice(0,3).map(function(x){return x.skill_name;});
    return {
      name:s.name,school:s.school,city:s.city,country:s.country,grade:s.grade,
      avatar:initialsFor(s.name),avatarColor:colorForId(s.id),
      track:s.track,role:s.role,
      availability:s.availability||"Not specified",
      status:s.status||"Open to connecting",
      bio:s.idea||"",
      keySkill:keySkill||fallbackLabel,keyLevel:keyLevel,
      otherSkills:otherSkills,
      competitions:compsByStudent[s.id]||[],
      proofOfWork:s.proof_of_work||[],
      links:s.links||[],
      _realId:s.id
    };
  });
}

// Links from emails: ?unsubscribe=TOKEN&c=messages and ?settings=email.
var OPEN_EMAIL_SETTINGS=false;
function readEmailLinkParams(){
  try{
    var q=new URLSearchParams(window.location.search);
    var tok=q.get("unsubscribe");
    if(q.get("settings")==="email")OPEN_EMAIL_SETTINGS=true;
    // Email buttons say where to land: ?open=inbox, ?open=chat&c=<connection>,
    // ?open=applications&p=<project>, ?open=projects, ?open=matches.
    // Kept in this browser so it still works if they have to sign in first.
    var openView=q.get("open");
    if(openView){
      try{localStorage.setItem(OPEN_KEY,JSON.stringify({v:openView,c:q.get("c")||"",p:q.get("p")||"",t:Date.now()}));}catch(ex){}
    }
    if(tok||OPEN_EMAIL_SETTINGS||openView){
      // Tidy the address bar so a refresh or shared link doesn't repeat it.
      history.replaceState(null,"",window.location.pathname+window.location.hash);
    }
    return tok?{token:tok,cat:q.get("c")||""}:null;
  }catch(ex){return null;}
}

// Sign-up answers kept in this browser until sign-up finishes, so a
// refresh or the email-link round trip doesn't lose them. Expires after
// a day so a shared school computer doesn't keep someone's details.
var PENDING_KEY="partnr_pending_signup";
function savePendingSignup(){
  try{localStorage.setItem(PENDING_KEY,JSON.stringify(Object.assign({},S,{_savedAt:Date.now()})));}catch(ex){}
}
function readPendingSignup(){
  try{
    var raw=localStorage.getItem(PENDING_KEY);if(!raw)return null;
    var d=JSON.parse(raw);
    if(!d._savedAt||Date.now()-d._savedAt>24*60*60*1000){localStorage.removeItem(PENDING_KEY);return null;}
    return d;
  }catch(ex){return null;}
}
function clearPendingSignup(){try{localStorage.removeItem(PENDING_KEY);}catch(ex){}}

// Opens the page an email button pointed to, once the student is signed in.
var OPEN_KEY="partnr_open_after_login";
function waitFor(test,ms){
  return new Promise(function(resolve){
    var start=Date.now();
    (function poll(){
      var el=test();
      if(el)return resolve(el);
      if(Date.now()-start>ms)return resolve(null);
      setTimeout(poll,150);
    })();
  });
}
async function applyPendingOpen(){
  var d=null;
  try{d=JSON.parse(localStorage.getItem(OPEN_KEY)||"null");localStorage.removeItem(OPEN_KEY);}catch(ex){}
  if(!d||!d.v||Date.now()-(d.t||0)>24*60*60*1000)return;
  if(d.v==="inbox"){selectTab("conns");return;}
  if(d.v==="chat"){
    selectTab("conns");
    if(!d.c)return;
    var btn=await waitFor(function(){return document.querySelector(".conn-chat[data-conn=\""+CSS.escape(d.c)+"\"]");},8000);
    if(btn&&CURRENT_TAB==="conns")btn.click();
    return;
  }
  if(d.v==="projects"){selectTab("recruit");return;}
  if(d.v==="applications"){
    selectTab("recruit");
    if(!d.p)return;
    var ready=await waitFor(function(){return document.querySelector(".my-posting-manage[data-id=\""+CSS.escape(d.p)+"\"]");},8000);
    if(ready&&CURRENT_TAB==="recruit")ready.click();
    return;
  }
  if(d.v==="board"){selectTab("board");return;}
  if(d.v==="matches")selectTab("matches");
}

// ── App boot ─────────────────────────────────
async function boot(){
  var unsub=readEmailLinkParams();
  if(unsub){rUnsubscribe(unsub.token,unsub.cat);return;}
  try{
    var session=await getSession();
    if(session){
      await loadBlockedIds();
      var profile=await loadProfileIntoState(session.user.id);
      if(profile&&profile.onboarded){
        // Older profiles: add the approximate location from their zip once.
        if(S.zip&&S.country&&S.lat==null){
          lookupStateFromZip(S.country,S.zip).then(function(){
            if(S.lat!=null)sba.from("students").update({lat:S.lat,lng:S.lng}).eq("id",session.user.id).then(function(){},function(){});
          });
        }
        await loadSavedMatches();
        goTo("matches");
        if(OPEN_EMAIL_SETTINGS){OPEN_EMAIL_SETTINGS=false;openEmailSettings();}
        else applyPendingOpen();
        return;
      }
      if(profile){
        goTo("track");
        return;
      }
      // Session exists but no students row yet.
      // Case 1: signed in via Google, Microsoft, or GitHub directly
      // from Welcome — none of these give us school/country/city/etc,
      // so route to the full signup form (pre-filled) instead of
      // skipping straight to Track & Role.
      var provider=session.user.app_metadata&&session.user.app_metadata.provider;
      if(provider==="google"||provider==="azure"||provider==="github"){
        var ssoMeta=session.user.user_metadata||{};
        S.name=ssoMeta.full_name||ssoMeta.name||"";
        S.email=session.user.email||"";
        // GitHub is the one provider that also hands us something
        // directly useful: the account's real username, which becomes
        // a ready-made entry in Your Links - actually shown to other
        // students, unlike the old standalone field it replaces.
        if(provider==="github"&&ssoMeta.user_name)S.links=[{url:"https://github.com/"+ssoMeta.user_name}];
        PENDING_GOOGLE_SESSION=session; // name kept for simplicity; covers every SSO provider
        goTo("signup");
        return;
      }
      // Case 2: returning from a magic-link email, possibly in a
      // totally different browser/app than the one they signed up
      // in. First choice: our own metadata attached at signup time
      // (works everywhere, since it's stored server-side, and always
      // includes every field together — school, grade, country, etc).
      var meta=session.user.user_metadata||{};
      if(meta.name){
        S.name=meta.name;S.email=session.user.email;S.school=meta.school||"";
        S.grade=meta.grade||"";S.country=meta.country||"";S.city=meta.city||"";
        S.zip=meta.zip||"";S.languages=meta.languages||[];S.dob=meta.dob||"";S.funFact=meta.funFact||"";
        // Bring back anything already answered on the Interests page.
        var earlier=readPendingSignup();
        if(earlier&&earlier.email&&S.email&&earlier.email.toLowerCase()===S.email.toLowerCase()){
          ["track","secondary","status","idea","commit","locationPref","comps"].forEach(function(k){if(earlier[k]&&(!Array.isArray(earlier[k])||earlier[k].length))S[k]=earlier[k];});
          if(typeof rebuildSelCompsFromProfile==="function")rebuildSelCompsFromProfile();
        }
        goTo("track");
        return;
      }
      // Fallback: local browser storage, in case metadata wasn't set
      // (e.g. an older signup from before this fix).
      try{
        var restored=readPendingSignup();
        if(restored){
          Object.keys(restored).forEach(function(k){if(k!=="_savedAt")S[k]=restored[k];});
        }
      }catch(ex){}
      if(S.name&&S.email){
        goTo("track");
        return;
      }
      // Safety net: a session exists, there's no saved profile row,
      // and none of the cases above found enough info to proceed
      // straight to Track & Role. Rather than risk skipping a
      // student past the profile form with missing data, always fall
      // back to the full signup form.
      goTo("signup");
      return;
    }
  }catch(e){
    console.error("Supabase session check failed",e);
  }
  goTo("welcome");
}

// Calculates age in whole years from a YYYY-MM-DD date-of-birth string.
function calculateAge(dobStr){
  var dob=new Date(dobStr+"T00:00:00");
  var now=new Date();
  var age=now.getFullYear()-dob.getFullYear();
  var hasHadBirthdayThisYear=(now.getMonth()>dob.getMonth())||(now.getMonth()===dob.getMonth()&&now.getDate()>=dob.getDate());
  if(!hasHadBirthdayThisYear)age--;
  return age;
}

function getLangsForCountry(country){
  var primary=COUNTRY_LANGS[country]||[];
  if(primary.indexOf("English")<0) primary=primary.concat(["English"]);
  return primary;
}
function getAllSelectedLangs(){
  var a=Array.from(document.querySelectorAll("#lang-primary .chip.on")).map(function(c){return c.textContent;});
  var b=Array.from(document.querySelectorAll("#lang-other .chip.on")).map(function(c){var lbl=c.querySelector("span");return lbl?lbl.textContent:c.textContent;});
  return a.concat(b);
}
function renderLangSections(country,selected){
  selected=selected||[];
  var primary=getLangsForCountry(country);
  var other=LANGS.filter(function(l){return primary.indexOf(l)<0&&l!=="English";});
  var sDiv=document.getElementById("lang-suggested");
  var pDiv=document.getElementById("lang-primary");
  var oDiv=document.getElementById("lang-other");
  var oLabel=document.getElementById("lang-other-label");
  if(!pDiv||!oDiv) return;
  sDiv.style.display=primary.length>=1?"":"none";
  pDiv.innerHTML="";
  primary.forEach(function(lang){
    var c=document.createElement("div");c.className="chip";c.textContent=lang;
    if(selected.indexOf(lang)>=0)c.classList.add("on");
    c.style.borderColor="#AFA9EC";
    c.addEventListener("click",function(){c.classList.toggle("on");});
    pDiv.appendChild(c);
  });
  oLabel.textContent=primary.length>1?"Other languages":"Languages";
  oDiv.innerHTML="";
  other.forEach(function(lang){
    var c=document.createElement("div");c.className="chip";c.textContent=lang;
    if(selected.indexOf(lang)>=0)c.classList.add("on");
    c.addEventListener("click",function(){c.classList.toggle("on");});
    oDiv.appendChild(c);
  });
}

// Tappable team-type chip. Tapping it shows what it means right under it.
function xChip(xs){
  return "<button type=\"button\" class=\"xtag\" data-x=\""+esc(xs.key)+"\" title=\"What does this mean?\" style=\"font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;border:none;cursor:pointer;font-family:inherit;background:"+xs.bg+";color:"+xs.tc+";\"><i class=\"ti "+xs.icon+"\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>"+xs.lbl+" <i class=\"ti ti-info-circle\" style=\"font-size:10px;vertical-align:-1px;opacity:.7;\"></i></button>";

document.addEventListener("click",function(e){
  var t=e.target&&e.target.closest?e.target.closest(".xtag"):null;
  if(!t)return;
  e.preventDefault();e.stopPropagation();
  var row=t.parentNode;
  var next=row.nextSibling;
  if(next&&next.classList&&next.classList.contains("xexp")){var same=next.dataset.x===t.dataset.x;next.remove();if(same)return;}
  var xs=CROSS_STYLE[t.dataset.x];if(!xs)return;
  var d=document.createElement("div");d.className="xexp";d.dataset.x=t.dataset.x;
  d.style.cssText="font-size:12px;line-height:1.5;border-radius:8px;padding:7px 10px;margin:6px 0;background:"+xs.bg+";color:"+xs.tc+";";
  d.textContent=xs.exp;
  row.parentNode.insertBefore(d,row.nextSibling);
},true);

// Only competitions with a real, independently-verified deadline (month-day)
// get a status shown at all — no field means no claim. Compares month-day
// only (not year), since these deadlines recur annually and we don't track
// which exact year each one was last confirmed for. Once passed, this says
// so plainly rather than showing a stale date as if it were still current —
// matches the honest-by-default approach used everywhere else in Partnr.
var MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Parse a "YYYY-MM-DD" string into a Date at local midnight.
function parseISODate(iso){
  var p=iso.split("-");
  return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));
}
function formatISODate(iso,includeYear){
  var p=iso.split("-");
  var m=MONTH_NAMES[parseInt(p[1],10)-1];
  var d=parseInt(p[2],10);
  return includeYear?m+" "+d+" "+p[0]:m+" "+d;
}
function daysUntilISODate(iso){
  var now=new Date();now.setHours(0,0,0,0);
  var target=parseISODate(iso);
  return Math.round((target-now)/(1000*60*60*24));
}

// Every deadline chip and the Deadlines calendar both read from real,
// independently-verified data in Supabase (competition_deadlines),
// looked up by competition name - never a local estimate or rollover.
// Four possible states, matching exactly what the backend verified:
//  - confirmed: entry is open, deadline_date is a real upcoming date
//  - cycle_active: entry closed, but the competition is still running -
//    show cycle_end_date instead of a deadline
//  - not_yet_announced: nothing confirmed yet; show the honest observed
//    pattern (typical_reopen_period) only if one was actually found
//  - uncertain: show nothing at all
function deadlineChipHtml(compName){
  var d=DEADLINE_DATA[compName];
  if(!d)return "";
  if(d.status==="confirmed"&&d.deadline_date){
    return "<span style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:#FAEEDA;color:#854F0B;\"><i class=\"ti ti-clock\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>Deadline ~"+formatISODate(d.deadline_date)+"</span>";
  }
  if(d.status==="cycle_active"&&d.cycle_end_date){
    return "<span style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:#EAF3DE;color:#3B6D11;\"><i class=\"ti ti-refresh\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>Running through "+formatISODate(d.cycle_end_date,true)+"</span>";
  }
  if(d.status==="not_yet_announced"&&d.typical_reopen_period){
    return "<span style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:#F1EFE8;color:#6b6b6b;\"><i class=\"ti ti-calendar\" style=\"font-size:10px;vertical-align:-1px;margin-right:2px;\"></i>"+esc(d.typical_reopen_period)+"</span>";
  }
  return "";
}

// Shared list order everywhere competitions are browsed: most
// nationally/internationally recognized first (tier), then within a tier
// the ones with a real confirmed deadline surface before the ones we
// haven't verified an upcoming date for (soonest first), then alphabetical
// as the final, honest tiebreak.
function compareComps(a,b){
  // Team-up competitions first (cross-school, then same-school), then
  // individual "prep partner" ones. Then tier, then soonest deadline.
  var xr=function(c){return c.cross===true?0:c.cross==="prep"?2:1;};
  if(xr(a)!==xr(b))return xr(a)-xr(b);
  if(a.tier!==b.tier)return a.tier-b.tier;
  var da=DEADLINE_DATA[a.n],db=DEADLINE_DATA[b.n];
  var aHas=(da&&da.status==="confirmed"&&da.deadline_date)?1:0;
  var bHas=(db&&db.status==="confirmed"&&db.deadline_date)?1:0;
  if(aHas!==bHas)return bHas-aHas;
  if(aHas&&bHas){
    var diff=daysUntilISODate(da.deadline_date)-daysUntilISODate(db.deadline_date);
    if(diff!==0)return diff;
  }
  return a.n.localeCompare(b.n);
}

(function(){
  var rank=function(c){return c.cross===true?0:c.cross==="prep"?2:1;};
  var withIdx=COMPS.map(function(c,i){return {c:c,i:i};});
  withIdx.sort(function(a,b){return rank(a.c)-rank(b.c)||a.i-b.i;});
  COMPS.length=0;withIdx.forEach(function(x){COMPS.push(x.c);});
})();

function goTo(p){
  window.scrollTo(0,0);
  CURRENT_PAGE=p;
  if(EDIT_RETURN&&p!=="signup"&&p!=="track"&&p!=="skills"&&p!=="goals"&&p!=="loading")EDIT_RETURN=null;
  if(p==="welcome")rWelcome();
  else if(p==="signin")rSignIn();

  else if(p==="goals")rTrack(); // legacy alias - Goals merged into the Interests & Goals page
  else if(p==="loading")rLoading();

}

// Turns an onboarding page into a single-page editor.
function applyEditMode(p){
  var btn=document.getElementById({signup:"s2",track:"s3",skills:"s4"}[p]);
  if(btn)btn.textContent="Save and go back";
  var bar=document.querySelector(".sbar");if(bar)bar.style.display="none";
  if(p==="signup"){
    var h2=document.querySelector("#ROOT h2");if(h2)h2.textContent="Edit your profile";
    var sub=document.querySelector("#ROOT .sub");if(sub)sub.textContent="Change anything below, then tap Save and go back.";
    // The sign-in email is tied to the account, so it can't be changed here.
    var em=document.getElementById("iemail");
    if(em){em.readOnly=true;em.style.background="#f1f0ec";em.style.color="#6b6b6b";
      var note=document.createElement("div");note.style.cssText="font-size:12px;color:#6b6b6b;margin-top:4px;";
      note.textContent="This is the email you sign in with, so it can't be changed here.";em.parentNode.appendChild(note);}
  }
  var bk=document.getElementById("bk");
  if(bk){
    var nb=bk.cloneNode(false);
    nb.textContent=EDIT_RETURN==="matches"?"\u2190 Back to matches":"\u2190 Back to edit profile";
    bk.parentNode.replaceChild(nb,bk);
    nb.addEventListener("click",cancelEdit);
  }
  var root=document.getElementById("ROOT");
  if(root&&!document.getElementById("edit-note")){
    var note=document.createElement("div");

// Checks a link a student adds to their profile. Returns "" when it's
// fine, or the message to show. Links are for showing work, so personal
// social media (a way to reach someone privately) isn't allowed.
// Public pages for a club, nonprofit or project (Instagram, TikTok, YouTube...)
// are fine to show work. Messaging apps are a private way in, so they're not.
var MESSAGING_HOSTS=["snapchat.com","discord.gg","discord.com","whatsapp.com","wa.me","t.me","telegram.me","kik.com","groupme.com"];
// Turns "@vpwaterclub" or "@vpwaterclub (instagram)" into a real link.
function normalizeHandleLink(raw){
  var m=String(raw||"").trim().replace(/^https?:\/\//i,"").match(/^@([A-Za-z0-9._]{1,30})\s*(?:\(?\s*(instagram|insta|ig|tiktok|youtube|x|twitter)\s*\)?)?$/i);
  if(!m)return raw;
  var site=(m[2]||"instagram").toLowerCase();
  var base=site==="tiktok"?"https://www.tiktok.com/@":site==="youtube"?"https://www.youtube.com/@":(site==="x"||site==="twitter")?"https://x.com/":"https://www.instagram.com/";
  return base+m[1];
}
function linkProblem(url){
  var u;
  try{u=new URL(url);}catch(ex){return "That doesn't look like a working link. Try something like https://yourproject.org";}
  var host=u.hostname.toLowerCase().replace(/^www\./,"");
  if(!/^https?:$/.test(u.protocol)||host.indexOf(".")<0||/\s/.test(url))return "That doesn't look like a working link. Try something like https://yourproject.org";
  if(MESSAGING_HOSTS.some(function(h){return host===h||host.slice(-h.length-1)==="."+h;}))return "Messaging app links aren't allowed, so students can't be contacted outside Partnr. Link to a website, a public club page, GitHub, or a document instead.";
  return "";
}
function safeUrl(u){u=(u||"").toString();return /^https?:\/\//i.test(u)?esc(u):"#";}
function esc(s){return (s||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

function mkChips(id,items,sel,single){
  var div=document.getElementById(id);if(!div)return;
  div.innerHTML="";
  items.forEach(function(item){
    var c=document.createElement("div");c.className="chip";c.textContent=item;
    c.setAttribute("role","button");c.setAttribute("tabindex","0");
    var isOn=Array.isArray(sel)?sel.indexOf(item)>=0:sel===item;
    if(isOn)c.classList.add("on");
    c.setAttribute("aria-pressed",isOn?"true":"false");
    c.addEventListener("click",function(){
      if(single)div.querySelectorAll(".chip").forEach(function(x){x.classList.remove("on");x.setAttribute("aria-pressed","false");});
      c.classList.toggle("on");
      c.setAttribute("aria-pressed",c.classList.contains("on")?"true":"false");
    });
    addKbdActivation(c);
    div.appendChild(c);
  });

// Renders/refreshes the small Interest chips inside the panel from
// current S.track/S.secondary - called on page load and again any time
// a stronger signal (a picked competition, or an AI-read of typed
// interest text) updates the interest programmatically, so the chips
// never silently disagree with what's actually stored.
// Words in the project description that point to each interest. Matched
// as whole words, so "art" doesn't match "start" and "ai" doesn't match "said".
var INTEREST_WORDS={
  impact:["nonprofit","non profit","non-profit","charity","charities","volunteer","volunteering","community","help people","helps people","helping people","awareness","fundraiser","fundraising","donate","donations","social impact","homeless","underserved","tutoring","clean water","water","access","developing countries","rural","low-income","deficiency","malnutrition","food insecurity","refugees","conservation"],
  research:["research","researching","study","experiment","experiments","science","scientific","lab","biology","chemistry","physics","medicine","medical","cancer","melanoma","disease","diseases","health","neuroscience","psychology","isef","regeneron","publish","paper","data","crispr","gene","genes","genetics","gene editing","dna","biotech","iodine","nutrient","nutrients","deficiency","animal","animals","wildlife","conservation","species","ecology","environmental","climate","chemical","chemicals","bacteria","virus","water quality","microdosing"],
  business:["business","startup","start-up","company","entrepreneur","entrepreneurship","sell","selling","sales","marketing","brand","revenue","deca","fbla","customers","ecommerce","e-commerce"],
  tech:["app","apps","website","web app","coding","code","software","ai","machine learning","robot","robots","robotics","engineering","hardware","game","programming","python","javascript","hackathon","device","prototype","invent","invention","filter","sensor","3d print","3d printing","build a"],
  law:["law","legal","policy","mock trial","model un","government","politics","political","rights","justice","constitution","lawyer"],
  arts:["art","arts","film","movie","music","writing","write","story","stories","poetry","poem","design","photography","magazine","journalism","video","theater","theatre","animation"]
};
var INTEREST_MANUAL=false; // once the student taps an interest, stop auto-picking
function autoPickInterests(text){
  if(INTEREST_MANUAL)return;
  var t=" "+(text||"").toLowerCase().replace(/[^a-z0-9\- ]+/g," ").replace(/\s+/g," ")+" ";
  var scores=[];
  Object.keys(INTEREST_WORDS).forEach(function(k){
    var score=0,first=1e9;
    INTEREST_WORDS[k].forEach(function(w){
      var idx=t.indexOf(" "+w+" ");
      if(idx>=0){score++;if(idx<first)first=idx;}
    });
    if(score)scores.push({k:k,score:score,first:first});
  });
  if(!scores.length)return;
  // Strongest signals win; ties go to whichever was mentioned first.
  scores.sort(function(a,b){return b.score-a.score||a.first-b.first;});
  var top=scores.slice(0,2);
  // Of the two, whatever the student wrote about first is the main interest.
  top.sort(function(a,b){return a.first-b.first;});
  S.track=top[0].k;
  S.secondary=top.slice(1).map(function(x){return TR[x.k].n;});
  renderInterestChips();
  var e=document.getElementById("sec-err-interest-row");if(e)e.remove();
}
function renderInterestChips(){

// Math: horizontal chips, tap-cycle (Currently taking → Completed →
// removed). Selecting immediately counts - the question here is "what
// have you taken", already answered by naming the course.
// Interest categories, "everything else", and Math all render the same
// way: a collapsed accordion header naming the category and its real
// count, expanding to plain horizontal chips. Only one chip's rating
// is ever open at a time. Clicking a chip opens it (closing whatever
// else was open); picking a tag sets it without closing, so you can
// change your mind before moving on; clicking a different chip is what
// actually closes the previous one - and it collapses back to a
// compact label that still shows what you picked ("Python ·
// Intermediate", "Algebra 2 · Currently taking"), so nothing is lost
// from view, it just stops needing its own visible row once you've
// moved on. Math uses its own two-tag set (Completed / Currently
// taking) instead of the three proficiency tiers - checked by category
// type here so a math course is never accidentally rendered with the
// wrong tag set, wherever it's rendered from.
var openSkillKey=null;
var pendingHours="",pendingWhen="";
function chipHTML(catId,item){
  var cat=SKILL_CATS.find(function(c){return c.id===catId;});
  var isMath=cat&&cat.type==="course";
  var tagSet=isMath?MATH_TAGS:LEVELS;
  var key=catId+":"+item;
  var on=S.skillLevels[key]!==undefined;
  var lv=S.skillLevels[key];
  // A picked skill keeps its level buttons open until a level is chosen,
  // even after the student opens another skill.
  // Levels are off for now: every skill except math courses is one tap
  // to add and one tap to remove. Old saved levels still count as picked.
  var noLevel=(!isMath&&LEVEL_CATS.indexOf(catId)<0)||NO_LEVEL_ITEMS.has(item);
  var isOpen=openSkillKey===key||(on&&!lv&&!noLevel);
  if(noLevel){
    var notedOn=on;
    return "<button class=\"chip skill-chip no-level-chip"+(notedOn?" on":"")+"\" data-key=\""+key+"\" data-item=\""+esc(item)+"\">"+esc(item)+"</button>";
  }

function wireChipContainer(container){
  container.querySelectorAll(".skill-chip-remove").forEach(function(x){
    x.addEventListener("click",function(e){
      e.stopPropagation();
      delete S.skillLevels[this.dataset.key];
      if(openSkillKey===this.dataset.key)openSkillKey=null;
      rSkills();
    });
  });
  container.querySelectorAll(".skill-chip").forEach(function(btn){
    btn.addEventListener("click",function(){
      var key=this.dataset.key;
      if(this.classList.contains("no-level-chip")){
        if(S.skillLevels[key]!==undefined)delete S.skillLevels[key];
        else S.skillLevels[key]="noted";
        rSkills();
        return;
      }
      if(openSkillKey===key){
        if(!S.skillLevels[key])delete S.skillLevels[key];
        openSkillKey=null;
      } else {
        openSkillKey=key;
        if(S.skillLevels[key]===undefined)S.skillLevels[key]=null;
      }
      rSkills();
    });
  });
  container.querySelectorAll(".rate-btn").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      S.skillLevels[this.dataset.key]=this.dataset.lv;
      rSkills();
    });
  });
}
